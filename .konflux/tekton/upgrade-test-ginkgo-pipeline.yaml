---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: upgrade-test-ginkgo-pipeline
spec:
  description: |
    Upgrade release tests driven by the Ginkgo suite in
    openshift-pipelines/release-tests-ginkgo.

    Provisions an ephemeral Hypershift cluster via OpenShift-CI, then:
      1. installs the previously released operator from the prod
         redhat-operators catalog. The upgrade source alternates by OCP minor
         parity (odd = z-stream from the same channel when it has a released
         head on redhat-operators, else previous minor; even = previous minor);
         override with PRE_UPGRADE_CHANNEL,
      2. runs the pre-upgrade suite (sets up resources that must survive the
         upgrade),
      3. repoints the operator subscription at the candidate CatalogSource built
         from the Konflux snapshot index image and bumps it to the target
         channel (OLM upgrades the CSV via skipRange),
      4. runs the upgrade suite plus the post-upgrade suite and the full
         component regression.

    The catalog-source switch is done by an inline pipeline step because the
    ginkgo olm upgrade spec only changes the subscription channel, not its
    source. The ephemeral cluster only lives for about two hours, so the
    component suites run in parallel and fan out over GINKGO_PROCS processes.
  params:
    - name: SNAPSHOT
      type: string
      description: Snapshot of the application
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
    - name: NAMESPACE
      type: string
      description: Namespace the operator subscription lives in.
      default: openshift-operators
    - name: IMAGE
      type: string
      description: Image used by the inline helper steps (needs oc).
      default: quay.io/openshift-pipeline/ci:latest
    - name: GINKGO_IMAGE
      type: string
      description: Image used to build and run the Ginkgo suites.
      default: quay.io/openshift-pipeline/release-tests-ginkgo:latest
    - name: RELEASE_TEST_TASKS_REPO
      type: string
      description: Repository the Tekton task definitions are resolved from.
      default: https://github.com/openshift-pipelines/operator
    - name: RELEASE_TEST_TASKS_BRANCH
      type: string
      # Branch the Tekton task definitions (task-ginkgo-e2e,
      # task-setup-testing-accounts) are resolved from. Overridden per-run by the
      # IntegrationTestScenario.
      default: ginkgo-upgrade-tests
    - name: GIT_RELEASE_TESTS_URI
      type: string
      description: Ginkgo release-tests repository.
      default: https://github.com/openshift-pipelines/release-tests-ginkgo.git
    - name: GIT_RELEASE_TESTS_BRANCH
      type: string
      # Version-matched to the OSP build under test: release-v1.24 for 1.24.x
      # GA/z-stream, main for nightly/next. Overridden per-run by the
      # IntegrationTestScenario; defaults to main for nightly.
      default: main
    - name: LABEL_FILTER
      type: string
      description: Base Ginkgo label filter applied to every component suite.
      default: "e2e && !disconnected"
    - name: SUBSCRIPTION_NAME
      type: string
      description: Name of the operator subscription repointed during the upgrade.
      default: openshift-pipelines-operator-rh
    - name: PRE_UPGRADE_CATALOG_SOURCE
      type: string
      description: Catalog source the pre-upgrade (released) operator is installed from.
      default: redhat-operators
    - name: PRE_UPGRADE_CHANNEL
      type: string
      description: >-
        Starting channel for the pre-upgrade install. When empty it is derived
        from the OCP minor parity: odd = same channel z-stream when it has a
        released head on redhat-operators, else previous minor; even = previous
        minor (e.g. target pipelines-1.20 -> pipelines-1.19). Must be set
        explicitly when the target channel is "latest" (next/nightly/main),
        which has no derivable previous minor.
      default: ""
    - name: GINKGO_PROCS
      type: string
      description: Ginkgo parallel processes used per component suite.
      default: "4"
    - name: GINKGO_FLAKE_ATTEMPTS
      type: string
      description: >-
        Attempts per spec (ginkgo --flake-attempts) for the phase-1 suites and
        metrics. Absorbs transient failures; retried specs are listed as FLAKED
        in the task log. Not applied to operator suites, whose serial retries
        would eat into the two-hour cluster budget.
      default: "2"
    - name: OCP_RELEASE_STREAM
      type: string
      description: |
        Which OpenShift release payload to provision: "auto" (default) probes the
        stable upgrade graph for the target minor and falls back to the nightly
        payload when no GA release exists yet (e.g. a pre-GA 4.23). Set to "stable"
        or "nightly" to force a specific stream.
      default: "auto"
    - name: ARM_COMPUTE_NODE_TYPE
      type: string
      description: AWS instance type used for the hosted cluster's compute nodes when the OCP minor is odd (arm64).
      default: "m6g.2xlarge"
    - name: AMD64_COMPUTE_NODE_TYPE
      type: string
      description: AWS instance type used for the hosted cluster's compute nodes when the OCP minor is even (amd64).
      default: "m5.2xlarge"
    - name: WAIT_FOR_TEARDOWN_TIMEOUT
      type: string
      description: |
        How long the provision-ephemeral-cluster task waits for the tearDown
        signal before auto-deprovisioning the cluster. Empty uses the task
        default (2h); set a longer duration (e.g. 4h) so long-running suites
        such as auto-prune can finish within the cluster lifetime.
      default: "4h"

  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: extract-ocp-version
      runAfter:
        - parse-metadata
      params:
        - name: componentName
          value: "$(tasks.parse-metadata.results.component-name)"
        - name: releaseStream
          value: "$(params.OCP_RELEASE_STREAM)"
        - name: armNodeType
          value: "$(params.ARM_COMPUTE_NODE_TYPE)"
        - name: amdNodeType
          value: "$(params.AMD64_COMPUTE_NODE_TYPE)"
      taskSpec:
        params:
          - name: componentName
            type: string
          - name: releaseStream
            type: string
            default: "auto"
          - name: armNodeType
            type: string
            default: "m6g.2xlarge"
          - name: amdNodeType
            type: string
            default: "m5.2xlarge"
        results:
          - name: ocpVersion
            description: The OCP minor version extracted from component name (e.g. 4.20)
          - name: releases
            description: |
              The ci-operator "releases" JSON for the provision task. Uses the stable
              release payload for GA minors, or the nightly candidate payload for
              pre-GA minors (no stable release yet).
          - name: computeNodeType
            description: |
              AWS instance type for the hosted cluster's compute nodes. ARM
              (Graviton) instance for odd OCP minors, amd64 for even OCP minors.
          - name: clusterArch
            description: Target compute architecture for the hosted cluster workers (arm64 or amd64).
          - name: fips
            description: Whether the hosted cluster is provisioned in FIPS mode ("true" for OCP minors <= 20, otherwise "false").
        steps:
          - name: extract-version
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPONENT_NAME
                value: "$(params.componentName)"
              - name: RELEASE_STREAM
                value: "$(params.releaseStream)"
              - name: ARM_NODE_TYPE
                value: "$(params.armNodeType)"
              - name: AMD_NODE_TYPE
                value: "$(params.amdNodeType)"
            script: |
              #!/usr/bin/env bash
              set -e

              # Validate the release-stream override up front so a typo fails
              # loudly instead of silently falling through to the stable payload.
              case "$RELEASE_STREAM" in
                auto|stable|nightly) ;;
                *)
                  echo "ERROR: invalid OCP_RELEASE_STREAM '$RELEASE_STREAM'; expected one of: auto, stable, nightly" >&2
                  exit 1
                  ;;
              esac

              # Extract OCP minor version from COMPONENT_NAME
              # Expected format: operator-1-22-index-4-20 -> 4.20
              echo "Component Name: $COMPONENT_NAME"

              VERSION_PATTERN=$(echo "$COMPONENT_NAME" | grep -oE '[0-9]+-[0-9]+' | tail -1)

              if [ -z "$VERSION_PATTERN" ]; then
                echo "Warning: Could not extract version from component name, using default"
                OCP_VERSION="4.20"
              else
                OCP_VERSION=$(echo "$VERSION_PATTERN" | tr '-' '.')
                echo "Extracted OCP Version: $OCP_VERSION"
              fi

              echo -n "$OCP_VERSION" | tee $(results.ocpVersion.path)
              echo

              # Decide the hosted cluster's compute architecture from the OCP minor
              # parity: odd minors run on arm64, even minors on amd64.
              OCP_MINOR="${OCP_VERSION#*.}"
              if [ $(( OCP_MINOR % 2 )) -eq 1 ]; then
                COMPUTE_NODE_TYPE="$ARM_NODE_TYPE"
                CLUSTER_ARCH="arm64"
              else
                COMPUTE_NODE_TYPE="$AMD_NODE_TYPE"
                CLUSTER_ARCH="amd64"
              fi
              echo "Architecture decision: OCP ${OCP_VERSION} (minor ${OCP_MINOR}) -> arch=${CLUSTER_ARCH}, computeNodeType=${COMPUTE_NODE_TYPE}"

              # Enable FIPS only for OCP 4.20 and older minors.
              if [ "$OCP_MINOR" -le 20 ]; then
                FIPS="true"
              else
                FIPS="false"
              fi
              echo "FIPS decision: OCP ${OCP_VERSION} (minor ${OCP_MINOR}) -> FIPS=${FIPS}"

              echo -n "$COMPUTE_NODE_TYPE" | tee $(results.computeNodeType.path)
              echo
              echo -n "$CLUSTER_ARCH" | tee $(results.clusterArch.path)
              echo
              echo -n "$FIPS" | tee $(results.fips.path)
              echo

              # Decide which release payload to provision. A pre-GA minor (e.g. 4.23
              # before it ships) has no release on the stable channel, so the
              # ci-operator stable resolution returns an empty list and provisioning
              # fails at input resolution. In that case provision the nightly payload.
              stream="$RELEASE_STREAM"
              if [ "$stream" = "auto" ]; then
                graph="https://api.openshift.com/api/upgrades_info/graph?arch=multi&channel=stable-${OCP_VERSION}"
                echo "Probing stable channel for ${OCP_VERSION}: $graph"
                # Default to stable so a probe/network error preserves current behavior
                # (GA minors keep working); only switch to nightly on a definitive
                # empty release list.
                stream="stable"
                if resp=$(curl -fsS --connect-timeout 10 --max-time 30 "$graph" 2>/dev/null); then
                  if echo "$resp" | grep -q '"nodes":\[\]'; then
                    echo "No GA release found on stable-${OCP_VERSION}; using nightly payload."
                    stream="nightly"
                  else
                    echo "Found GA releases on stable-${OCP_VERSION}; using stable payload."
                  fi
                else
                  echo "WARN: could not probe the stable upgrade graph; defaulting to stable."
                fi
              fi

              if [ "$stream" = "nightly" ]; then
                releases="{\"latest\":{\"candidate\":{\"product\":\"ocp\",\"stream\":\"nightly\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              else
                releases="{\"latest\":{\"release\":{\"channel\":\"stable\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              fi
              echo "Selected release stream: $stream"
              echo "releases: $releases"
              printf '%s' "$releases" | tee $(results.releases.path)

    - name: provision-ephemeral-cluster
      runAfter:
        - extract-ocp-version
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: releases
          value: '$(tasks.extract-ocp-version.results.releases)'
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "$(tasks.extract-ocp-version.results.computeNodeType)", "HYPERSHIFT_NODE_ARCH": "$(tasks.extract-ocp-version.results.clusterArch)", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2", "CONTROL_PLANE_NODE_SELECTOR": "kubernetes.io/arch=$(tasks.extract-ocp-version.results.clusterArch)", "FIPS": "$(tasks.extract-ocp-version.results.fips)", "IMAGE_CONTENT_SOURCES": "- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.redhat.io/openshift-pipelines\n- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.stage.redhat.io/openshift-pipelines"}'
        - name: waitForTearDownTimeout
          value: "$(params.WAIT_FOR_TEARDOWN_TIMEOUT)"

    # Configure Loki and OpenShift Logging, required by the Results configuration
    # applied during the Ginkgo install suite.
    - name: configure-loki-logging
      runAfter:
        - provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-configure-loki-logging.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # Create the candidate CatalogSource from the Konflux snapshot index image and
    # derive the target channel from the release branch of the snapshot. The
    # pre-upgrade install does NOT use this source; it is switched in only for the
    # upgrade step (see switch-to-upgrade-catalog).
    - name: create-catalog-source
      runAfter:
        - release-tests-pre-upgrade
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: channel
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: INDEX_IMAGE
              value: "$(tasks.parse-metadata.results.component-container-image)"
            - name: RELEASE_BRANCH
              value: "$(tasks.parse-metadata.results.target-git-branch)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: extract-channel-name
            script: |
              #!/usr/bin/env bash
              set -x
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                CHANNEL="latest"
              else
                CHANNEL=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo -n "$CHANNEL" | tee $(results.channel.path)

          - name: create-catalog
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              cp /credentials/kubeconfig /tmp/kubeconfig
              cat <<EOF | oc apply -f-
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: "custom-osp-catalog"
                  namespace: openshift-marketplace
                spec:
                  sourceType: grpc
                  image: $INDEX_IMAGE
                  displayName: "Custom OSP Catalog"
                  publisher: Red Hat Local
                  updateStrategy:
                    registryPoll:
                      interval: 30m
              EOF

    # Determine the pre-upgrade (starting) channel. Honour PRE_UPGRADE_CHANNEL when
    # set, otherwise derive the previous minor of the target channel. The target
    # channel is derived from the operator release branch here, so this task is
    # self-contained and does not depend on create-catalog-source (which is built
    # later, after the pre-upgrade resources exist). Fails fast when the target is
    # "latest" and no override was given.
    # Resolve the upgrade source channel ("from" version) from the OCP minor parity.
    # Parity is a CI convenience to spread both upgrade types across the OCP matrix:
    #   Odd OCP minor  -> same channel pipelines-X.Y (z-stream) when it has a released
    #                     head on redhat-operators, else previous minor.
    #   Even OCP minor -> previous minor pipelines-X.(Y-1).
    # PRE_UPGRADE_CHANNEL overrides.
    - name: derive-channels
      runAfter:
        - provision-ephemeral-cluster
        - extract-ocp-version
      params:
        - name: releaseBranch
          value: "$(tasks.parse-metadata.results.target-git-branch)"
        - name: override
          value: "$(params.PRE_UPGRADE_CHANNEL)"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: releaseBranch
            type: string
          - name: override
            type: string
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: previousChannel
            type: string
        volumes:
          # Guest cluster kubeconfig, for reading the redhat-operators packagemanifest.
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        steps:
          - name: derive
            image: $(params.IMAGE)
            env:
              - name: RELEASE_BRANCH
                value: "$(params.releaseBranch)"
              - name: OVERRIDE
                value: "$(params.override)"
              - name: OCP_VERSION
                value: "$(tasks.extract-ocp-version.results.ocpVersion)"
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
                readOnly: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [[ -n "$OVERRIDE" ]]; then
                echo "Using PRE_UPGRADE_CHANNEL override: $OVERRIDE"
                echo -n "$OVERRIDE" | tee $(results.previousChannel.path)
                exit 0
              fi

              cp /credentials/kubeconfig /tmp/kubeconfig

              # Is a channel exposed with a released head on the prod redhat-operators catalog
              # (the catalog install-pre-upgrade-operator installs from)? The packagemanifest
              # populates shortly after provisioning, so poll until it is available.
              #   0: present   1: catalog populated but channel absent   2: undetermined
              redhat_operators_has_channel() {
                local want="$1" channels=""
                for i in $(seq 1 30); do
                  channels=$(oc get packagemanifests -n openshift-marketplace \
                    -l "catalog=redhat-operators" \
                    --field-selector "metadata.name=openshift-pipelines-operator-rh" \
                    -o jsonpath='{.items[0].status.channels[*].name}' 2>/dev/null || true)
                  [[ -n "$channels" ]] && break
                  echo "  waiting for redhat-operators packagemanifest (attempt $i)..." >&2
                  sleep 10
                done
                echo "redhat-operators channels: ${channels:-<none>}" >&2
                [[ -n "$channels" ]] || return 2
                for c in $channels; do
                  [[ "$c" == "$want" ]] && return 0
                done
                return 1
              }

              # Target (upgrade "to") channel, derived from the operator release branch.
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                TARGET="latest"
              else
                TARGET=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo "Release branch: $RELEASE_BRANCH -> target channel: $TARGET"

              if [[ "$TARGET" =~ ^pipelines-([0-9]+)\.([0-9]+)$ ]]; then
                MAJ="${BASH_REMATCH[1]}"
                MIN="${BASH_REMATCH[2]}"
                PREV_MINOR_CHANNEL="pipelines-${MAJ}.$((MIN - 1))"

                OCP_MINOR=$(echo "$OCP_VERSION" | cut -d. -f2)
                if ! [[ "$OCP_MINOR" =~ ^[0-9]+$ ]]; then
                  echo "ERROR: could not parse OCP minor from OCP_VERSION '$OCP_VERSION'." >&2
                  exit 1
                fi

                if (( OCP_MINOR % 2 == 1 )); then
                  rc=0
                  redhat_operators_has_channel "$TARGET" || rc=$?
                  case "$rc" in
                    0)
                      PREV="$TARGET"
                      echo "OCP $OCP_VERSION (minor $OCP_MINOR, odd); $TARGET available -> z-stream upgrade; source $PREV"
                      ;;
                    1)
                      PREV="$PREV_MINOR_CHANNEL"
                      echo "OCP $OCP_VERSION (minor $OCP_MINOR, odd); $TARGET not yet released -> minor upgrade; source $PREV"
                      ;;
                    *)
                      echo "ERROR: redhat-operators catalog did not confirm its channels within the timeout; cannot determine the upgrade source." >&2
                      echo "Re-run the pipeline, or set PRE_UPGRADE_CHANNEL explicitly (e.g. pipelines-1.23)." >&2
                      exit 1
                      ;;
                  esac
                else
                  PREV="$PREV_MINOR_CHANNEL"
                  echo "OCP $OCP_VERSION (minor $OCP_MINOR, even) -> minor upgrade; source $PREV"
                fi
                echo -n "$PREV" | tee $(results.previousChannel.path)
              else
                echo "ERROR: cannot derive a previous channel from target '$TARGET'." >&2
                echo "nightly/next/main builds have no released predecessor; set PRE_UPGRADE_CHANNEL explicitly (e.g. pipelines-1.19)." >&2
                exit 1
              fi

    # Install the previously released operator from the prod redhat-operators
    # catalog on the derived previous channel. Serial on purpose: the install spec
    # is a single Ordered container. Retries:2 mirrors the e2e pipeline because OLM
    # install is occasionally flaky.
    - name: install-pre-upgrade-operator
      runAfter:
        - configure-loki-logging
        - derive-channels
      timeout: "45m"
      retries: 2
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "install"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: CATALOG_SOURCE
          value: "$(params.PRE_UPGRADE_CATALOG_SOURCE)"
        - name: CHANNEL
          value: "$(tasks.derive-channels.results.previousChannel)"
        - name: SUBSCRIPTION_NAME
          value: "$(params.SUBSCRIPTION_NAME)"

    # Pre-upgrade suite (PIPELINES-18): sets up an Eventlistener with TLS, an S2I
    # pipeline, a linked secret and olm skiprange expectations that the post-upgrade
    # suite verifies survived the upgrade. tests/operator package, label pre-upgrade.
    - name: release-tests-pre-upgrade
      onError: continue
      runAfter:
        - install-pre-upgrade-operator
      timeout: "40m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "pre-upgrade && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "35m"
        - name: CATALOG_SOURCE
          value: "$(params.PRE_UPGRADE_CATALOG_SOURCE)"
        - name: CHANNEL
          value: "$(tasks.derive-channels.results.previousChannel)"
        - name: SUBSCRIPTION_NAME
          value: "$(params.SUBSCRIPTION_NAME)"

    # Repoint the operator subscription at the candidate CatalogSource and bump it to
    # the target channel. The ginkgo olm upgrade spec can only change the channel, not
    # the source, so the source switch is done here. Both are patched together so OLM
    # resolves the candidate CSV on the target channel (via skipRange) in one step.
    - name: switch-to-upgrade-catalog
      runAfter:
        - create-catalog-source
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: subscriptionName
          value: "$(params.SUBSCRIPTION_NAME)"
        - name: namespace
          value: "$(params.NAMESPACE)"
        - name: targetChannel
          value: "$(tasks.create-catalog-source.results.channel)"
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
          - name: subscriptionName
            type: string
          - name: namespace
            type: string
          - name: targetChannel
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        steps:
          - name: switch-source
            image: $(params.IMAGE)
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
              - name: SUBSCRIPTION_NAME
                value: "$(params.subscriptionName)"
              - name: SUBSCRIPTION_NAMESPACE
                value: "$(params.namespace)"
              - name: TARGET_CHANNEL
                value: "$(params.targetChannel)"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
                readOnly: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              cp /credentials/kubeconfig /tmp/kubeconfig

              # Wait for the candidate catalog source to be serving before repointing.
              echo "Waiting for custom-osp-catalog CatalogSource to be READY..."
              for i in $(seq 1 60); do
                STATE=$(oc get catalogsource custom-osp-catalog -n openshift-marketplace \
                  -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || true)
                echo "  attempt $i: state=${STATE:-<none>}"
                [[ "$STATE" == "READY" ]] && break
                sleep 10
              done
              if [[ "${STATE:-}" != "READY" ]]; then
                echo "ERROR: custom-osp-catalog did not become READY in time."
                exit 1
              fi

              # Record the currently-installed CSV so we can detect the actual upgrade
              # transition below. The ginkgo olm upgrade spec only waits for a non-empty
              # installedCSV that is Succeeded, which the previous GA CSV already
              # satisfies, so it can short-circuit on the old CSV while OLM is still
              # rolling the new one. Block here until a DIFFERENT CSV is installed and
              # Succeeded before the downstream upgrade/post-upgrade suites run.
              PREV_CSV=$(oc get subscription "${SUBSCRIPTION_NAME}" -n "${SUBSCRIPTION_NAMESPACE}" \
                -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
              echo "Pre-upgrade installedCSV: ${PREV_CSV:-<none>}"

              echo "Repointing subscription ${SUBSCRIPTION_NAME} (ns ${SUBSCRIPTION_NAMESPACE})"
              echo "  source  -> custom-osp-catalog (openshift-marketplace)"
              echo "  channel -> ${TARGET_CHANNEL}"
              oc patch subscription "${SUBSCRIPTION_NAME}" \
                -n "${SUBSCRIPTION_NAMESPACE}" --type merge \
                -p "{\"spec\":{\"source\":\"custom-osp-catalog\",\"sourceNamespace\":\"openshift-marketplace\",\"channel\":\"${TARGET_CHANNEL}\"}}"
              oc get subscription "${SUBSCRIPTION_NAME}" -n "${SUBSCRIPTION_NAMESPACE}" \
                -o jsonpath='{.spec.source} {.spec.channel}{"\n"}'

              echo "Waiting for the operator to upgrade to a new Succeeded CSV..."
              NEW_CSV=""
              for i in $(seq 1 90); do
                CUR_CSV=$(oc get subscription "${SUBSCRIPTION_NAME}" -n "${SUBSCRIPTION_NAMESPACE}" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                if [[ -n "$CUR_CSV" && "$CUR_CSV" != "$PREV_CSV" ]]; then
                  PHASE=$(oc get csv "$CUR_CSV" -n "${SUBSCRIPTION_NAMESPACE}" \
                    -o jsonpath='{.status.phase}' 2>/dev/null || true)
                  echo "  attempt $i: installedCSV=$CUR_CSV phase=${PHASE:-<none>}"
                  if [[ "$PHASE" == "Succeeded" ]]; then
                    NEW_CSV="$CUR_CSV"
                    break
                  fi
                else
                  echo "  attempt $i: installedCSV=${CUR_CSV:-<none>} (unchanged)"
                fi
                sleep 10
              done
              if [[ -z "$NEW_CSV" ]]; then
                echo "ERROR: operator did not upgrade to a new Succeeded CSV (still ${PREV_CSV:-<none>})."
                exit 1
              fi
              echo "Operator upgraded: ${PREV_CSV:-<none>} -> $NEW_CSV"

    # Upgrade suite (olm PIPELINES-09-TC02): re-asserts the target channel and waits
    # for the subscription/CSV to reach Succeeded, then validates the operator is
    # healthy after the upgrade (TektonConfig, RBAC, quickstarts).
    - name: update-pipelines-operator
      runAfter:
        - switch-to-upgrade-catalog
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "upgrade"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"
        - name: UPGRADE_CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"
        - name: SUBSCRIPTION_NAME
          value: "$(params.SUBSCRIPTION_NAME)"

    # Post-upgrade suite (PIPELINES-19): verifies the resources created by the
    # pre-upgrade suite survived, TLS/S2I pipelines still work and olm skiprange is
    # correct after the upgrade. tests/operator package, label post-upgrade.
    - name: release-tests-post-upgrade
      onError: continue
      runAfter:
        - update-pipelines-operator
      timeout: "40m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "post-upgrade && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "35m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"
        - name: SUBSCRIPTION_NAME
          value: "$(params.SUBSCRIPTION_NAME)"

    # ------------------------------------------------------------------
    # Post-upgrade component regression (mirrors the e2e pipeline, gated after
    # the upgrade). Every suite carries no dependency on another so Tekton runs
    # them in parallel; onError: continue keeps the fan-out going when one fails
    # while the finally task still fails the PipelineRun.
    # ------------------------------------------------------------------
    # Non-admin post-upgrade suites (pipelines, triggers) impersonate the "user"
    # account, so create the test User objects and their RBAC after the upgrade
    # completes and before those suites run. Mirrors release-tests-infra's
    # setup-testing-accounts step: only pipelines and triggers run non-admin;
    # every other suite runs as the provisioned cluster-admin (task-ginkgo-e2e
    # RUN_AS default "admin"). This task only creates Users/RoleBindings (no oauth
    # changes), so admin suites fanned out in parallel are unaffected.
    - name: setup-testing-accounts
      runAfter:
        - update-pipelines-operator
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-setup-testing-accounts.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    - name: release-tests-pipelines
      onError: continue
      runAfter:
        - update-pipelines-operator
        - setup-testing-accounts
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
