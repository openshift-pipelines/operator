          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/chains/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-metrics
      onError: continue
      runAfter:
        - update-pipelines-operator
      timeout: "65m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/metrics/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "50m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Operator suites (rbac, addon) rewrite cluster-wide TektonConfig settings and
    # run serial; the upgrade/pre-upgrade/post-upgrade specs are filtered out here.
    # They are gated after the component suites and run in parallel with each other;
    # tekton-pruner is gated after both of them (see note below).
    - name: release-tests-rbac
      onError: continue
      runAfter:
        - release-tests-post-upgrade
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-results
        - release-tests-versions
        - release-tests-tls
        - release-tests-ecosystem
        - release-tests-pac
        - release-tests-manual-approval
        - release-tests-chains
        - release-tests-metrics
      timeout: "25m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && rbac && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-addon
      onError: continue
      runAfter:
        - release-tests-post-upgrade
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-results
        - release-tests-versions
        - release-tests-tls
        - release-tests-ecosystem
        - release-tests-pac
        - release-tests-manual-approval
        - release-tests-chains
        - release-tests-metrics
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && addon && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "25m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # tekton-pruner is gated to the very end: it continuously rewrites the
    # TektonConfig pruner settings and then waits on the operator reaching
    # Installed=True. Running it next to the other TektonConfig-mutating suites
    # (notably rbac, whose rbac-disable spec also waits on Installed=True) keeps the
    # single TektonConfig CR perpetually reconciling, so rbac times out at
    # Installed=False. It therefore runs after rbac and addon.
    #
    # auto-prune mutates cluster-wide pruning config and has a long TTL-based
    # test tail, so it needs the extended ephemeral-cluster lifetime (see the
    # WAIT_FOR_TEARDOWN_TIMEOUT param). It is serialized after rbac/addon (they
    # also mutate TektonConfig), and tekton-pruner is gated after it.
    - name: release-tests-tekton-pruner
      onError: continue
      runAfter:
        - release-tests-auto-prune
      timeout: "70m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && tekton-pruner && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "55m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # auto-prune mutates cluster-wide pruning config and has a long TTL-based
    # test tail, so it needs the extended ephemeral-cluster lifetime (see the
    # WAIT_FOR_TEARDOWN_TIMEOUT param). It is serialized after rbac/addon (they
    # also mutate TektonConfig), and tekton-pruner is gated after it.
    - name: release-tests-auto-prune
      onError: continue
      runAfter:
        - release-tests-rbac
        - release-tests-addon
      timeout: "70m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: WAIT_FOR_UPGRADED_CLI
          value: "true"
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && auto-prune && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "55m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

  finally:
    # Verify aggregate status and fail the pipeline if any test task failed. On
    # failure it also enumerates the failed suite tasks and prints a ready-to-paste
    # rerun filter.
    - name: verify-e2e-tests-status
      params:
        - name: aggregateStatus
          value: "$(tasks.status)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
      taskSpec:
        params:
          - name: aggregateStatus
          - name: pipelineRunName
        steps:
          - name: verify-aggregate-status
            image: $(params.IMAGE)
            script: |
              #!/usr/bin/env bash
              echo "📋 Aggregate Status: $(params.aggregateStatus)"

              if [[ "$(params.aggregateStatus)" == "Succeeded" ]]; then
                echo "✅ All tasks succeeded!"
                exit 0
              fi

              echo "❌ Pipeline contains failed tasks!"

              # The PipelineRun lives in this (Konflux) cluster, so the in-cluster
              # service account token lets us read it back and list the failed suites.
              pr="$(params.pipelineRunName)"
              # Tab-separated per failed suite: <task>\t<MODE>\t<TEST_PATH>. Capturing
              # each TaskRun's resolved MODE/TEST_PATH lets the rerun hint reproduce the
              # exact label filter and package instead of guessing from the task name
              # (e.g. manual-approval runs tests/mag/, triggers-tls filters on tls).
              failed=""
              if command -v oc >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
                failed="$(oc get pipelinerun "${pr}" -o json 2>/dev/null \
                  | jq -r '.status.childReferences[]?.name' \
                  | while read -r tr; do
                      [[ -z "${tr}" ]] && continue
                      cond="$(oc get taskrun "${tr}" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}' 2>/dev/null)"
                      name="$(oc get taskrun "${tr}" -o jsonpath='{.metadata.labels.tekton\.dev/pipelineTask}' 2>/dev/null)"
                      if [[ "${cond}" == "False" && ( "${name}" == release-tests-* || "${name}" == *upgrade* ) ]]; then
                        mode="$(oc get taskrun "${tr}" -o jsonpath='{.spec.params[?(@.name=="MODE")].value}' 2>/dev/null)"
                        path="$(oc get taskrun "${tr}" -o jsonpath='{.spec.params[?(@.name=="TEST_PATH")].value}' 2>/dev/null)"
                        printf '%s\t%s\t%s\n' "${name}" "${mode}" "${path}"
                      fi
                    done | sort -u)"
              fi

              if [[ -n "${failed}" ]]; then
                echo ""
                echo "🔁 Failed suites:"
                echo "${failed}" | cut -f1 | sed 's/^/   - /'
                echo ""
                echo "💡 Rerun only the failed suites by restarting the PipelineRun with"
                echo "   these tasks (others can be pruned from the run), or run locally"
                echo "   from a release-tests-ginkgo checkout:"
                # printf %q shell-quotes the filter (preserving && and !) and the path
                # so each printed command can be pasted into a shell as-is.
                while IFS=$'\t' read -r name mode path; do
                  [[ -z "${name}" ]] && continue
                  qpath="$(printf '%q' "${path:-./tests/}")"
                  if [[ -n "${mode}" ]]; then
                    qmode="$(printf '%q' "${mode}")"
                    echo "   ginkgo run --label-filter=${qmode} ${qpath}"
                  else
                    echo "   ginkgo run ${qpath}"
                  fi
                done <<< "${failed}"
              else
                echo "💡 Check individual task logs for detailed error information"
                echo "   (could not enumerate failed suites automatically)."
              fi

              exit 1
