  finally:
    # ==========================================================================
    # Always-run - Aggregate suite results and fail the pipeline on any failure
    # ==========================================================================
    # Deprovision disabled to save pipeline completion time
    # Ephemeral clusters are automatically pruned after 4 hours, so no manual cleanup is required

    # Verify aggregate status, print a per-suite summary and a rerun hint for failed suites
    - name: verify-e2e-tests-status
      params:
        - name: aggregateStatus
          value: "$(tasks.status)"
        - name: suiteStatuses
          value: |
            install-pre-upgrade-operator=$(tasks.install-pre-upgrade-operator.status)
            release-tests-pre-upgrade=$(tasks.release-tests-pre-upgrade.status)
            update-pipelines-operator=$(tasks.update-pipelines-operator.status)
            release-tests-post-upgrade=$(tasks.release-tests-post-upgrade.status)
            release-tests-versions=$(tasks.release-tests-versions.status)
            release-tests-pipelines=$(tasks.release-tests-pipelines.status)
            release-tests-triggers=$(tasks.release-tests-triggers.status)
            release-tests-triggers-tls=$(tasks.release-tests-triggers-tls.status)
            release-tests-chains=$(tasks.release-tests-chains.status)
            release-tests-pac=$(tasks.release-tests-pac.status)
            release-tests-results=$(tasks.release-tests-results.status)
            release-tests-metrics=$(tasks.release-tests-metrics.status)
            release-tests-rbac=$(tasks.release-tests-rbac.status)
            release-tests-addon=$(tasks.release-tests-addon.status)
            release-tests-manual-approval=$(tasks.release-tests-manual-approval.status)
            release-tests-ecosystem=$(tasks.release-tests-ecosystem.status)
            release-tests-tekton-pruner=$(tasks.release-tests-tekton-pruner.status)
      taskSpec:
        params:
          - name: aggregateStatus
          - name: suiteStatuses
        steps:
          - image: $(params.IMAGE)
            name: verify-aggregate-status
            script: |
              #!/usr/bin/env bash
              echo "📋 Aggregate Status: $(params.aggregateStatus)"
              echo ""
              echo "Per-suite results:"

              failed=""
              while IFS='=' read -r name status; do
                name="$(echo "$name" | tr -d '[:space:]')"
                status="$(echo "$status" | tr -d '[:space:]')"
                [ -z "$name" ] && continue
                if [[ "$status" == "Succeeded" || "$status" == "Completed" ]]; then
                  echo "  ✅ ${name}: ${status}"
                elif [[ "$status" == "None" || -z "$status" ]]; then
                  echo "  ⏭️  ${name}: skipped (${status:-None})"
                else
                  echo "  ❌ ${name}: ${status}"
                  failed="${failed} ${name}"
                fi
              done <<'EOF'
              $(params.suiteStatuses)
              EOF

              if [[ -n "$failed" ]]; then
                echo ""
                echo "❌ Failed suites:${failed}"
                echo "💡 To rerun only the failed suites, set TEST_SUITES to:${failed}"
              fi

              if [[ "$(params.aggregateStatus)" != "Succeeded" ]]; then
                echo ""
                echo "❌ Pipeline contains failed tasks!"
                echo "💡 Check individual task logs for detailed error information"
                exit 1
              fi

              echo ""
              echo "✅ All tasks succeeded!"
