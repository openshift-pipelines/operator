---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: upgrade-test-pipeline
spec:
  description: |
    An integration test which provisions an ephemeral Hypershift cluster via OpenShift-CI,
    installs the latest released OpenShift Pipelines operator from the prod redhat-operators
    catalog, creates upgrade-persistent resources, then upgrades the operator to the bundle
    built from this Konflux snapshot and verifies those resources survived the upgrade.

    The upgrade source alternates by OCP minor parity to spread both upgrade types across the
    OCP matrix (a CI convenience, not a product requirement): odd OCP minor does a z-stream
    upgrade from the same channel pipelines-X.Y, even OCP minor does a minor upgrade from
    pipelines-X.(Y-1). The z-stream source is used only when pipelines-X.Y has a released head
    on redhat-operators; otherwise odd OCP falls back to the minor upgrade. Override with
    PRE_UPGRADE_CHANNEL.
  # ==========================================================================
  # Pipeline parameters
  # ==========================================================================
  params:
    - description: Snapshot of the application
      name: SNAPSHOT
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - description: Namespace where the Operator bundle will be deployed.
      name: NAMESPACE
      default: openshift-operators
      type: string
    - name: IMAGE
      type: string
      default: quay.io/openshift-pipeline/ci:latest
    - name: TAGS
      default: "(e2e | sanity)"
    - name: RELEASE_TEST_TASKS_REPO
      default: https://github.com/openshift-pipelines/operator
    - name: RELEASE_TEST_TASKS_BRANCH
      default: main
    - name: GIT_RELEASE_TESTS_URI
      default: https://github.com/openshift-pipelines/release-tests.git
    - description: |
        Override for the upgrade source channel (the "from" version), e.g. pipelines-1.23.
        Leave empty to auto-derive from OCP minor parity (odd = same channel z-stream when it
        has a released head on redhat-operators, else previous minor; even = previous minor).
      name: PRE_UPGRADE_CHANNEL
      default: ""
    - name: WAIT_FOR_TEARDOWN_TIMEOUT
      description: |
        How long the provision-ephemeral-cluster task waits for the tearDown
        signal before auto-deprovisioning the cluster. Empty uses the task
        default (2h); set a longer duration (e.g. 4h) so long-running suites
        such as auto-prune can finish within the cluster lifetime.
      default: "4h"
    - name: OCP_RELEASE_STREAM
      description: |
        Which OpenShift release payload to provision: "auto" (default) probes the
        stable upgrade graph for the target minor and falls back to the nightly
        payload when no GA release exists yet (e.g. a pre-GA 4.23). Set to "stable"
        or "nightly" to force a specific stream.
      default: "auto"
    - name: ARM_COMPUTE_NODE_TYPE
      description: AWS instance type used for the hosted cluster's compute nodes when the OCP minor is odd (arm64).
      default: "m6g.2xlarge"
    - name: AMD64_COMPUTE_NODE_TYPE
      description: AWS instance type used for the hosted cluster's compute nodes when the OCP minor is even (amd64).
      default: "m5.2xlarge"

  tasks:
    # ==========================================================================
    # Phase 1 - Provision the ephemeral cluster and configure logging
    # ==========================================================================
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: extract-ocp-version
      runAfter:
        - parse-metadata
      params:
        - name: componentName
          value: "$(tasks.parse-metadata.results.component-name)"
        - name: releaseStream
          value: "$(params.OCP_RELEASE_STREAM)"
        - name: armNodeType
          value: "$(params.ARM_COMPUTE_NODE_TYPE)"
        - name: amdNodeType
          value: "$(params.AMD64_COMPUTE_NODE_TYPE)"
      taskSpec:
        params:
          - name: componentName
            type: string
          - name: releaseStream
            type: string
            default: "auto"
          - name: armNodeType
            type: string
            default: "m6g.2xlarge"
          - name: amdNodeType
            type: string
            default: "m5.2xlarge"
        results:
          - name: ocpVersion
            description: The OCP minor version extracted from component name (e.g. 4.20)
          - name: releases
            description: |
              The ci-operator "releases" JSON for the provision task. Uses the stable
              release payload for GA minors, or the nightly candidate payload for
              pre-GA minors (no stable release yet).
          - name: computeNodeType
            description: |
              AWS instance type for the hosted cluster's compute nodes. ARM
              (Graviton) instance for odd OCP minors, amd64 for even OCP minors.
          - name: clusterArch
            description: Target compute architecture for the hosted cluster workers (arm64 or amd64).
          - name: fips
            description: Whether the hosted cluster is provisioned in FIPS mode ("true" for OCP minors <= 20, otherwise "false").
        steps:
          - name: extract-version
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPONENT_NAME
                value: "$(params.componentName)"
              - name: RELEASE_STREAM
                value: "$(params.releaseStream)"
              - name: ARM_NODE_TYPE
                value: "$(params.armNodeType)"
              - name: AMD_NODE_TYPE
                value: "$(params.amdNodeType)"
            script: |
              #!/usr/bin/env bash
              set -e

              # Validate the release-stream override up front so a typo fails
              # loudly instead of silently falling through to the stable payload.
              case "$RELEASE_STREAM" in
                auto|stable|nightly) ;;
                *)
                  echo "ERROR: invalid OCP_RELEASE_STREAM '$RELEASE_STREAM'; expected one of: auto, stable, nightly" >&2
                  exit 1
                  ;;
              esac

              # Extract OCP minor version from COMPONENT_NAME
              # Expected format: operator-1-22-index-4-20 -> 4.20
              echo "Component Name: $COMPONENT_NAME"

              VERSION_PATTERN=$(echo "$COMPONENT_NAME" | grep -oE '[0-9]+-[0-9]+' | tail -1)

              if [ -z "$VERSION_PATTERN" ]; then
                echo "Warning: Could not extract version from component name, using default"
                OCP_VERSION="4.20"
              else
                OCP_VERSION=$(echo "$VERSION_PATTERN" | tr '-' '.')
                echo "Extracted OCP Version: $OCP_VERSION"
              fi

              echo -n "$OCP_VERSION" | tee $(results.ocpVersion.path)
              echo

              # Decide the hosted cluster's compute architecture from the OCP minor
              # parity: odd minors run on arm64, even minors on amd64.
              OCP_MINOR="${OCP_VERSION#*.}"
              if [ $(( OCP_MINOR % 2 )) -eq 1 ]; then
                COMPUTE_NODE_TYPE="$ARM_NODE_TYPE"
                CLUSTER_ARCH="arm64"
              else
                COMPUTE_NODE_TYPE="$AMD_NODE_TYPE"
                CLUSTER_ARCH="amd64"
              fi
              echo "Architecture decision: OCP ${OCP_VERSION} (minor ${OCP_MINOR}) -> arch=${CLUSTER_ARCH}, computeNodeType=${COMPUTE_NODE_TYPE}"

              # Enable FIPS only for OCP 4.20 and older minors.
              if [ "$OCP_MINOR" -le 20 ]; then
                FIPS="true"
              else
                FIPS="false"
              fi
              echo "FIPS decision: OCP ${OCP_VERSION} (minor ${OCP_MINOR}) -> FIPS=${FIPS}"

              echo -n "$COMPUTE_NODE_TYPE" | tee $(results.computeNodeType.path)
              echo
              echo -n "$CLUSTER_ARCH" | tee $(results.clusterArch.path)
              echo
              echo -n "$FIPS" | tee $(results.fips.path)
              echo

              # Decide which release payload to provision. A pre-GA minor (e.g. 4.23
              # before it ships) has no release on the stable channel, so the
              # ci-operator stable resolution returns an empty list and provisioning
              # fails at input resolution. In that case provision the nightly payload.
              stream="$RELEASE_STREAM"
              if [ "$stream" = "auto" ]; then
                graph="https://api.openshift.com/api/upgrades_info/graph?arch=multi&channel=stable-${OCP_VERSION}"
                echo "Probing stable channel for ${OCP_VERSION}: $graph"
                # Default to stable so a probe/network error preserves current behavior
                # (GA minors keep working); only switch to nightly on a definitive
                # empty release list.
                stream="stable"
                if resp=$(curl -fsS --connect-timeout 10 --max-time 30 "$graph" 2>/dev/null); then
                  if echo "$resp" | grep -q '"nodes":\[\]'; then
                    echo "No GA release found on stable-${OCP_VERSION}; using nightly payload."
                    stream="nightly"
                  else
                    echo "Found GA releases on stable-${OCP_VERSION}; using stable payload."
                  fi
                else
                  echo "WARN: could not probe the stable upgrade graph; defaulting to stable."
                fi
              fi

              if [ "$stream" = "nightly" ]; then
                releases="{\"latest\":{\"candidate\":{\"product\":\"ocp\",\"stream\":\"nightly\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              else
                releases="{\"latest\":{\"release\":{\"channel\":\"stable\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              fi
              echo "Selected release stream: $stream"
              echo "releases: $releases"
              printf '%s' "$releases" | tee $(results.releases.path)

    - name: provision-ephemeral-cluster
      runAfter:
        - extract-ocp-version
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: releases
          value: '$(tasks.extract-ocp-version.results.releases)'
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "$(tasks.extract-ocp-version.results.computeNodeType)", "HYPERSHIFT_NODE_ARCH": "$(tasks.extract-ocp-version.results.clusterArch)", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2", "CONTROL_PLANE_NODE_SELECTOR": "kubernetes.io/arch=$(tasks.extract-ocp-version.results.clusterArch)", "FIPS": "$(tasks.extract-ocp-version.results.fips)", "IMAGE_CONTENT_SOURCES": "- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.redhat.io/openshift-pipelines\n- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.stage.redhat.io/openshift-pipelines"}'
        - name: waitForTearDownTimeout
          value: "$(params.WAIT_FOR_TEARDOWN_TIMEOUT)"

    # Configure Loki and OpenShift Logging
    - name: configure-loki-logging
      runAfter:
        - provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-configure-loki-logging.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # Resolve the upgrade source channel ("from" version) from the OCP minor parity.
    # ==========================================================================
    # Phase 2 - Install the previous GA and create upgrade-persistent resources
    # ==========================================================================
    # Parity is a CI convenience to spread both upgrade types across the OCP matrix:
    #   Odd OCP minor  -> same channel pipelines-X.Y (z-stream) when it has a released head on
    #                     redhat-operators, else previous minor.
    #   Even OCP minor -> previous minor pipelines-X.(Y-1).
    # PRE_UPGRADE_CHANNEL overrides.
    - name: derive-channels
      runAfter:
        - provision-ephemeral-cluster
        - extract-ocp-version
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: previousChannel
            type: string
          - name: releaseTestsBranch
            type: string
        volumes:
          # Guest cluster kubeconfig, for reading the redhat-operators packagemanifest.
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: RELEASE_BRANCH
              value: "$(tasks.parse-metadata.results.target-git-branch)"
            - name: OCP_VERSION
              value: "$(tasks.extract-ocp-version.results.ocpVersion)"
            - name: PRE_UPGRADE_CHANNEL
              value: "$(params.PRE_UPGRADE_CHANNEL)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: select-release-tests-branch
            script: |
              #!/usr/bin/env bash
              set -x
              # For release-vX.Y.x use the matching release-vX.Y branch of release-tests
              # For nightly, next and main use the master branch
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                TESTS_BRANCH="master"
              else
                TESTS_BRANCH=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/release-v\1/')
              fi
              echo "Target branch: $RELEASE_BRANCH -> Release tests branch: $TESTS_BRANCH"
              echo -n "$TESTS_BRANCH" | tee $(results.releaseTestsBranch.path)

          - name: resolve-source-channel
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Explicit override always wins.
              if [[ -n "$PRE_UPGRADE_CHANNEL" ]]; then
                echo "PRE_UPGRADE_CHANNEL override provided: $PRE_UPGRADE_CHANNEL"
                echo -n "$PRE_UPGRADE_CHANNEL" | tee $(results.previousChannel.path)
                exit 0
              fi

              cp /credentials/kubeconfig /tmp/kubeconfig

              # Is a channel exposed with a released head on the prod redhat-operators catalog
              # (the catalog install-pre-upgrade installs from)? The packagemanifest populates
              # shortly after provisioning, so poll until it is available.
              #   0: present   1: catalog populated but channel absent   2: undetermined
              redhat_operators_has_channel() {
                local want="$1" channels=""
                for i in $(seq 1 30); do
                  channels=$(oc get packagemanifests -n openshift-marketplace \
                    -l "catalog=redhat-operators" \
                    --field-selector "metadata.name=openshift-pipelines-operator-rh" \
                    -o jsonpath='{.items[0].status.channels[*].name}' 2>/dev/null || true)
                  [[ -n "$channels" ]] && break
                  echo "  waiting for redhat-operators packagemanifest (attempt $i)..." >&2
                  sleep 10
                done
                echo "redhat-operators channels: ${channels:-<none>}" >&2
                [[ -n "$channels" ]] || return 2
                for c in $channels; do
                  [[ "$c" == "$want" ]] && return 0
                done
                return 1
              }

              # Target (upgrade "to") channel derived from the operator release branch.
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                TARGET_CHANNEL="latest"
              else
                TARGET_CHANNEL=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo "Release branch: $RELEASE_BRANCH -> target channel: $TARGET_CHANNEL"

              if [[ "$TARGET_CHANNEL" =~ ^pipelines-([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PREV_MINOR_CHANNEL="pipelines-${MAJOR}.$((MINOR - 1))"

                OCP_MINOR=$(echo "$OCP_VERSION" | cut -d. -f2)
                if ! [[ "$OCP_MINOR" =~ ^[0-9]+$ ]]; then
                  echo "ERROR: could not parse OCP minor from OCP_VERSION '$OCP_VERSION'." >&2
                  exit 1
                fi

                if (( OCP_MINOR % 2 == 1 )); then
                  rc=0
                  redhat_operators_has_channel "$TARGET_CHANNEL" || rc=$?
                  case "$rc" in
                    0)
                      PREV="$TARGET_CHANNEL"
                      echo "OCP $OCP_VERSION (minor $OCP_MINOR, odd); $TARGET_CHANNEL available -> z-stream upgrade; source $PREV"
                      ;;
                    1)
                      PREV="$PREV_MINOR_CHANNEL"
                      echo "OCP $OCP_VERSION (minor $OCP_MINOR, odd); $TARGET_CHANNEL not yet released -> minor upgrade; source $PREV"
                      ;;
                    *)
                      echo "ERROR: redhat-operators catalog did not confirm its channels within the timeout; cannot determine the upgrade source." >&2
                      echo "Re-run the pipeline, or set PRE_UPGRADE_CHANNEL explicitly (e.g. pipelines-1.23)." >&2
                      exit 1
                      ;;
                  esac
                else
                  PREV="$PREV_MINOR_CHANNEL"
                  echo "OCP $OCP_VERSION (minor $OCP_MINOR, even) -> minor upgrade; source $PREV"
                fi
                echo -n "$PREV" | tee $(results.previousChannel.path)
              else
                echo "ERROR: cannot derive a previous channel from target '$TARGET_CHANNEL'." >&2
                echo "nightly/next/main builds have no released predecessor; set PRE_UPGRADE_CHANNEL explicitly (e.g. pipelines-1.23)." >&2
                exit 1
              fi

    # Install the previous (released) operator from the prod redhat-operators catalog.
    - name: install-pre-upgrade-operator
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/olm.spec"
        - name: TAGS
          value: "install"
        - name: CATALOG_SOURCE
          value: "redhat-operators"
        - name: CHANNEL
          value: "$(tasks.derive-channels.results.previousChannel)"
        - name: FAIL_ON_ERROR
          value: "true"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.derive-channels.results.releaseTestsBranch)
      runAfter:
        - derive-channels
        - configure-loki-logging

    - name: setup-testing-accounts
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-setup-testing-accounts.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
      runAfter:
        - install-pre-upgrade-operator

    # Create upgrade-persistent resources BEFORE the upgrade (fixed releasetest-upgrade-* namespaces).
    - name: release-tests-pre-upgrade
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/operator/pre-upgrade.spec"
        - name: STATE_CONFIGMAP
          value: "upgrade-skiprange-state"
        - name: REFRESH_CLI_FROM_CLUSTER
          value: "true"
        - name: EXPECTED_CLI_VERSION
          value: "$(tasks.derive-channels.results.previousChannel)"
        - name: TAGS
          value: "pre-upgrade"
        - name: MAX_RETRIES
          value: "3"
        - name: FAIL_ON_ERROR
          value: "true"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.derive-channels.results.releaseTestsBranch)
      runAfter:
        - install-pre-upgrade-operator
        - setup-testing-accounts

    # ==========================================================================
    # Phase 3 - Build the snapshot catalog and upgrade the operator to it
    # ==========================================================================
    # Create the Catalog Source from this PR's snapshot (the upgrade "to" version).
    # Runs AFTER pre-upgrade resources exist so the upgrade happens with them in place.
    - name: create-catalog-source
      runAfter:
        - release-tests-pre-upgrade
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: channel
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: INDEX_IMAGE
              value: "$(tasks.parse-metadata.results.component-container-image)"
            - name: RELEASE_BRANCH
              value: "$(tasks.parse-metadata.results.target-git-branch)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: extract-channel-name
            script: |
              #!/usr/bin/env bash
              set -x
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                CHANNEL="latest"
              else
                CHANNEL=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo -n "$CHANNEL" | tee $(results.channel.path)

          - name: create-catalog
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              cp /credentials/kubeconfig /tmp/kubeconfig
              cat <<EOF | oc apply -f-
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: "custom-osp-catalog"
                  namespace: openshift-marketplace
                spec:
                  sourceType: grpc
                  image: $INDEX_IMAGE
                  displayName: "Custom OSP Catalog"
                  publisher: Red Hat Local
                  updateStrategy:
                    registryPoll:
                      interval: 30m
              EOF

    # Repoint the operator Subscription from the prod redhat-operators catalog to this PR's
    # custom-osp-catalog (and the target channel). The gauge "upgrade" step only patches the
    # Subscription channel, not its catalog source, so this cross-catalog move is done here.
    # OLM (installPlanApproval: Automatic) then rolls out the new CSV; the gauge upgrade test
    # that follows validates the upgraded operator.
    - name: switch-to-upgrade-catalog
      runAfter:
        - create-catalog-source
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: TARGET_CHANNEL
              value: "$(tasks.create-catalog-source.results.channel)"
            - name: PREV_CHANNEL
              value: "$(tasks.derive-channels.results.previousChannel)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: repoint-subscription
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              cp /credentials/kubeconfig /tmp/kubeconfig

              # Wait for the custom catalog source to be serving before repointing.
              echo "Waiting for custom-osp-catalog CatalogSource to be READY..."
              for i in $(seq 1 60); do
                STATE=$(oc get catalogsource custom-osp-catalog -n openshift-marketplace \
                  -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || true)
                echo "  attempt $i: state=${STATE:-<none>}"
                [[ "$STATE" == "READY" ]] && break
                sleep 10
              done
              if [[ "${STATE:-}" != "READY" ]]; then
                echo "ERROR: custom-osp-catalog did not become READY in time."
                exit 1
              fi

              # Discover the Pipelines operator Subscription deterministically by its
              # package (spec.name), not list order: openshift-operators may contain
              # more than one Subscription and items[0] could repoint an unrelated one.
              SUB=$(oc get subscription -n openshift-operators \
                -o jsonpath='{.items[?(@.spec.name=="openshift-pipelines-operator-rh")].metadata.name}')
              if [[ -z "$SUB" ]]; then
                echo "ERROR: no openshift-pipelines-operator-rh Subscription found in openshift-operators."
                exit 1
              fi
              echo "Repointing Subscription '$SUB' to custom-osp-catalog, channel $TARGET_CHANNEL"

              # Record the currently-installed CSV so we can detect the actual
              # upgrade transition below. The gauge upgrade step only waits for a
              # non-empty installedCSV that is Succeeded, which the previous GA CSV
              # already satisfies, so it can short-circuit on the old CSV while OLM
              # is still rolling the new one. We block here until a DIFFERENT CSV is
              # installed and Succeeded before downstream upgrade/post-upgrade suites.
              PREV_CSV=$(oc get subscription "$SUB" -n openshift-operators \
                -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
              echo "Pre-upgrade installedCSV: ${PREV_CSV:-<none>}"

              oc patch subscription "$SUB" -n openshift-operators --type merge -p \
                "{\"spec\":{\"source\":\"custom-osp-catalog\",\"sourceNamespace\":\"openshift-marketplace\",\"channel\":\"${TARGET_CHANNEL}\"}}"

              oc get subscription "$SUB" -n openshift-operators -o yaml | grep -E "channel:|source:|sourceNamespace:"

              echo "Waiting for the operator to upgrade to a new Succeeded CSV..."
              NEW_CSV=""
              for i in $(seq 1 90); do
                CUR_CSV=$(oc get subscription "$SUB" -n openshift-operators \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                if [[ -n "$CUR_CSV" && "$CUR_CSV" != "$PREV_CSV" ]]; then
                  PHASE=$(oc get csv "$CUR_CSV" -n openshift-operators \
                    -o jsonpath='{.status.phase}' 2>/dev/null || true)
                  echo "  attempt $i: installedCSV=$CUR_CSV phase=${PHASE:-<none>}"
                  if [[ "$PHASE" == "Succeeded" ]]; then
                    NEW_CSV="$CUR_CSV"
                    break
                  fi
                else
                  echo "  attempt $i: installedCSV=${CUR_CSV:-<none>} (unchanged)"
                fi
                sleep 10
              done
              if [[ -z "$NEW_CSV" ]]; then
                echo "ERROR: operator did not upgrade to a new Succeeded CSV (still ${PREV_CSV:-<none>})."
                exit 1
              fi
              echo "Operator upgraded: ${PREV_CSV:-<none>} -> $NEW_CSV"

              # Consolidated, grep-friendly summary of the upgrade path under test,
              # so a failing run shows at a glance which channels/versions were
              # exercised (grep -A7 "UPGRADE PATH").
              PREV_VER="${PREV_CSV#openshift-pipelines-operator-rh.}"
              NEW_VER="${NEW_CSV#openshift-pipelines-operator-rh.}"
              echo ""
              echo "================= UPGRADE PATH ================="
              echo "  Pre-upgrade  channel : ${PREV_CHANNEL:-<unknown>}"
              echo "  Post-upgrade channel : ${TARGET_CHANNEL:-<unknown>}"
              echo "  Pre-upgrade  version : ${PREV_VER:-<none>}   (CSV: ${PREV_CSV:-<none>})"
              echo "  Post-upgrade version : ${NEW_VER:-<none>}   (CSV: ${NEW_CSV})"
              echo "  Transition           : ${PREV_CHANNEL:-?}/${PREV_VER:-?} -> ${TARGET_CHANNEL:-?}/${NEW_VER:-?}"
              echo "================================================"

    # Validate the upgrade via the gauge olm.spec upgrade scenario (waits for the new CSV,
    # validates the operator, RBAC and quickstarts on this PR's snapshot build).
    - name: update-pipelines-operator
      taskRef:
        resolver: git
