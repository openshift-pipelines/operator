        - name: MODE
          value: "($(params.LABEL_FILTER)) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/mag/"
        - name: PARALLEL
          value: "true"
        # 21 Ordered containers (20 group-user TCs + PIPELINES-28); each runs
        # on one proc, so 8 procs keeps the suite well under 10 minutes.
        - name: GINKGO_PROCS
          value: "8"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # The chains specs rewrite TektonConfig spec.chain, which only rolls the
    # chains controller; no other phase 1 suite depends on it. Not Serial-marked
    # but every spec changes that config, so the suite itself runs single-proc.
    - name: release-tests-chains
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/chains/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Cluster-mutating suites (metrics mTLS/pruner toggles, the PAC enable/disable
    # toggle, operator add-on/RBAC/pruner settings). Each rewrites cluster-wide
    # TektonConfig settings but still fans out in parallel right after the install.
    # onError: continue keeps the fan-out going when one fails; the finally task
    # still fails the PipelineRun.
    - name: release-tests-metrics
      onError: continue
      # Metrics is the most flaky suite (Prometheus scrape timing, pruner mTLS
      # re-enable). Transient failures are absorbed per-spec via GINKGO_FLAKE_ATTEMPTS
      # (default 2); a task-level retry cannot be used here because Tekton forbids it
      # together with onError: continue.
      runAfter:
        - install-pipelines-operator
      # Budget covers the ~17 min mTLS poll plus per-spec flake reruns, within the
      # ~4h PipelineRun budget.
      timeout: "65m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/metrics/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "50m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # The tests/operator/ package (a single ~73m task before, the casualty when the
    # run approached the PipelineRun timeout) is split into per-domain tasks (rbac,
    # addon, auto-prune, tekton-pruner), each running the same package filtered to
    # one label set, so the longest is ~35m and the run stays under the timeout.
    # The operator specs rewrite cluster-wide settings (pruner cron and tekton-pruner
    # TTLs, add-on params, RBAC) and each Describe is Serial/Ordered, so PARALLEL is
    # false. They run as a stage after the component suites: rbac and addon fan out
    # in parallel once every component suite finishes, auto-prune after both,
    # tekton-pruner last. The pruner suites' sustained TektonConfig churn otherwise
    # keeps the operator from reaching Installed=True while rbac waits on it, so they
    # are gated to the end of the run. Upgrade specs only apply to the upgrade
    # pipeline and are filtered out.
    - name: release-tests-rbac
      onError: continue
      runAfter:
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-results
        - release-tests-versions
        - release-tests-tls
        - release-tests-ecosystem
        - release-tests-pac
        - release-tests-manual-approval
        - release-tests-chains
        - release-tests-metrics
      timeout: "25m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && rbac && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-addon
      onError: continue
      runAfter:
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-results
        - release-tests-versions
        - release-tests-tls
        - release-tests-ecosystem
        - release-tests-pac
        - release-tests-manual-approval
        - release-tests-chains
        - release-tests-metrics
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && addon && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "25m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # tekton-pruner is gated to the very end: it continuously rewrites the
    # TektonConfig pruner settings and then waits on the operator reaching
    # Installed=True. Running it next to the other TektonConfig-mutating suites
    # (notably operator-rbac, whose rbac-disable spec also waits on Installed=True)
    # keeps the single TektonConfig CR perpetually reconciling, so rbac times out
    # at Installed=False. It therefore runs after every other suite.
    #
    # auto-prune mutates cluster-wide pruning config and has a long TTL-based
    # test tail, so it needs the extended ephemeral-cluster lifetime (see the
    # WAIT_FOR_TEARDOWN_TIMEOUT param). It is serialized after rbac/addon (they
    # also mutate TektonConfig), and tekton-pruner is gated after it.
    - name: release-tests-auto-prune
      onError: continue
      runAfter:
        - release-tests-rbac
        - release-tests-addon
      timeout: "70m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && auto-prune && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "55m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-tekton-pruner
      onError: continue
      runAfter:
        - release-tests-auto-prune
      timeout: "70m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && tekton-pruner && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: RUN_AS
          value: "admin"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "55m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

  finally:
    # Verify aggregate status and fail the pipeline if any test task failed. On
    # failure it also enumerates the failed suite tasks and prints a ready-to-paste
    # rerun filter.
    - name: verify-e2e-tests-status
      params:
        - name: aggregateStatus
          value: "$(tasks.status)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
      taskSpec:
        params:
          - name: aggregateStatus
          - name: pipelineRunName
        steps:
          - name: verify-aggregate-status
            image: $(params.IMAGE)
            script: |
              #!/usr/bin/env bash
              echo "📋 Aggregate Status: $(params.aggregateStatus)"

              if [[ "$(params.aggregateStatus)" == "Succeeded" ]]; then
                echo "✅ All tasks succeeded!"
                exit 0
              fi

              echo "❌ Pipeline contains failed tasks!"

              # The PipelineRun lives in this (Konflux) cluster, so the in-cluster
              # service account token lets us read it back and list the failed suites.
              pr="$(params.pipelineRunName)"
              # Tab-separated per failed suite: <task>\t<MODE>\t<TEST_PATH>. Capturing
              # each TaskRun's resolved MODE/TEST_PATH lets the rerun hint reproduce the
              # exact label filter and package instead of guessing from the task name
              # (e.g. manual-approval runs tests/mag/, triggers-tls filters on tls).
              failed=""
              if command -v oc >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
                failed="$(oc get pipelinerun "${pr}" -o json 2>/dev/null \
                  | jq -r '.status.childReferences[]?.name' \
                  | while read -r tr; do
                      [[ -z "${tr}" ]] && continue
                      cond="$(oc get taskrun "${tr}" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}' 2>/dev/null)"
                      name="$(oc get taskrun "${tr}" -o jsonpath='{.metadata.labels.tekton\.dev/pipelineTask}' 2>/dev/null)"
                      if [[ "${cond}" == "False" && "${name}" == release-tests-* ]]; then
                        mode="$(oc get taskrun "${tr}" -o jsonpath='{.spec.params[?(@.name=="MODE")].value}' 2>/dev/null)"
                        path="$(oc get taskrun "${tr}" -o jsonpath='{.spec.params[?(@.name=="TEST_PATH")].value}' 2>/dev/null)"
                        printf '%s\t%s\t%s\n' "${name}" "${mode}" "${path}"
                      fi
                    done | sort -u)"
              fi

              if [[ -n "${failed}" ]]; then
                echo ""
                echo "🔁 Failed suites:"
                echo "${failed}" | cut -f1 | sed 's/^/   - /'
                echo ""
                echo "💡 Rerun only the failed suites by restarting the PipelineRun with"
                echo "   these tasks (others can be pruned from the run), or run locally"
                echo "   from a release-tests-ginkgo checkout:"
                # printf %q shell-quotes the filter (preserving && and !) and the path
                # so each printed command can be pasted into a shell as-is.
                while IFS=$'\t' read -r name mode path; do
                  [[ -z "${name}" ]] && continue
                  qpath="$(printf '%q' "${path:-./tests/}")"
                  if [[ -n "${mode}" ]]; then
                    qmode="$(printf '%q' "${mode}")"
                    echo "   ginkgo run --label-filter=${qmode} ${qpath}"
                  else
                    echo "   ginkgo run ${qpath}"
                  fi
                done <<< "${failed}"
              else
                echo "💡 Check individual task logs for detailed error information"
                echo "   (could not enumerate failed suites automatically)."
              fi

              exit 1
