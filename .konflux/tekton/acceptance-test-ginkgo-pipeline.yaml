---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: acceptance-test-ginkgo-pipeline
spec:
  description: |
    Release tests driven by the Ginkgo suite in openshift-pipelines/release-tests-ginkgo.

    Provisions an ephemeral Hypershift cluster via OpenShift-CI, points a CatalogSource
    at the Operator index image from the Konflux snapshot, then hands over to the
    release-tests repo: its `olm` suite installs the operator and the component suites
    run afterwards.

    Component suites carry no dependency on each other so Tekton runs them all in
    parallel, and each suite additionally fans out over GINKGO_PROCS Ginkgo processes.
    The real time budget is the Konflux PipelineRun timeout (~4h) set on the
    IntegrationTestScenario, not the ephemeral cluster: that cluster lives up to
    Prow's ~8h default decoration timeout, so the PipelineRun budget is what the
    per-suite timeouts below are sized against.
  params:
    - name: SNAPSHOT
      type: string
      description: Snapshot of the application
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
    - name: NAMESPACE
      type: string
      description: Namespace where the Operator bundle will be deployed.
      default: openshift-operators
    - name: IMAGE
      type: string
      description: Image used by the inline helper steps (needs oc).
      default: quay.io/openshift-pipeline/ci:latest
    - name: GINKGO_IMAGE
      type: string
      description: Image used to build and run the Ginkgo suites.
      default: quay.io/openshift-pipeline/release-tests-ginkgo:latest
    - name: RELEASE_TEST_TASKS_REPO
      type: string
      description: Repository the Tekton task definitions are resolved from.
      default: https://github.com/openshift-pipelines/operator
    - name: RELEASE_TEST_TASKS_BRANCH
      type: string
      # TODO: switch back to main once the ginkgo task definitions are merged.
      default: ginkgo-release-tests
    - name: GIT_RELEASE_TESTS_URI
      type: string
      description: Ginkgo release-tests repository.
      default: https://github.com/openshift-pipelines/release-tests-ginkgo.git
    - name: GIT_RELEASE_TESTS_BRANCH
      type: string
      # Version-matched to the OSP build under test: release-v1.24 for 1.24.x
      # GA/z-stream, main for nightly/next. Overridden per-run by the
      # IntegrationTestScenario; defaults to main for nightly.
      default: main
    - name: LABEL_FILTER
      type: string
      description: Base Ginkgo label filter applied to every component suite.
      default: "e2e && !disconnected"
    - name: GINKGO_PROCS
      type: string
      description: Ginkgo parallel processes used per component suite.
      default: "4"
    - name: GINKGO_FLAKE_ATTEMPTS
      type: string
      description: >-
        Attempts per spec (ginkgo --flake-attempts) for the phase-1 suites and
        metrics. Absorbs transient failures such as admission webhook EOFs
        during HPA scale-down or Prometheus 401s; retried specs are listed as
        FLAKED in the task log. Not applied to operator, whose
        serial retries would eat into the PipelineRun time budget.
      default: "2"
    - name: OCP_RELEASE_STREAM
      type: string
      description: |
        Which OpenShift release payload to provision: "auto" (default) probes the
        stable upgrade graph for the target minor and falls back to the nightly
        payload when no GA release exists yet (e.g. a pre-GA 4.23). Set to "stable"
        or "nightly" to force a specific stream.
      default: "auto"

  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: extract-ocp-version
      runAfter:
        - parse-metadata
      params:
        - name: componentName
          value: "$(tasks.parse-metadata.results.component-name)"
        - name: releaseStream
          value: "$(params.OCP_RELEASE_STREAM)"
      taskSpec:
        params:
          - name: componentName
            type: string
          - name: releaseStream
            type: string
            default: "auto"
        results:
          - name: ocpVersion
            description: The OCP minor version extracted from component name (e.g. 4.20)
          - name: releases
            description: |
              The ci-operator "releases" JSON for the provision task. Uses the stable
              release payload for GA minors, or the nightly candidate payload for
              pre-GA minors (no stable release yet).
        steps:
          - name: extract-version
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPONENT_NAME
                value: "$(params.componentName)"
              - name: RELEASE_STREAM
                value: "$(params.releaseStream)"
            script: |
              #!/usr/bin/env bash
              set -e

              # Validate the release-stream override up front so a typo fails
              # loudly instead of silently falling through to the stable payload.
              case "$RELEASE_STREAM" in
                auto|stable|nightly) ;;
                *)
                  echo "ERROR: invalid OCP_RELEASE_STREAM '$RELEASE_STREAM'; expected one of: auto, stable, nightly" >&2
                  exit 1
                  ;;
              esac

              # Extract OCP minor version from COMPONENT_NAME
              # Expected format: operator-1-22-index-4-20 -> 4.20
              echo "Component Name: $COMPONENT_NAME"

              VERSION_PATTERN=$(echo "$COMPONENT_NAME" | grep -oE '[0-9]+-[0-9]+' | tail -1)

              if [ -z "$VERSION_PATTERN" ]; then
                echo "Warning: Could not extract version from component name, using default"
                OCP_VERSION="4.20"
              else
                OCP_VERSION=$(echo "$VERSION_PATTERN" | tr '-' '.')
                echo "Extracted OCP Version: $OCP_VERSION"
              fi

              echo -n "$OCP_VERSION" | tee $(results.ocpVersion.path)
              echo

              # Decide which release payload to provision. A pre-GA minor (e.g. 4.23
              # before it ships) has no release on the stable channel, so the
              # ci-operator stable resolution returns an empty list and provisioning
              # fails at input resolution. In that case provision the nightly payload.
              stream="$RELEASE_STREAM"
              if [ "$stream" = "auto" ]; then
                graph="https://api.openshift.com/api/upgrades_info/graph?arch=multi&channel=stable-${OCP_VERSION}"
                echo "Probing stable channel for ${OCP_VERSION}: $graph"
                # Default to stable so a probe/network error preserves current behavior
                # (GA minors keep working); only switch to nightly on a definitive
                # empty release list.
                stream="stable"
                if resp=$(curl -fsS --connect-timeout 10 --max-time 30 "$graph" 2>/dev/null); then
                  if echo "$resp" | grep -q '"nodes":\[\]'; then
                    echo "No GA release found on stable-${OCP_VERSION}; using nightly payload."
                    stream="nightly"
                  else
                    echo "Found GA releases on stable-${OCP_VERSION}; using stable payload."
                  fi
                else
                  echo "WARN: could not probe the stable upgrade graph; defaulting to stable."
                fi
              fi

              if [ "$stream" = "nightly" ]; then
                releases="{\"latest\":{\"candidate\":{\"product\":\"ocp\",\"stream\":\"nightly\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              else
                releases="{\"latest\":{\"release\":{\"channel\":\"stable\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              fi
              echo "Selected release stream: $stream"
              echo "releases: $releases"
              printf '%s' "$releases" | tee $(results.releases.path)

    - name: provision-ephemeral-cluster
      runAfter:
        - extract-ocp-version
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: releases
          value: '$(tasks.extract-ocp-version.results.releases)'
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "m5.2xlarge", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2", "CONTROL_PLANE_NODE_SELECTOR": "kubernetes.io/arch=amd64", "IMAGE_CONTENT_SOURCES": "- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.redhat.io/openshift-pipelines"}'

    # Configure Loki and OpenShift Logging, required by the Results configuration
    # applied during the Ginkgo install suite.
    - name: configure-loki-logging
      runAfter:
        - provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-configure-loki-logging.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # Create the CatalogSource the operator subscription is installed from and
    # derive the channel from the release branch of the snapshot.
    - name: create-catalog-source
      runAfter:
        - provision-ephemeral-cluster
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: channel
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: INDEX_IMAGE
              value: "$(tasks.parse-metadata.results.component-container-image)"
            - name: RELEASE_BRANCH
              value: "$(tasks.parse-metadata.results.target-git-branch)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: extract-channel-name
            script: |
              #!/usr/bin/env bash
              set -x
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                CHANNEL="latest"
              else
                CHANNEL=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo -n "$CHANNEL" | tee $(results.channel.path)

          - name: create-catalog
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              cp /credentials/kubeconfig /tmp/kubeconfig
              cat <<EOF | oc apply -f-
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: "custom-osp-nightly"
                  namespace: openshift-marketplace
                spec:
                  sourceType: grpc
                  image: $INDEX_IMAGE
                  displayName: "Custom OSP Nightly"
                  publisher: Red Hat Local
                  updateStrategy:
                  registryPoll:
                  interval: 30m
              EOF

    # Install the operator by running the Ginkgo olm suite from the release-tests repo.
    # Serial on purpose: the install spec is a single Ordered container.
    # Task timeouts leave ~15m over GINKGO_TIMEOUT for image pull, clone and compile.
    - name: install-pipelines-operator
      runAfter:
        - create-catalog-source
        - configure-loki-logging
      timeout: "45m"
      # OLM install is occasionally flaky (catalog pod not ready, slow subscription
      # reconcile). QE's acceptance-tests runs install with retries:2; mirror that so
      # a transient failure here does not abandon the whole run.
      retries: 2
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "install"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Non-admin release-test suites (pipelines, triggers) impersonate the "user"
    # account, so create the test User objects and their RBAC before those suites
    # run. Mirrors release-tests-infra's setup-testing-accounts step: only
    # pipelines and triggers run non-admin; every other suite runs as the
    # provisioned cluster-admin (task-ginkgo-e2e RUN_AS default "admin"). This
    # task only creates Users/RoleBindings (no oauth changes), so admin suites
    # fanned out in parallel are unaffected.
    - name: setup-testing-accounts
      runAfter:
        - install-pipelines-operator
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-setup-testing-accounts.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # Every component suite is fanned out right after the install and runs in
    # parallel, mirroring the proven QE acceptance-tests layout. onError: continue
    # keeps the fan-out going when one suite fails; the finally task still fails the
    # PipelineRun. Suites with no e2e-labelled specs (hub) or external cluster
    # requirements (tektonkueue) are intentionally absent.
    - name: release-tests-pipelines
      onError: continue
      runAfter:
        - install-pipelines-operator
        - setup-testing-accounts
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "non-admin"
        - name: TEST_PATH
          value: "./tests/pipelines/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Triggers uses the shared, version-matched release-tests branch
    # (GIT_RELEASE_TESTS_BRANCH: release-v1.24 for 1.24.x OSP, main for
    # nightly/next). Both branches carry the EventListener TLS CN-length fix
    # (#105) but write TLS certs to a shared path (the per-process cert dirs
    # from the still-open #100 are not merged there), so this suite runs serial
    # (PARALLEL=false) to avoid the concurrent cert-clobbering race.
    - name: release-tests-triggers
      onError: continue
      runAfter:
        - install-pipelines-operator
        - setup-testing-accounts
      timeout: "65m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "non-admin"
        - name: TEST_PATH
          value: "./tests/triggers/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "50m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-results
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "50m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/results/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "45m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-versions
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/versions/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-tls
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/tls/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Longest suite of the phase: its S2I specs start one build per imagestream
    # tag and then only wait, so it gets more processes than the others. With
    # 8 procs the last S2I spec only got a slot ~10 min in; 16 lets all of them
    # start at once, so the suite runs in about the time of its longest spec.
    - name: release-tests-ecosystem
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/ecosystem/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "16"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-pac
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/pac/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # TEMPORARY (validation of release-tests-ginkgo#99): the group-user specs
    # need htpasswd users, which HyperShift clusters cannot provide; #99 makes
    # the suite impersonate them instead. Until it merges, this task clones the
    # PR branch from the fork and runs the full mag suite. This is the only
    # remaining fork pin; switch it back to the shared, version-matched
    # GIT_RELEASE_TESTS_* params before merging the operator PR (once #99 is
    # merged and backported).
    - name: release-tests-manual-approval
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: "https://github.com/divyansh42/release-tests-ginkgo.git"
        - name: GIT_RELEASE_TESTS_BRANCH
          value: "mag-impersonation"
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/mag/"
        - name: PARALLEL
          value: "true"
        # 21 Ordered containers (20 group-user TCs + PIPELINES-28); each runs
        # on one proc, so 8 procs keeps the suite well under 10 minutes.
        - name: GINKGO_PROCS
          value: "8"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # The chains specs rewrite TektonConfig spec.chain, which only rolls the
    # chains controller; no other phase 1 suite depends on it. Not Serial-marked
    # but every spec changes that config, so the suite itself runs single-proc.
    - name: release-tests-chains
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/chains/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Cluster-mutating suites (metrics mTLS/pruner toggles, the PAC enable/disable
    # toggle, operator add-on/RBAC/pruner settings). Each rewrites TektonConfig
    # settings shared cluster-wide, but following the proven QE acceptance-tests
    # layout they still fan out in parallel right after the install. onError:
    # continue keeps the fan-out going when one fails; the finally task still fails
    # the PipelineRun.
    - name: release-tests-metrics
      onError: continue
      # Metrics is the most flaky suite (Prometheus scrape timing, pruner mTLS
      # re-enable). Transient failures are absorbed per-spec via GINKGO_FLAKE_ATTEMPTS
      # (default 2); a task-level retry cannot be used here because Tekton forbids it
      # together with onError: continue.
      runAfter:
        - install-pipelines-operator
      # Budget covers the ~17 min mTLS poll plus per-spec flake reruns. Raised
      # to fit the ~4h PipelineRun budget (srwtf hit the old 30m cap at 58/80
      # specs).
      timeout: "65m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/metrics/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "50m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # The tests/operator/ package used to run as a single ~73m task, which was the
    # casualty when the run approached the PipelineRun timeout. Following the proven QE
    # acceptance-tests layout, it is split into per-domain tasks (rbac, addon,
    # auto-prune, tekton-pruner), each running the same package filtered to one label
    # set, so the longest one is ~35m and the suite comfortably finishes inside the
    # cap. The operator specs rewrite cluster-wide settings (pruner cron and
    # tekton-pruner TTLs, add-on params, RBAC creation) and each Describe is
    # Serial/Ordered internally, so PARALLEL is false. The operator suites run as a
    # stage after the component suites: rbac, addon (and auto-prune, when enabled)
    # fan out in parallel once every component suite has finished, and tekton-pruner
    # runs last after them. The pruner suites' sustained TektonConfig churn otherwise
    # keeps the operator from reaching Installed=True while rbac waits on it, so they
    # are kept clear of the component suites and gated to the end of the run.
    # The upgrade specs only make sense in an upgrade pipeline, so they are filtered out.
    - name: release-tests-rbac
      onError: continue
      runAfter:
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-results
        - release-tests-versions
        - release-tests-tls
        - release-tests-ecosystem
        - release-tests-pac
        - release-tests-manual-approval
        - release-tests-chains
        - release-tests-metrics
      timeout: "25m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && rbac && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-addon
      onError: continue
      runAfter:
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-results
        - release-tests-versions
        - release-tests-tls
        - release-tests-ecosystem
        - release-tests-pac
        - release-tests-manual-approval
        - release-tests-chains
        - release-tests-metrics
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && addon && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "25m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # tekton-pruner is gated to the very end: it continuously rewrites the
    # TektonConfig pruner settings and then waits on the operator reaching
    # Installed=True. Running it next to the other TektonConfig-mutating suites
    # (notably operator-rbac, whose rbac-disable spec also waits on Installed=True)
    # keeps the single TektonConfig CR perpetually reconciling, so rbac times out
    # at Installed=False. It therefore runs after every other suite.
    #
    # auto-prune is temporarily disabled: its TTL-based pruning needs a long-lived
    # cluster and does not fit the ~2h ephemeral-cluster cap. Re-enable the block
    # below once a long-lived cluster is available. When re-enabled it runs in
    # parallel with rbac/addon (same runAfter: the component suites), and
    # tekton-pruner's runAfter should list release-tests-auto-prune again.
    # - name: release-tests-auto-prune
    #   onError: continue
    #   runAfter:
    #     - release-tests-pipelines
    #     - release-tests-triggers
    #     - release-tests-results
    #     - release-tests-versions
    #     - release-tests-tls
    #     - release-tests-ecosystem
    #     - release-tests-pac
    #     - release-tests-manual-approval
    #     - release-tests-chains
    #     - release-tests-metrics
    #   timeout: "70m"
    #   taskRef:
    #     resolver: git
    #     params:
    #       - name: url
    #         value: $(params.RELEASE_TEST_TASKS_REPO)
    #       - name: revision
    #         value: $(params.RELEASE_TEST_TASKS_BRANCH)
    #       - name: pathInRepo
    #         value: .konflux/tekton/task-ginkgo-e2e.yaml
    #   params:
    #     - name: CLUSTER_SECRET_REF
    #       value: $(tasks.provision-ephemeral-cluster.results.secretRef)
    #     - name: IMAGE
    #       value: $(params.GINKGO_IMAGE)
    #     - name: GIT_RELEASE_TESTS_URI
    #       value: $(params.GIT_RELEASE_TESTS_URI)
    #     - name: GIT_RELEASE_TESTS_BRANCH
    #       value: $(params.GIT_RELEASE_TESTS_BRANCH)
    #     - name: MODE
    #       value: "($(params.LABEL_FILTER)) && auto-prune && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
    #     - name: TEST_PATH
    #       value: "./tests/operator/"
    #     - name: PARALLEL
    #       value: "false"
    #     - name: GINKGO_TIMEOUT
    #       value: "55m"
    #     - name: CATALOG_SOURCE
    #       value: "custom-osp-nightly"
    #     - name: CHANNEL
    #       value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-tekton-pruner
      onError: continue
      runAfter:
        # - release-tests-auto-prune  # re-enable together with auto-prune above
        - release-tests-rbac
        - release-tests-addon
      timeout: "70m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && tekton-pruner && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "55m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

  finally:
    # Verify aggregate status and fail the pipeline if any test task failed. On
    # failure it also enumerates the failed suite tasks and prints a ready-to-paste
    # rerun filter, mirroring QE acceptance-tests' evaluate-test-suites.rerun-command.
    - name: verify-e2e-tests-status
      params:
        - name: aggregateStatus
          value: "$(tasks.status)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
      taskSpec:
        params:
          - name: aggregateStatus
          - name: pipelineRunName
        steps:
          - name: verify-aggregate-status
            image: $(params.IMAGE)
            script: |
              #!/usr/bin/env bash
              echo "📋 Aggregate Status: $(params.aggregateStatus)"

              if [[ "$(params.aggregateStatus)" == "Succeeded" ]]; then
                echo "✅ All tasks succeeded!"
                exit 0
              fi

              echo "❌ Pipeline contains failed tasks!"

              # The PipelineRun lives in this (Konflux) cluster, so the in-cluster
              # service account token lets us read it back and list the failed suites.
              pr="$(params.pipelineRunName)"
              failed=""
              if command -v oc >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
                failed="$(oc get pipelinerun "${pr}" -o json 2>/dev/null \
                  | jq -r '.status.childReferences[]?.name' \
                  | while read -r tr; do
                      [[ -z "${tr}" ]] && continue
                      cond="$(oc get taskrun "${tr}" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}' 2>/dev/null)"
                      name="$(oc get taskrun "${tr}" -o jsonpath='{.metadata.labels.tekton\.dev/pipelineTask}' 2>/dev/null)"
                      if [[ "${cond}" == "False" && "${name}" == release-tests-* ]]; then
                        echo "${name}"
                      fi
                    done | sort -u)"
              fi

              if [[ -n "${failed}" ]]; then
                echo ""
                echo "🔁 Failed suites:"
                echo "${failed}" | sed 's/^/   - /'
                echo ""
                echo "💡 Rerun only the failed suites by restarting the PipelineRun with"
                echo "   these tasks (others can be pruned from the run), or run locally:"
                echo "${failed}" | sed 's/^release-tests-/   ginkgo run --label-filter="/; s/$/" ./tests\/<suite>\//'
              else
                echo "💡 Check individual task logs for detailed error information"
                echo "   (could not enumerate failed suites automatically)."
              fi

              exit 1
