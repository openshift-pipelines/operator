---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: acceptance-test-ginkgo-pipeline
spec:
  description: |
    Release tests driven by the Ginkgo suite in openshift-pipelines/release-tests-ginkgo.

    Provisions an ephemeral Hypershift cluster via OpenShift-CI, points a CatalogSource
    at the Operator index image from the Konflux snapshot, then hands over to the
    release-tests repo: its `olm` suite installs the operator and the component suites
    run afterwards.

    Component suites carry no dependency on each other so Tekton runs them all in
    parallel, and each suite additionally fans out over GINKGO_PROCS Ginkgo processes.
  params:
    - name: SNAPSHOT
      type: string
      description: Snapshot of the application
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
    - name: IMAGE
      type: string
      description: Image used by the inline helper steps (needs oc).
      default: quay.io/openshift-pipeline/ci:latest
    - name: GINKGO_IMAGE
      type: string
      description: Image used to build and run the Ginkgo suites.
      default: quay.io/openshift-pipeline/release-tests-ginkgo:latest
    - name: RELEASE_TEST_TASKS_REPO
      type: string
      description: Repository the Tekton task definitions are resolved from.
      default: https://github.com/openshift-pipelines/operator
    - name: RELEASE_TEST_TASKS_BRANCH
      type: string
      # Operator-repo branch the release-test Tekton task definitions
      # (task-ginkgo-e2e, task-configure-loki-logging,
      # task-setup-testing-accounts) are resolved from.
      default: main
    - name: GIT_RELEASE_TESTS_URI
      type: string
      description: Ginkgo release-tests repository.
      default: https://github.com/openshift-pipelines/release-tests-ginkgo.git
    - name: LABEL_FILTER
      type: string
      description: Base Ginkgo label filter applied to every component suite.
      default: "e2e && !disconnected"
    - name: GINKGO_PROCS
      type: string
      description: Ginkgo parallel processes used per component suite.
      default: "4"
    - name: GINKGO_FLAKE_ATTEMPTS
      type: string
      description: >-
        Attempts per spec (ginkgo --flake-attempts) for the phase-1 suites and
        metrics. Absorbs transient failures such as admission webhook EOFs
        during HPA scale-down or Prometheus 401s; retried specs are listed as
        FLAKED in the task log. Not applied to operator, whose
        serial retries would eat into the PipelineRun time budget.
      default: "2"
    - name: OCP_RELEASE_STREAM
      type: string
      description: |
        Which OpenShift release payload to provision: "auto" (default) probes the
        stable upgrade graph for the target minor and falls back to the nightly
        payload when no GA release exists yet (e.g. a pre-GA 4.23). Set to "stable"
        or "nightly" to force a specific stream.
      default: "auto"
    - name: ARM_COMPUTE_NODE_TYPE
      type: string
      description: AWS instance type used for the hosted cluster's compute nodes when the OCP minor is odd (arm64).
      default: "m6g.2xlarge"
    - name: AMD64_COMPUTE_NODE_TYPE
      type: string
      description: AWS instance type used for the hosted cluster's compute nodes when the OCP minor is even (amd64).
      default: "m5.2xlarge"
    - name: WAIT_FOR_TEARDOWN_TIMEOUT
      type: string
      description: |
        How long the provision-ephemeral-cluster task waits for the tearDown
        signal before auto-deprovisioning the cluster. Empty uses the task
        default (2h); set a longer duration (e.g. 4h) so long-running suites
        such as auto-prune can finish within the cluster lifetime.
      default: "4h"
    - name: CLUSTER_ARCH_OVERRIDE
      type: string
      description: |
        Force the hosted cluster's compute architecture ("amd64" or "arm64"),
        bypassing the OCP-minor parity rule. Empty (default) keeps the derived
        value, so 4.x behavior is untouched. Set by the OCP 5.0 arm64 ITS to run
        a second cluster shape (arm64) from the same snapshot; the compute node
        type follows the resulting arch.
      default: ""
    - name: FIPS_OVERRIDE
      type: string
      description: |
        Force the hosted cluster's FIPS mode ("true" or "false"), bypassing the
        FIPS-by-minor rule (minor <= 20 => true). Empty (default) keeps the
        derived value, so 4.x behavior is untouched. Set by the OCP 5.0 arm64 ITS
        (FIPS_OVERRIDE=false) for the non-FIPS second shape.
      default: ""

  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: extract-ocp-version
      runAfter:
        - parse-metadata
      params:
        - name: componentName
          value: "$(tasks.parse-metadata.results.component-name)"
        - name: releaseStream
          value: "$(params.OCP_RELEASE_STREAM)"
        - name: armNodeType
          value: "$(params.ARM_COMPUTE_NODE_TYPE)"
        - name: amdNodeType
          value: "$(params.AMD64_COMPUTE_NODE_TYPE)"
        - name: clusterArchOverride
          value: "$(params.CLUSTER_ARCH_OVERRIDE)"
        - name: fipsOverride
          value: "$(params.FIPS_OVERRIDE)"
      taskSpec:
        params:
          - name: componentName
            type: string
          - name: releaseStream
            type: string
            default: "auto"
          - name: armNodeType
            type: string
            default: "m6g.2xlarge"
          - name: amdNodeType
            type: string
            default: "m5.2xlarge"
          - name: clusterArchOverride
            type: string
            default: ""
          - name: fipsOverride
            type: string
            default: ""
        results:
          - name: ocpVersion
            description: The OCP minor version extracted from component name (e.g. 4.20)
          - name: releases
            description: |
              The ci-operator "releases" JSON for the provision task. Uses the stable
              release payload for GA minors, or the nightly candidate payload for
              pre-GA minors (no stable release yet).
          - name: computeNodeType
            description: |
              AWS instance type for the hosted cluster's compute nodes. ARM
              (Graviton) instance for odd OCP minors, amd64 for even OCP minors.
          - name: clusterArch
            description: Target compute architecture for the hosted cluster workers (arm64 or amd64).
          - name: fips
            description: Whether the hosted cluster is provisioned in FIPS mode ("true" for OCP minors <= 20, otherwise "false").
        steps:
          - name: extract-version
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPONENT_NAME
                value: "$(params.componentName)"
              - name: RELEASE_STREAM
                value: "$(params.releaseStream)"
              - name: ARM_NODE_TYPE
                value: "$(params.armNodeType)"
              - name: AMD_NODE_TYPE
                value: "$(params.amdNodeType)"
              - name: CLUSTER_ARCH_OVERRIDE
                value: "$(params.clusterArchOverride)"
              - name: FIPS_OVERRIDE
                value: "$(params.fipsOverride)"
            script: |
              #!/usr/bin/env bash
              set -e

              # Validate the release-stream override up front so a typo fails
              # loudly instead of silently falling through to the stable payload.
              case "$RELEASE_STREAM" in
                auto|stable|nightly) ;;
                *)
                  echo "ERROR: invalid OCP_RELEASE_STREAM '$RELEASE_STREAM'; expected one of: auto, stable, nightly" >&2
                  exit 1
                  ;;
              esac

              # Extract OCP minor version from COMPONENT_NAME
              # Expected format: operator-1-22-index-4-20 -> 4.20
              echo "Component Name: $COMPONENT_NAME"

              VERSION_PATTERN=$(echo "$COMPONENT_NAME" | grep -oE '[0-9]+-[0-9]+' | tail -1)

              if [ -z "$VERSION_PATTERN" ]; then
                echo "Warning: Could not extract version from component name, using default"
                OCP_VERSION="4.20"
              else
                OCP_VERSION=$(echo "$VERSION_PATTERN" | tr '-' '.')
                echo "Extracted OCP Version: $OCP_VERSION"
              fi

              echo -n "$OCP_VERSION" | tee $(results.ocpVersion.path)
              echo

              # Decide the hosted cluster's compute architecture from the OCP minor
              # parity: odd minors run on arm64, even minors on amd64.
              OCP_MINOR="${OCP_VERSION#*.}"
              if [ $(( OCP_MINOR % 2 )) -eq 1 ]; then
                CLUSTER_ARCH="arm64"
              else
                CLUSTER_ARCH="amd64"
              fi

              # Arch override: an empty value keeps the parity-derived arch, so 4.x
              # ITS (which set no override) are untouched. The OCP 5.0 arm64 ITS sets
              # CLUSTER_ARCH_OVERRIDE=arm64 to run the second cluster shape.
              if [ -n "$CLUSTER_ARCH_OVERRIDE" ]; then
                case "$CLUSTER_ARCH_OVERRIDE" in
                  amd64|arm64)
                    echo "Arch override: ${CLUSTER_ARCH} -> ${CLUSTER_ARCH_OVERRIDE}"
                    CLUSTER_ARCH="$CLUSTER_ARCH_OVERRIDE"
                    ;;
                  *)
                    echo "ERROR: invalid CLUSTER_ARCH_OVERRIDE '$CLUSTER_ARCH_OVERRIDE'; expected one of: amd64, arm64" >&2
                    exit 1
                    ;;
                esac
              fi

              # Pick the compute node type from the final arch so an overridden arch
              # still lands on a matching instance family.
              if [ "$CLUSTER_ARCH" = "arm64" ]; then
                COMPUTE_NODE_TYPE="$ARM_NODE_TYPE"
              else
                COMPUTE_NODE_TYPE="$AMD_NODE_TYPE"
              fi
              echo "Architecture decision: OCP ${OCP_VERSION} (minor ${OCP_MINOR}) -> arch=${CLUSTER_ARCH}, computeNodeType=${COMPUTE_NODE_TYPE}"

              # Enable FIPS only for OCP 4.20 and older minors.
              if [ "$OCP_MINOR" -le 20 ]; then
                FIPS="true"
              else
                FIPS="false"
              fi

              # FIPS override: an empty value keeps the minor-derived FIPS, so 4.x
              # ITS are untouched. The OCP 5.0 arm64 ITS sets FIPS_OVERRIDE=false for
              # the non-FIPS second shape.
              if [ -n "$FIPS_OVERRIDE" ]; then
                case "$FIPS_OVERRIDE" in
                  true|false)
                    echo "FIPS override: ${FIPS} -> ${FIPS_OVERRIDE}"
                    FIPS="$FIPS_OVERRIDE"
                    ;;
                  *)
                    echo "ERROR: invalid FIPS_OVERRIDE '$FIPS_OVERRIDE'; expected one of: true, false" >&2
                    exit 1
                    ;;
                esac
              fi
              echo "FIPS decision: OCP ${OCP_VERSION} (minor ${OCP_MINOR}) -> FIPS=${FIPS}"

              echo -n "$COMPUTE_NODE_TYPE" | tee $(results.computeNodeType.path)
              echo
              echo -n "$CLUSTER_ARCH" | tee $(results.clusterArch.path)
              echo
              echo -n "$FIPS" | tee $(results.fips.path)
              echo

              # Decide which release payload to provision. A pre-GA minor (e.g. 4.23
              # before it ships) has no release on the stable channel, so the
              # ci-operator stable resolution returns an empty list and provisioning
              # fails at input resolution. In that case provision the nightly payload.
              stream="$RELEASE_STREAM"
              if [ "$stream" = "auto" ]; then
                graph="https://api.openshift.com/api/upgrades_info/graph?arch=multi&channel=stable-${OCP_VERSION}"
                echo "Probing stable channel for ${OCP_VERSION}: $graph"
                # Default to stable so a probe/network error preserves current behavior
                # (GA minors keep working); only switch to nightly on a definitive
                # empty release list.
                stream="stable"
                if resp=$(curl -fsS --connect-timeout 10 --max-time 30 "$graph" 2>/dev/null); then
                  if echo "$resp" | grep -q '"nodes":\[\]'; then
                    echo "No GA release found on stable-${OCP_VERSION}; using nightly payload."
                    stream="nightly"
                  else
                    echo "Found GA releases on stable-${OCP_VERSION}; using stable payload."
                  fi
                else
                  echo "WARN: could not probe the stable upgrade graph; defaulting to stable."
                fi
              fi

              if [ "$stream" = "nightly" ]; then
                releases="{\"latest\":{\"candidate\":{\"product\":\"ocp\",\"stream\":\"nightly\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              else
                releases="{\"latest\":{\"release\":{\"channel\":\"stable\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              fi
              echo "Selected release stream: $stream"
              echo "releases: $releases"
              printf '%s' "$releases" | tee $(results.releases.path)

    - name: provision-ephemeral-cluster
      runAfter:
        - extract-ocp-version
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: releases
          value: '$(tasks.extract-ocp-version.results.releases)'
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "$(tasks.extract-ocp-version.results.computeNodeType)", "HYPERSHIFT_NODE_ARCH": "$(tasks.extract-ocp-version.results.clusterArch)", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2", "CONTROL_PLANE_NODE_SELECTOR": "kubernetes.io/arch=$(tasks.extract-ocp-version.results.clusterArch)", "FIPS": "$(tasks.extract-ocp-version.results.fips)", "IMAGE_CONTENT_SOURCES": "- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.redhat.io/openshift-pipelines\n- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.stage.redhat.io/openshift-pipelines"}'
        - name: waitForTearDownTimeout
          value: "$(params.WAIT_FOR_TEARDOWN_TIMEOUT)"

    # Configure Loki and OpenShift Logging, required by the Results configuration
    # applied during the Ginkgo install suite.
    - name: configure-loki-logging
      runAfter:
        - provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-configure-loki-logging.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # Create the CatalogSource the operator subscription is installed from and
    # derive the channel from the release branch of the snapshot.
    - name: create-catalog-source
      runAfter:
        - provision-ephemeral-cluster
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: channel
            type: string
          - name: releaseTestsBranch
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: INDEX_IMAGE
              value: "$(tasks.parse-metadata.results.component-container-image)"
            - name: RELEASE_BRANCH
              value: "$(tasks.parse-metadata.results.target-git-branch)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: extract-channel-name
            script: |
              #!/usr/bin/env bash
              set -x
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                CHANNEL="latest"
              else
                CHANNEL=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo -n "$CHANNEL" | tee $(results.channel.path)

          - name: select-release-tests-branch
            script: |
              #!/usr/bin/env bash
              set -x
              # Version-match the release-tests-ginkgo branch to the OSP build
              # under test: nightly/next/main run from the repo's main branch,
              # release-vX.Y.x GA/z-stream runs from the matching release-vX.Y.
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                TESTS_BRANCH="main"
              else
                TESTS_BRANCH=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/release-v\1/')
              fi
              echo "Target branch: $RELEASE_BRANCH -> Release tests branch: $TESTS_BRANCH"
              echo -n "$TESTS_BRANCH" | tee $(results.releaseTestsBranch.path)

          - name: create-catalog
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              cp /credentials/kubeconfig /tmp/kubeconfig
              cat <<EOF | oc apply -f-
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: "custom-osp-catalog"
                  namespace: openshift-marketplace
                spec:
                  sourceType: grpc
                  image: $INDEX_IMAGE
                  displayName: "Custom OSP Catalog"
                  publisher: Red Hat Local
                  updateStrategy:
                    registryPoll:
                      interval: 30m
              EOF

    # Install the operator by running the Ginkgo olm suite from the release-tests repo.
    # Serial on purpose: the install spec is a single Ordered container.
    # Task timeouts leave ~15m over GINKGO_TIMEOUT for image pull, clone and compile.
    - name: install-pipelines-operator
      runAfter:
        - create-catalog-source
        - configure-loki-logging
      timeout: "45m"
      # OLM install is occasionally flaky (catalog pod not ready, slow subscription
      # reconcile). Install runs with retries:2 so a transient failure here does
      # not abandon the whole run.
      retries: 2
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "install"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Non-admin release-test suites (pipelines, triggers) impersonate the "user"
    # account, so create the test User objects and their RBAC before those suites
    # run. Mirrors release-tests-infra's setup-testing-accounts step: only
    # pipelines and triggers run non-admin; every other suite runs as the
    # provisioned cluster-admin (task-ginkgo-e2e RUN_AS default "admin"). This
    # task only creates Users/RoleBindings (no oauth changes), so admin suites
    # fanned out in parallel are unaffected.
    - name: setup-testing-accounts
      runAfter:
        - install-pipelines-operator
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-setup-testing-accounts.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # Every component suite fans out right after the install and runs in parallel.
    # onError: continue keeps the fan-out going when one suite fails; the finally
    # task still fails the PipelineRun. Suites with no e2e-labelled specs (hub) or
    # external cluster requirements (tektonkueue) are intentionally absent.
    # The pipelines suite's cluster-resolver specs share fixed `releasetest-tasks`
    # and `releasetest-pipelines` namespaces, set up once per process via `sync.Once`
    # and torn down in each process's AfterSuite; under parallel execution one
    # process can delete those fixtures while another spec still needs them, so this
    # suite runs serial (PARALLEL=false) with a timeout sized for one process.
    - name: release-tests-pipelines
      onError: continue
      runAfter:
        - install-pipelines-operator
        - setup-testing-accounts
      timeout: "55m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "non-admin"
        - name: TEST_PATH
          value: "./tests/pipelines/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "45m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Triggers runs the shared, version-matched release-tests branch. Its
    # EventListener specs regenerate route TLS certs into a shared checkout path
    # (testdata/triggers/certs/), which parallel Ginkgo processes would clobber,
    # so the suite runs serial (PARALLEL=false) -- as QE does, running this suite
    # single-process. The admin-only TLS specs are split into
    # release-tests-triggers-tls.
    - name: release-tests-triggers
      onError: continue
      runAfter:
        - install-pipelines-operator
        - setup-testing-accounts
      timeout: "65m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        # The TLS EventListener specs label the namespace
        # (operator.tekton.dev/enable-annotation), which patches the
        # cluster-scoped namespace object and needs cluster-admin a
        # self-provisioner user lacks. They are excluded here and run as admin in
        # release-tests-triggers-tls.
        - name: MODE
          value: "($(params.LABEL_FILTER)) && !tls && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: RUN_AS
          value: "non-admin"
        - name: TEST_PATH
          value: "./tests/triggers/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "50m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Admin half of the triggers split: the TLS EventListener specs patch the
    # cluster-scoped namespace object (operator.tekton.dev/enable-annotation),
    # which a non-admin self-provisioner user cannot do, so they run as admin.
    - name: release-tests-triggers-tls
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
