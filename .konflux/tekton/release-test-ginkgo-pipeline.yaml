---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-test-ginkgo-pipeline
spec:
  description: |
    Release tests driven by the Ginkgo suite in openshift-pipelines/release-tests-ginkgo.

    Provisions an ephemeral Hypershift cluster via OpenShift-CI, points a CatalogSource
    at the Operator index image from the Konflux snapshot, then hands over to the
    release-tests repo: its `olm` suite installs the operator and the component suites
    run afterwards.

    Component suites carry no dependency on each other so Tekton runs them all in
    parallel, and each suite additionally fans out over GINKGO_PROCS Ginkgo processes.
    This matters because the ephemeral cluster only lives for about two hours.
  params:
    - name: SNAPSHOT
      type: string
      description: Snapshot of the application
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
    - name: NAMESPACE
      type: string
      description: Namespace where the Operator bundle will be deployed.
      default: openshift-operators
    - name: IMAGE
      type: string
      description: Image used by the inline helper steps (needs oc).
      default: quay.io/openshift-pipeline/ci:latest
    - name: GINKGO_IMAGE
      type: string
      description: Image used to build and run the Ginkgo suites.
      default: quay.io/openshift-pipeline/release-tests-ginkgo:latest
    - name: RELEASE_TEST_TASKS_REPO
      type: string
      description: Repository the Tekton task definitions are resolved from.
      default: https://github.com/openshift-pipelines/operator
    - name: RELEASE_TEST_TASKS_BRANCH
      type: string
      # TODO: switch back to main once the ginkgo task definitions are merged.
      default: ginkgo-release-tests
    - name: GIT_RELEASE_TESTS_URI
      type: string
      description: Ginkgo release-tests repository.
      default: https://github.com/openshift-pipelines/release-tests-ginkgo.git
    - name: GIT_RELEASE_TESTS_BRANCH
      type: string
      default: main
    - name: LABEL_FILTER
      type: string
      description: Base Ginkgo label filter applied to every component suite.
      default: "e2e && !disconnected"
    - name: GINKGO_PROCS
      type: string
      description: Ginkgo parallel processes used per component suite.
      default: "4"
    - name: GINKGO_FLAKE_ATTEMPTS
      type: string
      description: >-
        Attempts per spec (ginkgo --flake-attempts) for the phase-1 suites and
        metrics. Absorbs transient failures such as admission webhook EOFs
        during HPA scale-down or Prometheus 401s; retried specs are listed as
        FLAKED in the task log. Not applied to pac-config and operator, whose
        serial retries would eat into the two-hour cluster budget.
      default: "2"

  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: extract-ocp-version
      runAfter:
        - parse-metadata
      params:
        - name: componentName
          value: "$(tasks.parse-metadata.results.component-name)"
      taskSpec:
        params:
          - name: componentName
            type: string
        results:
          - name: ocpVersion
            description: The OCP minor version extracted from component name (e.g. 4.20)
        steps:
          - name: extract-version
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPONENT_NAME
                value: "$(params.componentName)"
            script: |
              #!/usr/bin/env bash
              set -e

              # Extract OCP minor version from COMPONENT_NAME
              # Expected format: operator-1-22-index-4-20 -> 4.20
              echo "Component Name: $COMPONENT_NAME"

              VERSION_PATTERN=$(echo "$COMPONENT_NAME" | grep -oE '[0-9]+-[0-9]+' | tail -1)

              if [ -z "$VERSION_PATTERN" ]; then
                echo "Warning: Could not extract version from component name, using default"
                OCP_VERSION="4.20"
              else
                OCP_VERSION=$(echo "$VERSION_PATTERN" | tr '-' '.')
                echo "Extracted OCP Version: $OCP_VERSION"
              fi

              echo -n "$OCP_VERSION" | tee $(results.ocpVersion.path)

    - name: provision-ephemeral-cluster
      runAfter:
        - extract-ocp-version
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: releases
          value: '{"latest":{"release":{"channel":"stable","version":"$(tasks.extract-ocp-version.results.ocpVersion)","architecture":"multi"}}}'
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "m5.2xlarge", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2", "IMAGE_CONTENT_SOURCES": "- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.redhat.io/openshift-pipelines"}'

    # Configure Loki and OpenShift Logging, required by the Results configuration
    # applied during the Ginkgo install suite.
    - name: configure-loki-logging
      runAfter:
        - provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-configure-loki-logging.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # Create the CatalogSource the operator subscription is installed from and
    # derive the channel from the release branch of the snapshot.
    - name: create-catalog-source
      runAfter:
        - provision-ephemeral-cluster
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: channel
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: INDEX_IMAGE
              value: "$(tasks.parse-metadata.results.component-container-image)"
            - name: RELEASE_BRANCH
              value: "$(tasks.parse-metadata.results.target-git-branch)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: extract-channel-name
            script: |
              #!/usr/bin/env bash
              set -x
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                CHANNEL="latest"
              else
                CHANNEL=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo -n "$CHANNEL" | tee $(results.channel.path)

          - name: create-catalog
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              cp /credentials/kubeconfig /tmp/kubeconfig
              cat <<EOF | oc apply -f-
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: "custom-osp-nightly"
                  namespace: openshift-marketplace
                spec:
                  sourceType: grpc
                  image: $INDEX_IMAGE
                  displayName: "Custom OSP Nightly"
                  publisher: Red Hat Local
                  updateStrategy:
                  registryPoll:
                  interval: 30m
              EOF

    # Workaround for OCPBUGS-74567: on multi-arch HyperShift clusters the samples
    # operator imports its imagestreams with importMode=Legacy, which resolves
    # every tag to the control-plane architecture (arm64 on hosted-mgmt2) while
    # the worker nodes are amd64. Every test step that uses
    # image-registry.openshift-image-registry.svc:5000/openshift/golang then dies
    # with "exec format error". Take the imagestreams the suites use away from
    # the samples operator and re-import every tag preserving the manifest list,
    # so each node pulls the manifest for its own architecture. All tags matter:
    # the ecosystem S2I specs build once per tag of each language stream.
    - name: fix-sample-imagestreams
      runAfter:
        - provision-ephemeral-cluster
      timeout: "10m"
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        steps:
          - name: reimport
            image: $(params.IMAGE)
            volumeMounts:
              - name: credentials
                mountPath: /credentials
                readOnly: true
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
              # Imagestreams in the openshift namespace referenced by the test fixtures.
              - name: IMAGESTREAMS
                value: "dotnet golang java nodejs perl php python ruby"
            script: |
              #!/usr/bin/env bash
              set -u -o pipefail
              cp /credentials/kubeconfig "${KUBECONFIG}"

              node_arch="$(oc get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')"
              echo "Node architecture: ${node_arch}"

              missing_tags() {  # <imagestream>: tags whose image provides no ${node_arch}
                local tag archs
                for tag in $(oc get is "$1" -n openshift -o jsonpath='{.status.tags[*].tag}'); do
                  archs="$(oc get istag "$1:${tag}" -n openshift \
                    -o jsonpath='{.image.dockerImageMetadata.Architecture} {.image.dockerImageManifests[*].architecture}' 2>/dev/null)"
                  [[ " ${archs} " == *" ${node_arch} "* ]] || echo "${tag}"
                done
              }

              # Stop the samples operator from managing (and reverting) these imagestreams.
              current="$(oc get configs.samples.operator.openshift.io cluster -o jsonpath='{.spec.skippedImagestreams[*]}' 2>/dev/null)"
              skipped="$(printf '%s\n' ${current} ${IMAGESTREAMS} | sort -u | sed 's/.*/"&"/' | paste -sd, -)"
              oc patch configs.samples.operator.openshift.io cluster --type=merge \
                -p "{\"spec\":{\"skippedImagestreams\":[${skipped}]}}" \
                || echo "WARNING: could not update the samples operator config, it may revert the re-import"

              rc=0
              for is in ${IMAGESTREAMS}; do
                echo "==> ${is}: $(oc get is "${is}" -n openshift -o jsonpath='{.status.tags[*].tag}')"
                # Re-imports every tag from its source keeping the manifest list.
                # Reference tags such as :latest follow the tag they track.
                for attempt in 1 2 3; do
                  oc import-image "${is}" -n openshift --all --import-mode=PreserveOriginal >/dev/null || true
                  missing="$(missing_tags "${is}")"
                  [[ -z "${missing}" ]] && break
                  echo "    attempt ${attempt}: no ${node_arch} image for: $(echo ${missing})"
                  sleep 10
                done
                if [[ -z "${missing}" ]]; then
                  echo "    all tags provide ${node_arch}"
                elif grep -qx latest <<<"${missing}"; then
                  echo "ERROR: ${is}:latest provides no ${node_arch} image; test steps using it will fail"
                  oc get is "${is}" -n openshift -o yaml | sed -n '/^status:/,$p' | head -60
                  rc=1
                else
                  # Typically a tag whose source image no longer exists upstream:
                  # only the S2I spec for that tag fails, so do not block the run.
                  echo "WARNING: ${is}: no ${node_arch} image for $(echo ${missing}); S2I specs for these tags will fail"
                fi
              done
              exit ${rc}

    # Install the operator by running the Ginkgo olm suite from the release-tests repo.
    # Serial on purpose: the install spec is a single Ordered container.
    # Task timeouts leave ~15m over GINKGO_TIMEOUT for image pull, clone and compile.
    - name: install-pipelines-operator
      runAfter:
        - create-catalog-source
        - configure-loki-logging
        - fix-sample-imagestreams
      timeout: "45m"
      # OLM install is occasionally flaky (catalog pod not ready, slow subscription
      # reconcile). QE's acceptance-tests runs install with retries:2; mirror that so
      # a transient failure here does not abandon the whole run.
      retries: 2
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "install"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Component suites run in two phases so the cluster-mutating suites cannot
    # disturb the others while the ephemeral cluster (2h lifetime) is shared.
    #
    # Phase 1 - independent suites, fanned out right after the install. None of
    # them changes settings another suite depends on, so adding a suite here
    # only widens the fan-out.
    # Suites with no e2e-labelled specs (hub) or external cluster requirements
    # (tektonkueue) are intentionally absent.
    - name: release-tests-pipelines
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/pipelines/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # TEMPORARY (validation of release-tests-ginkgo#100): the full triggers
    # suite runs from the PR branch on the fork; restore the shared
    # GIT_RELEASE_TESTS_* params once #100 is merged and backported.
    - name: release-tests-triggers
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: "https://github.com/divyansh42/release-tests-ginkgo.git"
        - name: GIT_RELEASE_TESTS_BRANCH
          value: "triggers-tls-certs-per-process"
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/triggers/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-results
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/results/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-versions
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/versions/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-tls
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/tls/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Longest suite of the phase: its S2I specs start one build per imagestream
    # tag and then only wait, so it gets more processes than the others. With
    # 8 procs the last S2I spec only got a slot ~10 min in; 16 lets all of them
    # start at once, so the suite runs in about the time of its longest spec.
    - name: release-tests-ecosystem
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/ecosystem/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "16"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-pac
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/pac/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # TEMPORARY (validation of release-tests-ginkgo#99): the group-user specs
    # need htpasswd users, which HyperShift clusters cannot provide; #99 makes
    # the suite impersonate them instead. Until it merges, this task clones the
    # PR branch from the fork and runs the full mag suite. Restore the shared
    # GIT_RELEASE_TESTS_* params once #99 is merged (and backported).
    - name: release-tests-mag
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: "https://github.com/divyansh42/release-tests-ginkgo.git"
        - name: GIT_RELEASE_TESTS_BRANCH
          value: "mag-impersonation"
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/mag/"
        - name: PARALLEL
          value: "true"
        # 21 Ordered containers (20 group-user TCs + PIPELINES-28); each runs
        # on one proc, so 8 procs keeps the suite well under 10 minutes.
        - name: GINKGO_PROCS
          value: "8"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # The chains specs rewrite TektonConfig spec.chain, which only rolls the
    # chains controller; no other phase 1 suite depends on it. Not Serial-marked
    # but every spec changes that config, so the suite itself runs single-proc.
    - name: release-tests-chains
      onError: continue
      runAfter:
        - install-pipelines-operator
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/chains/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Phase 2 - suites that rewrite TektonConfig settings shared by every
    # component (metrics mTLS/pruner toggles, the PAC enable/disable toggle,
    # operator add-on/RBAC/pruner/TLS profile settings). Each change rolls all
    # controllers and webhooks, so they wait for phase 1 and then run one after
    # another. onError: continue keeps the chain going when one of them fails;
    # the finally task still fails the PipelineRun.
    - name: release-tests-metrics
      onError: continue
      # Metrics is the most flaky suite (Prometheus scrape timing, pruner mTLS
      # re-enable). Transient failures are absorbed per-spec via GINKGO_FLAKE_ATTEMPTS
      # (default 2); a task-level retry cannot be used here because Tekton forbids it
      # together with onError: continue.
      runAfter:
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-results
        - release-tests-versions
        - release-tests-tls
        - release-tests-ecosystem
        - release-tests-pac
        - release-tests-mag
        - release-tests-chains
      # Budget covers the ~17 min mTLS poll plus per-spec flake reruns.
      timeout: "40m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "$(params.LABEL_FILTER) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/metrics/"
        - name: PARALLEL
          value: "true"
        - name: GINKGO_PROCS
          value: "$(params.GINKGO_PROCS)"
        - name: GINKGO_TIMEOUT
          value: "30m"
        - name: GINKGO_FLAKE_ATTEMPTS
          value: "$(params.GINKGO_FLAKE_ATTEMPTS)"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # PIPELINES-20-TC01 disables and re-enables PAC through TektonConfig, which
    # removes the PAC controller cluster-wide for a few minutes, so it cannot
    # share the cluster with the webhook-driven pac suite in phase 1. Its
    # container is labelled sanity without e2e, hence the inverted filter.
    - name: release-tests-pac-config
      onError: continue
      runAfter:
        - release-tests-metrics
      timeout: "25m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "sanity && !e2e && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: TEST_PATH
          value: "./tests/pac/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "15m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # The operator containers are Serial and most of them rewrite cluster-wide
    # settings the other suites rely on (pruner cron and tekton-pruner TTLs
    # prune their runs, add-on params remove resolver tasks, RBAC creation is
    # switched off, the TLS profile rolls every deployment, the networkpolicy
    # toggle makes the operator proxy webhook unreachable while the policies
    # are re-applied), so they cannot be spread over ginkgo processes or run
    # next to anything else on a single cluster. The auto-prune and
    # tekton-pruner specs make up ~37 of the ~60 min. The upgrade specs only
    # make sense in an upgrade pipeline, so they are filtered out here; the
    # HPA check (PIPELINES-13) is labelled without e2e and is added explicitly.
    # The tests/operator/ package used to run as a single ~73m task, which was the
    # casualty when the ephemeral cluster hit its ~2h cap. Following the proven QE
    # acceptance-tests layout, it is split into parallel per-domain tasks (each runs
    # the same package filtered to one label set), so the longest one is ~35m and the
    # suite comfortably finishes inside the cap. Each specs' Describe is Serial/Ordered
    # internally, and the domains touch different TektonConfig sections, so running the
    # tasks concurrently against the one cluster mirrors what QE already validates.
    - name: release-tests-operator-rbac
      onError: continue
      runAfter:
        - release-tests-pac-config
      timeout: "25m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && rbac && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "20m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-operator-addon
      onError: continue
      runAfter:
        - release-tests-pac-config
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && addon && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "25m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-operator-auto-prune
      onError: continue
      runAfter:
        - release-tests-pac-config
      timeout: "40m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && auto-prune && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "35m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    - name: release-tests-operator-tekton-pruner
      onError: continue
      runAfter:
        - release-tests-pac-config
      timeout: "40m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "($(params.LABEL_FILTER)) && tekton-pruner && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "35m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

    # Fast operator specs grouped into one task. hpa carries no "e2e" label, so the
    # original `|| hpa` escape hatch is preserved here.
    - name: release-tests-operator-misc
      onError: continue
      runAfter:
        - release-tests-pac-config
      timeout: "30m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
        - name: MODE
          value: "(($(params.LABEL_FILTER)) || hpa) && (roles || networkpolicy || hpa || tls-profile) && !to-do && !skip-$(tasks.extract-ocp-version.results.ocpVersion) && !pre-upgrade && !post-upgrade"
        - name: TEST_PATH
          value: "./tests/operator/"
        - name: PARALLEL
          value: "false"
        - name: GINKGO_TIMEOUT
          value: "25m"
        - name: CATALOG_SOURCE
          value: "custom-osp-nightly"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"

  finally:
    # Verify aggregate status and fail the pipeline if any test task failed. On
    # failure it also enumerates the failed suite tasks and prints a ready-to-paste
    # rerun filter, mirroring QE acceptance-tests' evaluate-test-suites.rerun-command.
    - name: verify-e2e-tests-status
      params:
        - name: aggregateStatus
          value: "$(tasks.status)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
      taskSpec:
        params:
          - name: aggregateStatus
          - name: pipelineRunName
        steps:
          - name: verify-aggregate-status
            image: $(params.IMAGE)
            script: |
              #!/usr/bin/env bash
              echo "📋 Aggregate Status: $(params.aggregateStatus)"

              if [[ "$(params.aggregateStatus)" == "Succeeded" ]]; then
                echo "✅ All tasks succeeded!"
                exit 0
              fi

              echo "❌ Pipeline contains failed tasks!"

              # The PipelineRun lives in this (Konflux) cluster, so the in-cluster
              # service account token lets us read it back and list the failed suites.
              pr="$(params.pipelineRunName)"
              failed=""
              if command -v oc >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
                failed="$(oc get pipelinerun "${pr}" -o json 2>/dev/null \
                  | jq -r '.status.childReferences[]?.name' \
                  | while read -r tr; do
                      [[ -z "${tr}" ]] && continue
                      cond="$(oc get taskrun "${tr}" -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}' 2>/dev/null)"
                      name="$(oc get taskrun "${tr}" -o jsonpath='{.metadata.labels.tekton\.dev/pipelineTask}' 2>/dev/null)"
                      if [[ "${cond}" == "False" && "${name}" == release-tests-* ]]; then
                        echo "${name}"
                      fi
                    done | sort -u)"
              fi

              if [[ -n "${failed}" ]]; then
                echo ""
                echo "🔁 Failed suites:"
                echo "${failed}" | sed 's/^/   - /'
                echo ""
                echo "💡 Rerun only the failed suites by restarting the PipelineRun with"
                echo "   these tasks (others can be pruned from the run), or run locally:"
                echo "${failed}" | sed 's/^release-tests-/   ginkgo run --label-filter="/; s/$/" ./tests\/<suite>\//'
              else
                echo "💡 Check individual task logs for detailed error information"
                echo "   (could not enumerate failed suites automatically)."
              fi

              exit 1
