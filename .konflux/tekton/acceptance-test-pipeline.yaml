        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        # Moved out of phase 1 to run in the tail (in parallel with addon / the
        # pruner suites) after the main parallel suite batch, to reduce peak
        # concurrency on the ephemeral cluster.
        - install-pipelines-operator
        - release-tests-versions
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-chains
