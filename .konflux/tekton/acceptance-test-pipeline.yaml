        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        # Pruner suite mutates cluster-wide pruning config and deletes
        # PipelineRuns/TaskRuns; run after all other suites so it does not
        # prune resources those suites depend on.
        - install-pipelines-operator
        - release-tests-versions
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-chains
        - release-tests-pac
        - release-tests-results
        - release-tests-metrics
        - release-tests-manual-approval
        - release-tests-rbac
        - release-tests-addon
        - release-tests-ecosystem
        - release-tests-ecosystem-s2i
        - release-tests-auto-prune

    #Release Tests - Ecosystem
    # KNOWN ISSUE (SRVKP-11139): on OCP >= 4.20 the ecosystem buildah-ns scenario is
    # reported by gauge as a skip-as-fail, so this suite shows up as FailureIgnored.
    # It is a tracked known bug, not a product/migration regression -> onError: continue.
    - name: release-tests-ecosystem
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
