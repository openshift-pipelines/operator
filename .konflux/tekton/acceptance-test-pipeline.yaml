        - release-tests-ecosystem-s2i

    #Release Tests - Operator Addon
    - name: release-tests-addon
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
