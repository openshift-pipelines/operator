---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: acceptance-test-pipeline
spec:
  description: |
    An integration test which provisions an ephemeral Hypershift cluster via OpenShift-CI
    and deploys an Operator bundle from a Konflux snapshot.
  # ==========================================================================
  # Pipeline parameters
  # ==========================================================================
  params:
    - description: Snapshot of the application
      name: SNAPSHOT
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - description: Namespace where the the Operator bundle will be deployed.
      name: NAMESPACE
      default: openshift-operators
      type: string
    - name: IMAGE
      type: string
      default: quay.io/openshift-pipeline/ci:latest
    - name: TAGS
      default: "(e2e | sanity)"
    - name: RELEASE_TEST_TASKS_REPO
      default: https://github.com/openshift-pipelines/operator
    - name: RELEASE_TEST_TASKS_BRANCH
      default: main
    - name: GIT_RELEASE_TESTS_URI
      default: https://github.com/openshift-pipelines/release-tests.git
    - name: OCP_RELEASE_STREAM
      description: |
        Which OpenShift release payload to provision: "auto" (default) probes the
        stable upgrade graph for the target minor and falls back to the nightly
        payload when no GA release exists yet (e.g. a pre-GA 4.23). Set to "stable"
        or "nightly" to force a specific stream.
      default: "auto"
    - name: ARM_OCP_VERSIONS
      description: |
        Space-separated list of OCP minor versions whose ephemeral cluster should
        be provisioned with ARM (AWS Graviton) compute nodes instead of amd64. Any
        minor not in this list gets amd64 compute nodes. Defaults to "4.18 4.20".
      default: "4.18 4.20"
    - name: ARM_COMPUTE_NODE_TYPE
      description: AWS instance type used for the hosted cluster's compute nodes when the OCP minor is in ARM_OCP_VERSIONS.
      default: "m6g.2xlarge"
    - name: AMD64_COMPUTE_NODE_TYPE
      description: AWS instance type used for the hosted cluster's compute nodes for all other OCP minors.
      default: "m5.2xlarge"
    - name: WAIT_FOR_TEARDOWN_TIMEOUT
      description: |
        How long the provision-ephemeral-cluster task waits for the tearDown
        signal before auto-deprovisioning the cluster. Empty uses the task
        default (2h); set a longer duration (e.g. 4h) so long-running suites
        such as auto-prune can finish within the cluster lifetime.
      default: "4h"

  tasks:
    # ==========================================================================
    # Phase 1 - Provision the ephemeral cluster and configure logging
    # ==========================================================================
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: extract-ocp-version
      runAfter:
        - parse-metadata
      params:
        - name: componentName
          value: "$(tasks.parse-metadata.results.component-name)"
        - name: releaseStream
          value: "$(params.OCP_RELEASE_STREAM)"
        - name: armVersions
          value: "$(params.ARM_OCP_VERSIONS)"
        - name: armNodeType
          value: "$(params.ARM_COMPUTE_NODE_TYPE)"
        - name: amdNodeType
          value: "$(params.AMD64_COMPUTE_NODE_TYPE)"
      taskSpec:
        params:
          - name: componentName
            type: string
          - name: releaseStream
            type: string
            default: "auto"
          - name: armVersions
            type: string
            default: "4.18 4.20"
          - name: armNodeType
            type: string
            default: "m6g.2xlarge"
          - name: amdNodeType
            type: string
            default: "m5.2xlarge"
        results:
          - name: ocpVersion
            description: The OCP minor version extracted from component name (e.g. 4.20)
          - name: releases
            description: |
              The ci-operator "releases" JSON for the provision task. Uses the stable
              release payload for GA minors, or the nightly candidate payload for
              pre-GA minors (no stable release yet).
          - name: computeNodeType
            description: |
              AWS instance type for the hosted cluster's compute nodes. ARM
              (Graviton) instance for minors in armVersions, otherwise amd64.
          - name: clusterArch
            description: Target compute architecture for the hosted cluster workers (arm64 or amd64).
        steps:
          - name: extract-version
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            env:
              - name: COMPONENT_NAME
                value: "$(params.componentName)"
              - name: RELEASE_STREAM
                value: "$(params.releaseStream)"
              - name: ARM_VERSIONS
                value: "$(params.armVersions)"
              - name: ARM_NODE_TYPE
                value: "$(params.armNodeType)"
              - name: AMD_NODE_TYPE
                value: "$(params.amdNodeType)"
            script: |
              #!/usr/bin/env bash
              set -e

              # Validate the release-stream override up front so a typo fails
              # loudly instead of silently falling through to the stable payload.
              case "$RELEASE_STREAM" in
                auto|stable|nightly) ;;
                *)
                  echo "ERROR: invalid OCP_RELEASE_STREAM '$RELEASE_STREAM'; expected one of: auto, stable, nightly" >&2
                  exit 1
                  ;;
              esac

              # Extract OCP minor version from COMPONENT_NAME
              # Expected format: operator-1-22-index-4-20 -> 4.20
              echo "Component Name: $COMPONENT_NAME"

              VERSION_PATTERN=$(echo "$COMPONENT_NAME" | grep -oE '[0-9]+-[0-9]+' | tail -1)

              if [ -z "$VERSION_PATTERN" ]; then
                echo "Warning: Could not extract version from component name, using default"
                OCP_VERSION="4.20"
              else
                OCP_VERSION=$(echo "$VERSION_PATTERN" | tr '-' '.')
                echo "Extracted OCP Version: $OCP_VERSION"
              fi

              echo -n "$OCP_VERSION" | tee $(results.ocpVersion.path)
              echo

              # Decide the hosted cluster's compute architecture from the OCP minor.
              # so their tests run on arm64; everything else stays amd64.
              COMPUTE_NODE_TYPE="$AMD_NODE_TYPE"
              CLUSTER_ARCH="amd64"
              for v in $ARM_VERSIONS; do
                if [ "$v" = "$OCP_VERSION" ]; then
                  COMPUTE_NODE_TYPE="$ARM_NODE_TYPE"
                  CLUSTER_ARCH="arm64"
                  break
                fi
              done
              echo "Architecture decision: OCP ${OCP_VERSION} -> arch=${CLUSTER_ARCH}, computeNodeType=${COMPUTE_NODE_TYPE} (ARM minors: ${ARM_VERSIONS})"

              echo -n "$COMPUTE_NODE_TYPE" | tee $(results.computeNodeType.path)
              echo
              echo -n "$CLUSTER_ARCH" | tee $(results.clusterArch.path)
              echo

              # Decide which release payload to provision. A pre-GA minor (e.g. 4.23
              # before it ships) has no release on the stable channel, so the
              # ci-operator stable resolution returns an empty list and provisioning
              # fails at input resolution. In that case provision the nightly payload.
              stream="$RELEASE_STREAM"
              if [ "$stream" = "auto" ]; then
                graph="https://api.openshift.com/api/upgrades_info/graph?arch=multi&channel=stable-${OCP_VERSION}"
                echo "Probing stable channel for ${OCP_VERSION}: $graph"
                # Default to stable so a probe/network error preserves current behavior
                # (GA minors keep working); only switch to nightly on a definitive
                # empty release list.
                stream="stable"
                if resp=$(curl -fsS --connect-timeout 10 --max-time 30 "$graph" 2>/dev/null); then
                  if echo "$resp" | grep -q '"nodes":\[\]'; then
                    echo "No GA release found on stable-${OCP_VERSION}; using nightly payload."
                    stream="nightly"
                  else
                    echo "Found GA releases on stable-${OCP_VERSION}; using stable payload."
                  fi
                else
                  echo "WARN: could not probe the stable upgrade graph; defaulting to stable."
                fi
              fi

              if [ "$stream" = "nightly" ]; then
                releases="{\"latest\":{\"candidate\":{\"product\":\"ocp\",\"stream\":\"nightly\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              else
                releases="{\"latest\":{\"release\":{\"channel\":\"stable\",\"version\":\"${OCP_VERSION}\",\"architecture\":\"multi\"}}}"
              fi
              echo "Selected release stream: $stream"
              echo "releases: $releases"
              printf '%s' "$releases" | tee $(results.releases.path)

    - name: provision-ephemeral-cluster
      runAfter:
        - extract-ocp-version
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: releases
          value: '$(tasks.extract-ocp-version.results.releases)'
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "$(tasks.extract-ocp-version.results.computeNodeType)", "HYPERSHIFT_NODE_ARCH": "$(tasks.extract-ocp-version.results.clusterArch)", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2", "CONTROL_PLANE_NODE_SELECTOR": "kubernetes.io/arch=$(tasks.extract-ocp-version.results.clusterArch)", "FIPS": "true", "IMAGE_CONTENT_SOURCES": "- mirrors:\n  - quay.io/openshift-pipeline\n  source: registry.redhat.io/openshift-pipelines"}'
        - name: waitForTearDownTimeout
          value: "$(params.WAIT_FOR_TEARDOWN_TIMEOUT)"

    # Configure Loki and OpenShift Logging
    - name: configure-loki-logging
      runAfter:
        - provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-configure-loki-logging.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)

    # ==========================================================================
    # Phase 2 - Build the snapshot catalog source and install the operator
    # ==========================================================================
    # Create Catalog Source to install Operator
    - name: create-catalog-source
      runAfter:
        - provision-ephemeral-cluster
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        params:
          - name: CLUSTER_SECRET_REF
            type: string
        results:
          - name: channel
            type: string
          - name: releaseTestsBranch
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.CLUSTER_SECRET_REF)
        stepTemplate:
          image: $(params.IMAGE)
          env:
            - name: INDEX_IMAGE
              value: "$(tasks.parse-metadata.results.component-container-image)"
            - name: RELEASE_BRANCH
              value: "$(tasks.parse-metadata.results.target-git-branch)"
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
        steps:
          - name: extract-channel-name
            script: |
              #!/usr/bin/env bash
              set -x
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                CHANNEL="latest"
              else
                CHANNEL=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/pipelines-\1/')
              fi
              echo -n "$CHANNEL" | tee $(results.channel.path)

          - name: select-release-tests-branch
            script: |
              #!/usr/bin/env bash
              set -x
              # For release-vX.Y.x use the matching release-vX.Y branch of release-tests
              # For nightly, next and main use the master branch
              if [[ "$RELEASE_BRANCH" == "next" || "$RELEASE_BRANCH" == "nightly" || "$RELEASE_BRANCH" == "main" ]]; then
                TESTS_BRANCH="master"
              else
                TESTS_BRANCH=$(echo "$RELEASE_BRANCH" | sed -E 's/release-v([0-9]+\.[0-9]+)\.x/release-v\1/')
              fi
              echo "Target branch: $RELEASE_BRANCH -> Release tests branch: $TESTS_BRANCH"
              echo -n "$TESTS_BRANCH" | tee $(results.releaseTestsBranch.path)

          - name: create-catalog
            env:
              - name: KUBECONFIG
                value: "/tmp/kubeconfig"
            script: |
              #!/usr/bin/env bash
              cp /credentials/kubeconfig /tmp/kubeconfig
              cat <<EOF | oc apply -f-
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata:
                  name: "custom-osp-catalog"
                  namespace: openshift-marketplace
                spec:
                  sourceType: grpc
                  image: $INDEX_IMAGE
                  displayName: "Custom OSP Catalog"
                  publisher: Red Hat Local
                  updateStrategy:
                    registryPoll:
                      interval: 30m
              EOF

    #Release Tests - Install Pipelines Operator
    - name: install-pipelines-operator
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/olm.spec"
        - name: TAGS
          value: "install"
        - name: CATALOG_SOURCE
          value: "custom-osp-catalog"
        - name: CHANNEL
          value: "$(tasks.create-catalog-source.results.channel)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - create-catalog-source
        - configure-loki-logging

    - name: setup-testing-accounts
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-setup-testing-accounts.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
      runAfter:
        - install-pipelines-operator

    # ==========================================================================
    # Phase 3 - Release-test suites (run in parallel once the operator is up)
    # ==========================================================================
    #Release Tests - Chains
    - name: release-tests-chains
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/chains/"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: MAX_RETRIES
          value: "3"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - install-pipelines-operator

    #Release Tests - Manual Approval Gate
    - name: release-tests-manual-approval
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/manualapprovalgate/"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MAG_USE_IMPERSONATION
          value: "true"
      runAfter:
        - setup-testing-accounts

    #Release Tests - Metrics
    - name: release-tests-metrics
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/metrics/"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: MAX_RETRIES
          value: "3"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - install-pipelines-operator

    #Release Tests - Pipelines as Code
    - name: release-tests-pac
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/pac/"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: MAX_RETRIES
          value: "3"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - install-pipelines-operator

    #Release Tests - Versions
    - name: release-tests-versions
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/versions.spec"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - install-pipelines-operator

    #Release Tests - Pipelines (non-admin via kubeconfig impersonation)
    - name: release-tests-pipelines
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "non-admin"
        - name: SPECS
          value: "specs/pipelines/"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
        - name: MAX_RETRIES
          value: "3"
      runAfter:
        - setup-testing-accounts

    #Release Tests - Triggers (non-admin via kubeconfig impersonation)
    - name: release-tests-triggers
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "non-admin"
        - name: SPECS
          value: "specs/triggers/"
        - name: TAGS
          value: "$(params.TAGS),!tls"
        - name: OCP_VERSION
          value: "$(tasks.extract-ocp-version.results.ocpVersion)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - setup-testing-accounts

    #Release Tests - Results (non-admin via kubeconfig impersonation)
    - name: release-tests-results
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/results/"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: MAX_RETRIES
          value: "3"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - setup-testing-accounts

    #Release Tests - Triggers TLS
    - name: release-tests-triggers-tls
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/triggers/eventlistener.spec"
        - name: TAGS
          value: "tls,$(params.TAGS)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - setup-testing-accounts

    #Release Tests - Operator RBAC
    - name: release-tests-rbac
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/operator/rbac.spec"
        - name: TAGS
