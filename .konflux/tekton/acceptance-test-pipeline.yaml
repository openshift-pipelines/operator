          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/ecosystem/ecosystem.spec"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - install-pipelines-operator

    #Release Tests - Ecosystem S2I
    - name: release-tests-ecosystem-s2i
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/ecosystem/ecosystem-s2i.spec"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: MAX_RETRIES
          value: "3"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        - install-pipelines-operator

  finally:
    # ==========================================================================
    # Always-run - Aggregate suite results and fail the pipeline on any failure
    # ==========================================================================
    # Deprovision disabled to save pipeline completion time
    # Ephemeral clusters are automatically pruned after WAIT_FOR_TEARDOWN_TIMEOUT
    # (default 4h), so no manual cleanup is required
    # - name: deprovision-ephemeral-cluster
    #   taskRef:
    #     resolver: git
    #     params:
    #       - name: url
    #         value: https://github.com/openshift/konflux-tasks
    #       - name: revision
    #         value: main
    #       - name: pathInRepo
    #         value: tasks/deprovision-ephemeral-cluster/0.1/deprovision-ephemeral-cluster.yaml
    #   params:
    #     - name: testPlatformClusterClaimName
    #       value: $(tasks.provision-ephemeral-cluster.results.testPlatformClusterClaimName)
    #     - name: testPlatformClusterClaimNamespace
    #       value: $(tasks.provision-ephemeral-cluster.results.testPlatformClusterClaimNamespace)

    # Verify aggregate status, print a per-suite summary and a rerun hint for failed suites
    - name: verify-e2e-tests-status
      params:
        - name: aggregateStatus
          value: "$(tasks.status)"
        - name: suiteStatuses
          value: |
            install-pipelines-operator=$(tasks.install-pipelines-operator.status)
            release-tests-versions=$(tasks.release-tests-versions.status)
            release-tests-pipelines=$(tasks.release-tests-pipelines.status)
            release-tests-triggers=$(tasks.release-tests-triggers.status)
            release-tests-triggers-tls=$(tasks.release-tests-triggers-tls.status)
            release-tests-chains=$(tasks.release-tests-chains.status)
            release-tests-pac=$(tasks.release-tests-pac.status)
            release-tests-results=$(tasks.release-tests-results.status)
            release-tests-metrics=$(tasks.release-tests-metrics.status)
            release-tests-manual-approval=$(tasks.release-tests-manual-approval.status)
            release-tests-rbac=$(tasks.release-tests-rbac.status)
            release-tests-addon=$(tasks.release-tests-addon.status)
            release-tests-ecosystem=$(tasks.release-tests-ecosystem.status)
            release-tests-ecosystem-s2i=$(tasks.release-tests-ecosystem-s2i.status)
            release-tests-auto-prune=$(tasks.release-tests-auto-prune.status)
            release-tests-tekton-pruner=$(tasks.release-tests-tekton-pruner.status)
      taskSpec:
        params:
          - name: aggregateStatus
          - name: suiteStatuses
        steps:
          - image: $(params.IMAGE)
            name: verify-aggregate-status
            script: |
              #!/usr/bin/env bash
              echo "📋 Aggregate Status: $(params.aggregateStatus)"
              echo ""
              echo "Per-suite results:"

              failed=""
              while IFS='=' read -r name status; do
                name="$(echo "$name" | tr -d '[:space:]')"
                status="$(echo "$status" | tr -d '[:space:]')"
                [ -z "$name" ] && continue
                if [[ "$status" == "Succeeded" || "$status" == "Completed" ]]; then
                  echo "  ✅ ${name}: ${status}"
                elif [[ "$status" == "None" || -z "$status" ]]; then
                  echo "  ⏭️  ${name}: skipped (${status:-None})"
                else
                  echo "  ❌ ${name}: ${status}"
                  failed="${failed} ${name}"
                fi
              done <<'EOF'
              $(params.suiteStatuses)
              EOF

              if [[ -n "$failed" ]]; then
                echo ""
                echo "❌ Failed suites:${failed}"
                echo "💡 To rerun only the failed suites, set TEST_SUITES to:${failed}"
              fi

              if [[ "$(params.aggregateStatus)" != "Succeeded" ]]; then
                echo ""
                echo "❌ Pipeline contains failed tasks!"
                echo "💡 Check individual task logs for detailed error information"
                exit 1
              fi

              echo ""
              echo "✅ All tasks succeeded!"
