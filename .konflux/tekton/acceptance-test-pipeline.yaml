      runAfter:
        # Moved out of phase 1 to run in the tail (in parallel with rbac / the
        # pruner suites) after the main parallel suite batch, to reduce peak
        # concurrency on the ephemeral cluster.
        - install-pipelines-operator
        - release-tests-versions
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-chains
        - release-tests-pac
        - release-tests-results
        - release-tests-metrics
        - release-tests-manual-approval
        - release-tests-ecosystem
        - release-tests-ecosystem-s2i

    # ==========================================================================
    # Phase 4 - Pruning suites (serialized tail; mutate cluster-wide config)
    # ==========================================================================
    # Auto-prune suite: mutates cluster-wide pruning config and has a long test
    # tail, so it needs the extended ephemeral-cluster lifetime (see the
    # WAIT_FOR_TEARDOWN_TIMEOUT param). Runs after all other suites and is
    # serialized before tekton-pruner.
    #Release Tests - Operator Auto Prune
    - name: release-tests-auto-prune
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: RUN_AS
          value: "admin"
        - name: SPECS
          value: "specs/operator/auto-prune.spec"
        - name: TAGS
          value: "$(params.TAGS)"
        - name: GIT_RELEASE_TESTS_URI
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: GIT_RELEASE_TESTS_BRANCH
          value: $(tasks.create-catalog-source.results.releaseTestsBranch)
      runAfter:
        # Pruner tests mutate cluster-wide pruning config and delete
        # PipelineRuns/TaskRuns; run after all other suites so they do not
        # prune resources those suites depend on.
        - install-pipelines-operator
        - release-tests-versions
        - release-tests-pipelines
        - release-tests-triggers
        - release-tests-triggers-tls
        - release-tests-chains
        - release-tests-pac
        - release-tests-results
        - release-tests-metrics
        - release-tests-manual-approval
        - release-tests-rbac
        - release-tests-addon
        - release-tests-ecosystem
        - release-tests-ecosystem-s2i

    #Release Tests - Tekton Pruner
    - name: release-tests-tekton-pruner
      onError: continue
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-e2e-pipeline.yaml
      params:
        - name: CLUSTER_SECRET_REF
