    # TEMPORARY (validation of release-tests-ginkgo#99): the group-user specs need
    # htpasswd users, which HyperShift clusters cannot provide; #99 makes the suite
    # impersonate them instead. Restore the shared GIT_RELEASE_TESTS_* params once
    # #99 is merged (and backported).
    - name: release-tests-mag
      onError: continue
      runAfter:
        - upgrade-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
            value: .konflux/tekton/task-ginkgo-e2e.yaml
      params:
        - name: CLUSTER_SECRET_REF
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
        - name: IMAGE
          value: $(params.GINKGO_IMAGE)
