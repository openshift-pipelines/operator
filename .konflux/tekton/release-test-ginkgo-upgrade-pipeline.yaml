    # Longest suite of the phase: its S2I specs start one build per imagestream tag
    # and then only wait, so it gets more processes than the others.
    - name: release-tests-ecosystem
      onError: continue
      runAfter:
        - upgrade-operator
      timeout: "45m"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.RELEASE_TEST_TASKS_REPO)
          - name: revision
            value: $(params.RELEASE_TEST_TASKS_BRANCH)
          - name: pathInRepo
