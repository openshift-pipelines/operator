---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: setup-testing-accounts
spec:
  description: |
    Creates OpenShift User objects for non-admin test identities on a HyperShift
    cluster. HTPasswd IDP cannot be configured (oauth/cluster is blocked by
    ValidatingAdmissionPolicy), so tests use kubeadmin with --as=<user>
    impersonation instead of password-based login.
  params:
    - name: CLUSTER_SECRET_REF
      type: string
      description: "Name of the Secret containing kubeconfig and kubeAdminPassword keys"
    - name: IMAGE
      description: CI image that contains the oc client
      default: quay.io/openshift-pipeline/ci:latest
  volumes:
    - name: credentials
      secret:
        secretName: $(params.CLUSTER_SECRET_REF)
  stepTemplate:
    image: $(params.IMAGE)
    volumeMounts:
      - name: credentials
        mountPath: /credentials
  steps:
    - name: setup-testing-accounts
      env:
        - name: KUBECONFIG
          value: "/tmp/kubeconfig"
      script: |
        #!/usr/bin/env bash
        set -e -u -o pipefail

        cp /credentials/kubeconfig /tmp/kubeconfig
        echo "Setting up testing accounts on ephemeral HyperShift cluster..."
        echo "Cluster: $(oc whoami --show-server)"

        echo "Credentials secret keys:"
        ls -la /credentials/

        # Create OpenShift User objects for test identities.
        # These are needed so that:
        #  - kubeadmin can impersonate them with --as=<user>
        #  - they can be added to OpenShift Groups for MAG tests
        USERS=(user user1 user2 user3 user4 user5 user6 user7 user8 user9 consoledeveloper pipelinesdeveloper)

        for u in "${USERS[@]}"; do
          oc create user "$u" --dry-run=client -o yaml | oc apply -f-
          echo "User '$u' created"
        done

        # Assign cluster roles matching what htpasswd users had
        oc adm policy add-cluster-role-to-user self-provisioner consoledeveloper || true
        oc adm policy add-cluster-role-to-user view consoledeveloper || true
        oc adm policy add-cluster-role-to-user basic-user pipelinesdeveloper || true

        # Non-admin release-test suites (RUN_AS=non-admin) impersonate these users
        # via `oc --as=<user>`. Impersonated identities only receive the
        # system:authenticated group (not system:authenticated:oauth), so they do
        # not inherit the default self-provisioner grant a real logged-in user
        # has. The Ginkgo framework self-creates a test namespace per Describe
        # with the impersonated identity, so grant the test users self-provisioner
        # (namespace creation) plus edit on the operand namespace, matching the
        # access a real non-admin user has in release-tests-infra.
        for u in "${USERS[@]}"; do
          oc adm policy add-cluster-role-to-user self-provisioner "$u" || true
          oc create rolebinding "${u}-edit" --clusterrole=edit --user="$u" \
            -n openshift-pipelines 2>/dev/null \
            || oc create rolebinding "${u}-edit" --clusterrole=edit --user="$u" \
                 -n openshift-pipelines --dry-run=client -o yaml | oc apply -f- || true
        done
        echo "self-provisioner + openshift-pipelines edit granted to test users"

        # Grant MAG approver RBAC to all test users cluster-wide.
        # After openshift-pipelines/manual-approval-gate@dc388bb the
        # system:authenticated binding was removed, so approvers need an
        # explicit grant of manual-approval-gate-approver ClusterRole.
        # Test namespaces are created dynamically (releasetest-xxxxx) so
        # a ClusterRoleBinding is simpler than per-namespace RoleBindings.
        for u in "${USERS[@]}"; do
          cat <<EOF | oc apply -f-
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: mag-approver-${u}
        subjects:
        - kind: User
          name: ${u}
          apiGroup: rbac.authorization.k8s.io
        roleRef:
          kind: ClusterRole
          name: manual-approval-gate-approver
          apiGroup: rbac.authorization.k8s.io
        EOF
          echo "ClusterRoleBinding 'mag-approver-${u}' created"
        done

        # Verify impersonation works
        WHOAMI=$(oc --as=user1 whoami 2>&1) || true
        echo "Impersonation test (--as=user1): $WHOAMI"

        echo ""
        echo "Testing accounts configured successfully (impersonation mode)!"
        echo ""
        echo "User               | Cluster roles"
        echo "-------------------|-----------------------------"
        echo "consoledeveloper   | self-provisioner, view, edit(openshift-pipelines)"
        echo "pipelinesdeveloper | basic-user, self-provisioner, edit(openshift-pipelines)"
        echo "user               | self-provisioner, edit(openshift-pipelines)"
        for i in $(seq 1 9); do
          printf "user%-14s | self-provisioner, edit(openshift-pipelines)\n" "$i"
        done
