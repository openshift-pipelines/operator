---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: setup-testing-accounts
spec:
  description: |
    Sets up non-admin test users on an ephemeral HyperShift cluster using
    ServiceAccount-based credentials. kubeAdminPassword (now available in the
    credentials secret after DPTP-5306) is used to verify admin access.
    HTPasswd IDP cannot be configured on HyperShift — oauth/cluster is blocked
    by ValidatingAdmissionPolicy — so SAs are used instead of htpasswd users.
  params:
    - name: CLUSTER_SECRET_REF
      type: string
      description: "Name of the Secret containing kubeconfig and kubeAdminPassword keys"
    - name: IMAGE
      description: CI image that contains the oc client
      default: quay.io/openshift-pipeline/ci:latest
  volumes:
    - name: credentials
      secret:
        secretName: $(params.CLUSTER_SECRET_REF)
  stepTemplate:
    image: $(params.IMAGE)
    volumeMounts:
      - name: credentials
        mountPath: /credentials
  steps:
    - name: setup-testing-accounts
      env:
        - name: KUBECONFIG
          value: "/tmp/kubeconfig"
      script: |
        #!/usr/bin/env bash
        set -e -u -o pipefail

        cp /credentials/kubeconfig /tmp/kubeconfig
        echo "Setting up testing accounts on ephemeral HyperShift cluster..."
        echo "Cluster: $(oc whoami --show-server)"

        # Read kubeAdminPassword from the credentials secret (available after DPTP-5306)
        KUBE_ADMIN_PASSWORD=$(cat /credentials/kubeAdminPassword)
        echo "kubeAdminPassword retrieved from credentials secret"

        # Verify kubeadmin password works
        API_SERVER=$(oc whoami --show-server)
        oc login -u kubeadmin -p "$KUBE_ADMIN_PASSWORD" \
          "$API_SERVER" --insecure-skip-tls-verify=true
        echo "kubeadmin login verified with kubeAdminPassword"

        # Create namespace for test service accounts
        TEST_NS="test-users"
        oc create namespace "$TEST_NS" --dry-run=client -o yaml | oc apply -f-

        # Create service accounts to act as non-admin test users
        # and bind cluster roles matching what htpasswd users had
        declare -A SA_ROLES=(
          ["consoledeveloper"]="self-provisioner view"
          ["pipelinesdeveloper"]="basic-user"
          ["user"]=""
        )

        for sa in "${!SA_ROLES[@]}"; do
          oc create sa "$sa" -n "$TEST_NS" --dry-run=client -o yaml | oc apply -f-
          for role in ${SA_ROLES[$sa]}; do
            oc adm policy add-cluster-role-to-user "$role" \
              "system:serviceaccount:${TEST_NS}:${sa}" || true
          done
          echo "ServiceAccount '$sa' created in namespace '$TEST_NS'"
        done

        # user1..user9 as plain SAs (no extra cluster roles)
        for i in $(seq 1 9); do
          oc create sa "user${i}" -n "$TEST_NS" --dry-run=client -o yaml | oc apply -f-
          echo "ServiceAccount 'user${i}' created"
        done

        echo ""
        echo "Testing accounts (SA-based) configured successfully!"
        echo "Namespace: $TEST_NS"
        echo ""
        echo "ServiceAccount    | Cluster roles"
        echo "------------------|-----------------------------"
        echo "consoledeveloper  | self-provisioner, view"
        echo "pipelinesdeveloper| basic-user"
        echo "user              | default"
        for i in $(seq 1 9); do
          printf "user%-12s | default\n" "$i"
        done
