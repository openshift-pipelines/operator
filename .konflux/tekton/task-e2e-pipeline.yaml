---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: e2e-test-pipelines
spec:
  params:
    - name: CLUSTER_SECRET_REF
      type: string
      description: "Name of the Secret containing the cluster kubeconfig (key: kubeconfig)"
    - name: GIT_RELEASE_TESTS_URI
      default: https://github.com/openshift-pipelines/release-tests.git
    - name: GIT_RELEASE_TESTS_BRANCH
      default: master
    - name: CATALOG_SOURCE
      description: Provide catalog-source name through which user have to subscribe operator
      default: redhat-operators
    - name: CHANNEL
      default: latest
    - name: CHAINS_REPOSITORY
      default: "quay.io/openshift-pipeline/chainstest"
      description: the url of the repository where the test image will be pushed
    - name: FAIL_ON_ERROR
      default: "false"
    - name: IMAGE
      description: release-tests image
      default: quay.io/openshift-pipeline/ci
    - name: RUN_AS
      description: Provide user privilege to runs tests with  (eg one of admin/non-admin)
      default: "non-admin"
    - name: SPECS
      description: Run tests only from that specific directory
    - name: TAGS
      description: Tags defines the nature of test cases you want to execute. (eg "e2e,integration")
      default: "e2e,non-admin"
    - name: OCP_VERSION
      default: ""
    - name: MAG_USE_IMPERSONATION
      description: "Set to 'true' to use --as=<user> impersonation for MAG tests (required on HyperShift)"
      default: "false"
    - name: MAX_RETRIES
      description: "Max number of times gauge reruns a failed scenario before marking it failed (1 = no retry)"
      default: "1"
    - name: REFRESH_CLI_FROM_CLUSTER
      description: "When 'true', download opc/tkn/tkn-pac from the cluster under test (tkn-cli-serve) and prepend them to PATH, so functional opc/tkn match the currently-installed operator (e.g. after an upgrade) instead of the version baked into the test image."
      default: "false"
    - name: EXPECTED_CLI_VERSION
      description: "Optional OSP version or channel (e.g. '1.24' or 'pipelines-1.24') the refreshed CLI should match. Used only when REFRESH_CLI_FROM_CLUSTER=true to wait out the operator's tkn-cli-serve re-roll after an upgrade. Empty = accept whatever the cluster currently serves."
      default: ""
    - name: STATE_CONFIGMAP
      description: "Optional name of a ConfigMap on the cluster under test used to persist testdata/olm/skiprange.json across the pre-upgrade and post-upgrade TaskRuns (which each clone the repo into their own emptyDir). Empty = disabled (e.g. acceptance runs)."
      default: ""

  volumes:
    - name: credentials
      secret:
        secretName: $(params.CLUSTER_SECRET_REF)
    - name: source
      emptyDir: { }
    - name: go-cache
      emptyDir: { }
  stepTemplate:
    image: $(params.IMAGE)
    volumeMounts:
      - name: source
        mountPath: /source
      - name: credentials
        mountPath: /credentials
      - name: go-cache
        mountPath: /go-cache
    env:
      - name: GOMODCACHE
        value: /go-cache/mod
      - name: GOCACHE
        value: /go-cache/build
  steps:
    - name: create-repo
      image: $(params.IMAGE)
      script: |
        mkdir -p /source/repo
        chmod 777 /source/repo
    - name: fetch-repo
      ref:
        resolver: http
        params:
          - name: url
            value: https://raw.githubusercontent.com/openshift-pipelines/tektoncd-catalog/p/stepactions/stepaction-git-clone/0.4.1/stepaction-git-clone.yaml
      params:
        - name: OUTPUT_PATH
          value: /source/repo
        - name: URL
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: REVISION
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
    # Upgrade-only: refresh the functional CLI from the upgraded cluster.
    # No-op for acceptance runs (REFRESH_CLI_FROM_CLUSTER left empty).
    - name: refresh-cli
      image: $(params.IMAGE)
      env:
        - name: REFRESH_CLI_FROM_CLUSTER
          value: "$(params.REFRESH_CLI_FROM_CLUSTER)"
        - name: EXPECTED_CLI_VERSION
          value: "$(params.EXPECTED_CLI_VERSION)"
      script: |
        #!/usr/bin/env bash
        # Refresh opc/tkn/tkn-pac from the cluster under test into the shared
        # /source/cli dir so the next step's gauge suites (which call the CLI from
        # PATH) match the currently-installed operator. After an operator upgrade
        # the test image's baked-in CLI lags the upgraded server. No-op unless
        # REFRESH_CLI_FROM_CLUSTER=true (acceptance runs leave it empty).
        if [[ "$REFRESH_CLI_FROM_CLUSTER" != "true" ]]; then
          echo "REFRESH_CLI_FROM_CLUSTER!=true; skipping CLI refresh."
          exit 0
        fi
        cp /credentials/kubeconfig /tmp/kubeconfig
        refresh_cli_from_cluster() {
          local want cli_arch url host served deadline mant="/source/cli"
          # Accept "pipelines-1.24" or "1.24.0"; reduce to the X.Y minor to match on.
          want="${EXPECTED_CLI_VERSION#pipelines-}"
          want="$(echo "$want" | cut -d. -f1-2)"
          case "$(uname -m)" in
            x86_64) cli_arch=amd64 ;;
            aarch64|arm64) cli_arch=arm64 ;;
            *) cli_arch=amd64 ;;
          esac
          mkdir -p "$mant"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            # Wait for the operator's re-roll of tkn-cli-serve to complete.
            KUBECONFIG=/tmp/kubeconfig oc rollout status deployment/tkn-cli-serve \
              -n openshift-pipelines --timeout=120s 2>/dev/null || true
            url=$(KUBECONFIG=/tmp/kubeconfig oc get consoleclidownloads.console.openshift.io tkn \
              -o jsonpath='{.spec.links[*].href}' 2>/dev/null | tr ' ' '\n' \
              | grep -m1 "tkn-linux-${cli_arch}\.tar\.gz") || true
            if [[ -z "$url" ]]; then
              host=$(KUBECONFIG=/tmp/kubeconfig oc get route tkn-cli-serve \
                -n openshift-pipelines -o jsonpath='{.spec.host}' 2>/dev/null) || true
              [[ -n "$host" ]] && url="https://${host}/tkn/tkn-linux-${cli_arch}.tar.gz"
            fi
            if [[ -n "$url" ]] && curl -kfsSL "$url" -o /tmp/cli.tar.gz 2>/dev/null; then
              tar -xf /tmp/cli.tar.gz -C "$mant" 2>/dev/null || true
              chmod +x "$mant"/opc "$mant"/tkn "$mant"/tkn-pac 2>/dev/null || true
              served=$("$mant/opc" version 2>/dev/null | sed -n 's/.*[Cc]lient version:[[:space:]]*//p' | head -1)
              if [[ -z "$want" || "$want" == "latest" ]] || "$mant/opc" version 2>/dev/null | grep -q "${want}\."; then
                echo "CLI refreshed from cluster: opc ${served:-unknown} (want ${want:-any})"
                return 0
              fi
              echo "  tkn-cli-serve still serving opc ${served:-unknown} (want ${want}.x); retrying..."
            else
              echo "  tkn-cli-serve not ready yet; retrying..."
            fi
            sleep 10
          done
          echo "WARN: could not refresh CLI to '${want:-target}' within timeout; using image CLI ($(opc version 2>/dev/null | head -1))"
          return 1
        }
        refresh_cli_from_cluster
        refresh_rc=$?
        # Whether a concrete target version was requested (empty/'latest' = best-effort).
        want_minor="${EXPECTED_CLI_VERSION#pipelines-}"
        want_minor="$(echo "$want_minor" | cut -d. -f1-2)"
        if [[ "$refresh_rc" -ne 0 && -n "$want_minor" && "$want_minor" != "latest" ]]; then
          echo "FATAL: REFRESH_CLI_FROM_CLUSTER=true and EXPECTED_CLI_VERSION='$EXPECTED_CLI_VERSION' was requested, but the matching CLI could not be fetched from the cluster. Failing so upgrade suites do not run with a stale CLI and report misleading results."
          exit 1
        fi

    # Upgrade-only: seed the pre-upgrade skipRange snapshot from the state
    # ConfigMap. No-op for acceptance runs (STATE_CONFIGMAP left empty).
    - name: seed-skiprange
      image: $(params.IMAGE)
      workingDir: /source/repo
      env:
        - name: STATE_CONFIGMAP
          value: "$(params.STATE_CONFIGMAP)"
      script: |
        #!/usr/bin/env bash
        # Seed testdata/olm/skiprange.json from a ConfigMap on the (persistent)
        # cluster under test written by the previous upgrade TaskRun, so the
        # post-upgrade skipRange diff can see the pre-upgrade snapshot (each
        # TaskRun clones into its own emptyDir). Uses the admin kubeconfig. No-op
        # unless STATE_CONFIGMAP is set (acceptance runs leave it empty).
        if [[ -z "$STATE_CONFIGMAP" ]]; then
          echo "STATE_CONFIGMAP unset; skipping skiprange seed."
          exit 0
        fi
        cp /credentials/kubeconfig /tmp/kubeconfig
        SKIPRANGE_FILE="testdata/olm/skiprange.json"
        STATE_NS="default"
        if KUBECONFIG=/tmp/kubeconfig oc get configmap "$STATE_CONFIGMAP" -n "$STATE_NS" >/dev/null 2>&1; then
          if KUBECONFIG=/tmp/kubeconfig oc get configmap "$STATE_CONFIGMAP" -n "$STATE_NS" -o jsonpath='{.data.skiprange\.json}' > "$SKIPRANGE_FILE" 2>/dev/null; then
            echo "Seeded $SKIPRANGE_FILE from configmap $STATE_NS/$STATE_CONFIGMAP"
          fi
        fi

    - name: run-e2e-tests-pipeline
      image: $(params.IMAGE)
      workingDir: /source/repo
      env:
        - name: CHAINS_DOCKER_CONFIG_JSON
          valueFrom:
            secretKeyRef:
              key: config.json
              name: quay-io-dockerconfig
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: github-token
              name: github
              optional: true
        - name: PAC_GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: github-token
              name: github
              optional: true
        - name: PAC_GITHUB_ORG
          value: "pipelinesascodetests"
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-token
              optional: true
        - name: GITLAB_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-webhook-token
              optional: true
        - name: GITLAB_GROUP_NAMESPACE
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-group-ns
              optional: true
        - name: GITLAB_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-project-id
              optional: true
        - name: KUBECONFIG
          value: "/tmp/kubeconfig"
        - name: CATALOG_SOURCE
          value: "$(params.CATALOG_SOURCE)"
        - name: CHANNEL
          value: "$(params.CHANNEL)"
        - name: CHAINS_REPOSITORY
          value: "$(params.CHAINS_REPOSITORY)"
        - name: OCP_VERSION
          value: "$(params.OCP_VERSION)"
        - name: MAG_USE_IMPERSONATION
          value: "$(params.MAG_USE_IMPERSONATION)"
        - name: STATE_CONFIGMAP
          value: "$(params.STATE_CONFIGMAP)"
      script: |
        #!/usr/bin/env bash
        cp /credentials/kubeconfig /tmp/kubeconfig

        # Use the CLI refreshed from the cluster by the refresh-cli step, if any
        # (upgrade runs only); otherwise fall back to the image's baked-in CLI.
        if [[ -x /source/cli/opc ]]; then
          export PATH="/source/cli:$PATH"; hash -r
          echo "Using opc: $(command -v opc) -> $(opc version 2>/dev/null | head -1 || echo unknown)"
          echo "Using tkn: $(command -v tkn) -> $(tkn version 2>/dev/null | head -1 || echo unknown)"
        fi

        # For non-admin tests, impersonate consoledeveloper via kubeconfig.
        # HyperShift blocks HTPasswd IDP so password-based oc login is not possible.
        # consoledeveloper has self-provisioner (create projects) so it gets admin
        # on its own projects, which is sufficient for pipeline/trigger/results tests.
        if [[ "$(params.RUN_AS)" == "non-admin" ]]; then
          cp /tmp/kubeconfig /tmp/kubeconfig-nonadmin
          python3 -c "import yaml; kc=yaml.safe_load(open('/tmp/kubeconfig-nonadmin')); [u['user'].update({'as':'consoledeveloper','as-groups':['system:authenticated']}) for u in kc.get('users',[])]; yaml.dump(kc,open('/tmp/kubeconfig-nonadmin','w'))"
          export KUBECONFIG=/tmp/kubeconfig-nonadmin
          echo "Non-admin mode: impersonating 'consoledeveloper' via kubeconfig"
        fi

        go mod download
        go build -p 1 ./...
        gauge config check_updates false

        # Persist skiprange state across the pre-upgrade and post-upgrade TaskRuns.
        # Seeding happens earlier in the seed-skiprange step; this run just produces
        # the (possibly updated) testdata/olm/skiprange.json via the gauge suite.

        # Some of the tests fail on specific OCP versions
        set +H
        tags="$(params.TAGS),!(skip-$OCP_VERSION | to-do)"
        set -H

        echo "Running $(params.SPECS) with tags $tags"
        gauge run --tags="$tags" --max-retries-count=$(params.MAX_RETRIES) --log-level=debug --verbose $(params.SPECS)
        gauge_rc=$?

        # Persist the (possibly updated) skiprange state back to the ConfigMap (the
        # seed-skiprange step read it before the suite) so the next upgrade TaskRun
        # can validate the before/after diff. Runs regardless of the gauge result;
        # the gauge exit code is preserved below.
        SKIPRANGE_FILE="testdata/olm/skiprange.json"
        STATE_NS="default"
        if [[ -n "$STATE_CONFIGMAP" && -f "$SKIPRANGE_FILE" ]]; then
          KUBECONFIG=/tmp/kubeconfig oc create configmap "$STATE_CONFIGMAP" -n "$STATE_NS" \
            --from-file=skiprange.json="$SKIPRANGE_FILE" --dry-run=client -o yaml \
            | KUBECONFIG=/tmp/kubeconfig oc apply -f - >/dev/null \
            && echo "Persisted $SKIPRANGE_FILE to configmap $STATE_NS/$STATE_CONFIGMAP"
        fi

        exit $gauge_rc
