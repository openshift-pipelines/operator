apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/app: pipelines-multikueue-plugin
  name: pipelines-multikueue-plugin-controller
  namespace: tekton-kueue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipelines-multikueue-plugin-controller-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - secrets
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - authentication.open-cluster-management.io
  resources:
  - managedserviceaccounts
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - managedclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kueue.openshift.io
  resources:
  - kueues
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - admissionchecks
  - clusterqueues
  - localqueues
  - multikueueclusters
  - multikueueconfigs
  - resourceflavors
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operators.coreos.com
  resources:
  - operatorgroups
  - subscriptions
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - work.open-cluster-management.io
  resources:
  - manifestworks
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipelines-multikueue-plugin-kueue-role
rules:
- apiGroups:
  - tekton.dev
  resources:
  - pipelineruns
  verbs:
  - watch
  - get
- apiGroups:
  - tekton.dev
  resources:
  - pipelineruns/status
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: tekton-kueue
  name: pipelines-multikueue-plugin-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipelines-multikueue-plugin-controller-role
subjects:
- kind: ServiceAccount
  name: pipelines-multikueue-plugin-controller
  namespace: tekton-kueue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipelines-multikueue-plugin-kueue-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipelines-multikueue-plugin-kueue-role
subjects:
- kind: ServiceAccount
  name: kueue-controller-manager
  namespace: openshift-kueue-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/app: pipelines-multikueue-controller
    control-plane: pipelines-multikueue-controller
  name: pipelines-multikueue-plugin-controller
  namespace: tekton-kueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tekton-kueue
      control-plane: pipelines-multikueue-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
      labels:
        app.kubernetes.io/name: tekton-kueue
        control-plane: pipelines-multikueue-controller
    spec:
      containers:
      - args:
        - controller
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        command:
        - /controller
        image: ghcr.io/openshift-pipelines/pipelines-multikueue-controller:v0.1.0
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: controller
        ports:
        - containerPort: 8443
          name: metrics-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: pipelines-multikueue-plugin-controller
      terminationGracePeriodSeconds: 10
      volumes: []
