---
apiVersion: shipwright.io/v1beta1
kind: ClusterBuildStrategy
metadata:
  name: source-to-image
spec:
  parameters:
  - defaults: []
    description: Environment variables to set during the build and in the output image.
      Values must be in the format KEY=VALUE.
    name: build-env
    type: array
  - defaults: []
    description: The registries that need to block pull access.
    name: registries-block
    type: array
  - defaults: []
    description: The fully-qualified name of insecure registries. An insecure registry
      is one that does not have a valid SSL certificate or only supports HTTP.
    name: registries-insecure
    type: array
  - defaults:
    - registry.redhat.io
    - quay.io
    description: The registries for searching short name images such as `golang:latest`.
    name: registries-search
    type: array
  - description: The builder image.
    name: builder-image
    type: string
  - default: ""
    description: URL of custom S2I scripts, overriding the builder image's default
      scripts. Empty means use the builder image defaults. Maps to BuildConfig spec.strategy.sourceStrategy.scripts.
    name: scripts-url
    type: string
  - default: if-not-present
    description: 'Pull policy for the builder image. Valid values: always, never,
      if-not-present.'
    name: pull-policy
    type: string
  - default: "false"
    description: Perform an incremental build by reusing artifacts from a previously
      built image. Set to 'true' to enable. Maps to BuildConfig spec.strategy.sourceStrategy.incremental.
    name: incremental
    type: string
  - default: vfs
    description: The storage driver to use, such as 'overlay' or 'vfs'.
    name: storage-driver
    type: string
  securityContext:
    runAsGroup: 0
    runAsUser: 0
  steps:
  - args:
    - -c
    - |
      set -euo pipefail

      envArgs=()
      inEnvArgs=false
      scriptsUrl=
      while [[ $# -gt 0 ]]; do
        arg="$1"
        shift
        if [ "${arg}" == "--env" ]; then
          inEnvArgs=true
        elif [ "${arg}" == "--scripts-url" ]; then
          inEnvArgs=false
          scriptsUrl="$1"
          shift
        elif [ "${inEnvArgs}" == "true" ]; then
          envArgs+=("-e" "${arg}")
        fi
      done

      s2iArgs=()
      if [ -n "${scriptsUrl}" ]; then
        s2iArgs+=("--scripts-url=${scriptsUrl}")
      fi

      /usr/local/bin/s2i build \
        "${envArgs[@]}" \
        "${s2iArgs[@]}" \
        --pull-policy=$(params.pull-policy) \
        --incremental=$(params.incremental) \
        $(params.shp-source-context) \
        $(params.builder-image) \
        $(params.shp-output-image) \
        --as-dockerfile=/s2i/Dockerfile
    - --
    - --env
    - $(params.build-env[*])
    - --scripts-url
    - $(params.scripts-url)
    command:
    - /bin/bash
    image: registry.redhat.io/source-to-image/source-to-image-rhel9@sha256:798e0e860df8e3ca1ff5f8aa796940d6dbd4b739ccfc35c6f4c9bc046d5f0c12
    name: s2i-generate
    volumeMounts:
    - mountPath: /s2i
      name: s2i
    - mountPath: /etc/pki/entitlement
      name: etc-pki-entitlement
    workingDir: $(params.shp-source-root)
  - args:
    - -c
    - |
      set -euo pipefail

      # Import additional trusted CA certificates supplied through the
      # trusted-ca volume (e.g. a ConfigMap holding a PEM bundle) into the
      # system trust store, so that image pulls and pushes trust endpoints
      # signed by a custom/private CA. No-op when the volume is empty.
      trustedCADir=/var/shipwright/trusted-ca
      if [ -d "${trustedCADir}" ]; then
        certs=$(find -L "${trustedCADir}" -maxdepth 1 -type f \( -name '*.crt' -o -name '*.pem' \) 2>/dev/null || true)
        if [ -n "${certs}" ]; then
          echo "[INFO] Importing trusted CA certificates from ${trustedCADir}"
          while IFS= read -r cert; do
            cp -L "${cert}" /etc/pki/ca-trust/source/anchors/
          done <<< "${certs}"
          update-ca-trust extract
        fi
      fi

      # Parse parameters
      image=
      target=
      registriesBlock=""
      inRegistriesBlock=false
      registriesInsecure=""
      inRegistriesInsecure=false
      registriesSearch=""
      inRegistriesSearch=false
      while [[ $# -gt 0 ]]; do
        arg="$1"
        shift

        if [ "${arg}" == "--image" ]; then
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          image="$1"
          shift
        elif [ "${arg}" == "--target" ]; then
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          target="$1"
          shift
        elif [ "${arg}" == "--registries-block" ]; then
          inRegistriesBlock=true
          inRegistriesInsecure=false
          inRegistriesSearch=false
        elif [ "${arg}" == "--registries-insecure" ]; then
          inRegistriesInsecure=true
          inRegistriesBlock=false
          inRegistriesSearch=false
        elif [ "${arg}" == "--registries-search" ]; then
          inRegistriesSearch=true
          inRegistriesBlock=false
          inRegistriesInsecure=false
        elif [ "${inRegistriesBlock}" == "true" ]; then
          registriesBlock="${registriesBlock}'${arg}', "
        elif [ "${inRegistriesInsecure}" == "true" ]; then
          registriesInsecure="${registriesInsecure}'${arg}', "
        elif [ "${inRegistriesSearch}" == "true" ]; then
          registriesSearch="${registriesSearch}'${arg}', "
        else
          echo "Invalid usage"
          exit 1
        fi
      done

      echo "[INFO] Creating registries config file..."
      if [ "${registriesSearch}" != "" ]; then
        cat <<EOF >>/tmp/registries.conf
      [registries.search]
      registries = [${registriesSearch::-2}]

      EOF
      fi
      if [ "${registriesInsecure}" != "" ]; then
        cat <<EOF >>/tmp/registries.conf
      [registries.insecure]
      registries = [${registriesInsecure::-2}]

      EOF
      fi
      if [ "${registriesBlock}" != "" ]; then
        cat <<EOF >>/tmp/registries.conf
      [registries.block]
      registries = [${registriesBlock::-2}]

      EOF
      fi

      # Building the image
      echo "[INFO] Building image ${image}"
      buildah --storage-driver=$(params.storage-driver) bud \
        --registries-conf=/tmp/registries.conf \
        --tag="${image}"

      # Push the image
      echo "[INFO] Pushing image ${image}"
      buildah --storage-driver=$(params.storage-driver) push \
        --digestfile='$(results.shp-image-digest.path)' \
        "${image}" \
        "docker://${image}"
    - --
    - --image
    - $(params.shp-output-image)
    - --registries-block
    - $(params.registries-block[*])
    - --registries-insecure
    - $(params.registries-insecure[*])
    - --registries-search
    - $(params.registries-search[*])
    command:
    - /bin/bash
    image: registry.redhat.io/ubi10/buildah@sha256:48c76ef9635739ad0c33645c2885ab6aa3036dca5883f475b820ac456d6817b6
    name: buildah
    securityContext:
      capabilities:
        add:
        - SETFCAP
    volumeMounts:
    - mountPath: /s2i
      name: s2i
    - mountPath: /etc/pki/entitlement
      name: etc-pki-entitlement
    - mountPath: /var/shipwright/trusted-ca
      name: trusted-ca
      readOnly: true
    workingDir: /s2i
  volumes:
  - emptyDir: {}
    name: s2i
  - emptyDir: {}
    name: etc-pki-entitlement
    overridable: true
  - emptyDir: {}
    name: trusted-ca
    overridable: true
