apiVersion: shipwright.io/v1beta1
kind: ClusterBuildStrategy
metadata:
  name: buildah
spec:
  parameters:
  - defaults: []
    description: The values for the args in the Dockerfile. Values must be in the
      format KEY=VALUE.
    name: build-args
    type: array
  - defaults: []
    description: Environment variables to set in every stage of the build, visible
      to RUN instructions and kept in the output image. Values must be in the format
      KEY=VALUE, or a bare NAME whose value is taken from the Build's spec.env.
    name: build-env
    type: array
  - defaults: []
    description: The registries that need to block pull access.
    name: registries-block
    type: array
  - defaults: []
    description: The fully-qualified name of insecure registries. An insecure registry
      is one that does not have a valid SSL certificate or only supports HTTP.
    name: registries-insecure
    type: array
  - defaults:
    - registry.redhat.io
    - quay.io
    description: The registries for searching short name images such as `golang:latest`.
    name: registries-search
    type: array
  - default: ""
    description: Image name used to replace the value in the last FROM instruction
      in the Dockerfile.
    name: runtime-stage-from
    type: string
  - default: Dockerfile
    description: The path to the Dockerfile to be used for building the image.
    name: dockerfile
    type: string
  - default: vfs
    description: The storage driver to use, such as 'overlay' or 'vfs'
    name: storage-driver
    type: string
  - default: ""
    description: Sets the target stage to be built.
    name: target
    type: string
  - default: "false"
    description: Do not use existing cached images for the container build. Build
      from the start with a new set of cached layers.
    name: no-cache
    type: string
  - default: missing
    description: 'Pull image policy. The value of --pull passed to buildah bud. Valid
      values: always, missing, never, newer.'
    name: pull
    type: string
  - default: "false"
    description: Squash all new layers into a single new layer. The value of --squash
      passed to buildah bud.
    name: squash
    type: string
  securityContext:
    runAsGroup: 0
    runAsUser: 0
  steps:
  - args:
    - -c
    - |
      set -euo pipefail

      # Import additional trusted CA certificates supplied through the
      # trusted-ca volume (e.g. a ConfigMap holding a PEM bundle) into the
      # system trust store, so that image pulls and pushes trust endpoints
      # signed by a custom/private CA. No-op when the volume is empty.
      trustedCADir=/var/shipwright/trusted-ca
      if [ -d "${trustedCADir}" ]; then
        certs=$(find -L "${trustedCADir}" -maxdepth 1 -type f \( -name '*.crt' -o -name '*.pem' \) 2>/dev/null || true)
        if [ -n "${certs}" ]; then
          echo "[INFO] Importing trusted CA certificates from ${trustedCADir}"
          while IFS= read -r cert; do
            cp -L "${cert}" /etc/pki/ca-trust/source/anchors/
          done <<< "${certs}"
          update-ca-trust extract
        fi
      fi

      # Parse parameters
      context=
      dockerfile=
      image=
      runtimeStageFrom=
      pull="missing"
      budArgs=()
      inBuildArgs=false
      inBuildEnv=false
      noCache="false"
      squash="false"
      registriesBlock=""
      inRegistriesBlock=false
      registriesInsecure=""
      inRegistriesInsecure=false
      registriesSearch=""
      inRegistriesSearch=false
      tlsVerify=true
      while [[ $# -gt 0 ]]; do
        arg="$1"
        shift

        if [ "${arg}" == "--context" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          context="$1"
          shift
        elif [ "${arg}" == "--dockerfile" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          dockerfile="$1"
          shift
        elif [ "${arg}" == "--image" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          image="$1"
          shift
        elif [ "${arg}" == "--no-cache" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          noCache="$1"
          shift
        elif [ "${arg}" == "--pull" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          pull="$1"
          shift
        elif [ "${arg}" == "--squash" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          squash="$1"
          shift
        elif [ "${arg}" == "--runtime-stage-from" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          runtimeStageFrom="$1"
          shift
        elif [ "${arg}" == "--target" ]; then
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
          if [ "$1" != "" ]; then
            budArgs+=(--target "$1")
          fi
          shift
        elif [ "${arg}" == "--build-args" ]; then
          inBuildArgs=true
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
        elif [ "${arg}" == "--build-env" ]; then
          inBuildEnv=true
          inBuildArgs=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
        elif [ "${arg}" == "--registries-block" ]; then
          inRegistriesBlock=true
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesInsecure=false
          inRegistriesSearch=false
        elif [ "${arg}" == "--registries-insecure" ]; then
          inRegistriesInsecure=true
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesSearch=false
        elif [ "${arg}" == "--registries-search" ]; then
          inRegistriesSearch=true
          inBuildArgs=false
          inBuildEnv=false
          inRegistriesBlock=false
          inRegistriesInsecure=false
        elif [ "${inBuildArgs}" == "true" ]; then
          budArgs+=("--build-arg" "${arg}")
        elif [ "${inBuildEnv}" == "true" ]; then
          # buildah copies every matching variable of this step's environment for
          # an entry that has no '=' and ends in '*', so refuse those rather than
          # push the whole environment into the image.
          if [[ "${arg}" != *=* && "${arg}" == *'*' ]]; then
            echo "build-env entry '${arg}' is a wildcard; list each variable by name or as KEY=VALUE."
            echo -n "InvalidBuildEnv" > '$(results.shp-error-reason.path)'
            echo -n "build-env entry '${arg}' is a wildcard; list each variable by name or as KEY=VALUE." > '$(results.shp-error-message.path)'
            exit 1
          fi
          # buildah drops a bare name it cannot find, and the build would go on
          # without the variable, so a name missing from spec.env is an error.
          if [[ "${arg}" != *=* ]] && ! printenv "${arg}" >/dev/null; then
            echo "build-env entry '${arg}' is not set in the Build's spec.env; set it there or pass it as KEY=VALUE."
            echo -n "InvalidBuildEnv" > '$(results.shp-error-reason.path)'
            echo -n "build-env entry '${arg}' is not set in the Build's spec.env; set it there or pass it as KEY=VALUE." > '$(results.shp-error-message.path)'
            exit 1
          fi
          budArgs+=("--env" "${arg}")
        elif [ "${inRegistriesBlock}" == "true" ]; then
          registriesBlock="${registriesBlock}'${arg}', "
        elif [ "${inRegistriesInsecure}" == "true" ]; then
          registriesInsecure="${registriesInsecure}'${arg}', "

          # This assumes that the image is passed before the insecure registries which is fair in this context
          if [[ ${image} == ${arg}/* ]]; then
            tlsVerify=false
          fi
        elif [ "${inRegistriesSearch}" == "true" ]; then
          registriesSearch="${registriesSearch}'${arg}', "
        else
          echo "Invalid usage"
          exit 1
        fi
      done

      # Verify the existence of the context directory
      if [ ! -d "${context}" ]; then
        echo -e "The context directory '${context}' does not exist."
        echo -n "ContextDirNotFound" > '$(results.shp-error-reason.path)'
        echo -n "The context directory '${context}' does not exist." > '$(results.shp-error-message.path)'
        exit 1
      fi
      cd "${context}"

      # Verify the existence of the Dockerfile
      if [ ! -f "${dockerfile}" ]; then
        echo -e "The Dockerfile '${dockerfile}' does not exist."
        echo -n "DockerfileNotFound" > '$(results.shp-error-reason.path)'
        echo -n "The Dockerfile '${dockerfile}' does not exist." > '$(results.shp-error-message.path)'
        exit 1
      fi

      echo "[INFO] Creating registries config file..."
      if [ "${registriesSearch}" != "" ]; then
        cat <<EOF >>/tmp/registries.conf
      [registries.search]
      registries = [${registriesSearch::-2}]

      EOF
      fi
      if [ "${registriesInsecure}" != "" ]; then
        cat <<EOF >>/tmp/registries.conf
      [registries.insecure]
      registries = [${registriesInsecure::-2}]

      EOF
      fi
      if [ "${registriesBlock}" != "" ]; then
        cat <<EOF >>/tmp/registries.conf
      [registries.block]
      registries = [${registriesBlock::-2}]

      EOF
      fi

      if [ "${noCache}" == "true" ]; then
        budArgs+=("--no-cache")
      fi

      if [ "${pull}" != "missing" ]; then
        budArgs+=("--pull=${pull}")
      fi

      if [ "${squash}" == "true" ]; then
        budArgs+=("--squash")
      fi

      if [ -n "${runtimeStageFrom}" ]; then
        lastFromImage=$(tac "${dockerfile}" | grep -m1 -i -E '^[ ]*FROM' | \
          sed -n '0,/p/s/^[ ]*from[ ]\+\([^ ]*\)[ ]*\(as.*$\)\{0,1\}$/\1/Ip')
        if [ -n "${lastFromImage}" ]; then
          budArgs+=("--build-context" "${lastFromImage}=docker-image://${runtimeStageFrom}")
        fi
      fi

      # Building the image
      echo "[INFO] Building image ${image}"
      buildah --storage-driver=$(params.storage-driver) \
        bud "${budArgs[@]}" \
        --registries-conf=/tmp/registries.conf \
        --tag="${image}" \
        --file="${dockerfile}" \
        .

      # Push the image
      echo "[INFO] Pushing image ${image}"
      buildah --storage-driver=$(params.storage-driver) push \
        --digestfile='$(results.shp-image-digest.path)' \
        --tls-verify="${tlsVerify}" \
        "${image}" \
        "docker://${image}"
    - --
    - --context
    - $(params.shp-source-context)
    - --dockerfile
    - $(params.dockerfile)
    - --image
    - $(params.shp-output-image)
    - --build-args
    - $(params.build-args[*])
    - --build-env
    - $(params.build-env[*])
    - --registries-block
    - $(params.registries-block[*])
    - --registries-insecure
    - $(params.registries-insecure[*])
    - --registries-search
    - $(params.registries-search[*])
    - --target
    - $(params.target)
    - --no-cache
    - $(params.no-cache)
    - --pull
    - $(params.pull)
    - --squash
    - $(params.squash)
    - --runtime-stage-from
    - $(params.runtime-stage-from)
    command:
    - /bin/bash
    image: registry.redhat.io/ubi10/buildah@sha256:48c76ef9635739ad0c33645c2885ab6aa3036dca5883f475b820ac456d6817b6
    imagePullPolicy: Always
    name: build-and-push
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 65Mi
    securityContext:
      capabilities:
        add:
        - SETFCAP
    volumeMounts:
    - mountPath: /etc/pki/entitlement
      name: etc-pki-entitlement
    - mountPath: /var/shipwright/trusted-ca
      name: trusted-ca
      readOnly: true
    workingDir: $(params.shp-source-root)
  volumes:
  - emptyDir: {}
    name: etc-pki-entitlement
    overridable: true
  - emptyDir: {}
    name: trusted-ca
    overridable: true
---
apiVersion: shipwright.io/v1beta1
kind: ClusterBuildStrategy
metadata:
  name: buildpacks
spec:
  parameters:
  - default: "0.14"
    description: Platform API Version supported
    name: cnb-platform-api
  - default: ""
    description: Builder image containing the buildpacks. This is also the image the
      extender will use if kind=build.
    name: cnb-builder-image
  - default: buildpacksio/lifecycle:0.21.5
    description: The image to use when executing Lifecycle phases.
    name: cnb-lifecycle-image
  - default: debug
    description: Logging level
    name: cnb-log-level
  - default: ""
    description: Reference to a run image to use.
    name: run-image
  - default: ""
    description: The name of the persistent app cache image (if no cache workspace
      is provided).
    name: cache-image
  - default: ""
    description: The default process type to set on the image.
    name: process-type
  - default: ""
    description: A subpath within the `source` input where the source to build is
      located.
    name: source-subpath
  - defaults: []
    description: Environment variables to set during _build-time_.
    name: env-vars
    type: array
  - default: empty-dir
    description: The name of the platform directory.
    name: platform-dir
  - default: "1001"
    description: The user ID of the builder image user.
    name: user-id
  - default: "1000"
    description: The group ID of the builder image user.
    name: group-id
  - default: /tekton/home
    description: Absolute path to the user's home directory.
    name: user-home
  - default: ws-pvc
    description: Name of the Persistent Volume Claim for cache
    name: cache-pvc-name
  - default: build
    description: The kind of image to extend ('build' or 'run'). Passed to the extender.
    name: cnb-extender-kind
  - default: /layers/extended
    description: Directory of extended layers, passed as -extended flag to the exporter.
      Assumes extender outputs here.
    name: cnb-extended-dir-exporter
  steps:
  - args:
    - -c
    - |
      set -e

      # TODO: To be reviewed as shipwright don't support like Tekton workspaces
      if [[ "$(workspaces.cache.bound)" == "true" ]]; then
       echo "> Setting permissions on '$(workspaces.cache.path)'..."
       chown -R "$(params.user-id):$(params.group-id)" "$(workspaces.cache.path)"
      fi

      # Ensure standard CNB directories have correct ownership
      # Also ensure /kaniko directory has correct ownership if it's pre-created by volume mount
      for path in "/tekton/home" "/layers" "$(workspaces.source.path)" "/cache" "/platform" "/kaniko"; do
        if [ -d "$path" ]; then # Check if directory exists before chown
          echo "> Setting permissions on '$path'..."
          chown -R "$(params.user-id):$(params.group-id)" "$path"
        else
          echo "> Directory '$path' not found, skipping permissions."
        fi
      done

      echo "> Parsing additional configuration..."
      parsing_flag=""
      envs=()
      for arg in "$@"; do
          if [[ "$arg" == "--env-vars" ]]; then
              echo "-> Parsing env variables..."
              parsing_flag="env-vars"
          elif [[ "$parsing_flag" == "env-vars" ]]; then
              envs+=("$arg")
          fi
      done

      echo "> Processing any environment variables..."
      ENV_DIR="/platform/env" # [1]

      echo "--> Creating 'env' directory: $ENV_DIR"
      mkdir -p "$ENV_DIR"

      for env in "${envs[@]}"; do
          IFS='=' read -r key value string <<< "$env"
          if [[ "$key" != "" && "$value" != "" ]]; then
              path="${ENV_DIR}/${key}"
              echo "--> Writing ${path}..."
              echo -n "$value" > "$path"
          fi
      done
    - --
    - --env-vars
    - $(params.env-vars[*])
    image: registry.access.redhat.com/ubi10@sha256:ccb838d655199bff6a77fc4296a2b2a44e00163dabd0ba8b0d9030f281ec935f
    name: prepare
    volumeMounts:
    - mountPath: /layers
      name: layers-dir
    - mountPath: /platform
      name: empty-dir
    - mountPath: /cache
      name: cache-dir
    - mountPath: /tekton/home
      name: empty-dir
    - mountPath: /kaniko
      name: kaniko-work-dir
  - args:
    - -log-level
    - $(params.cnb-log-level)
    - -layers
    - /layers
    - -run-image
    - $(params.run-image)
    - -cache-image
    - $(params.cache-image)
    - -uid
    - $(params.user-id)
    - -gid
    - $(params.group-id)
    - $(params.shp-output-image)
    command:
    - /cnb/lifecycle/analyzer
    env:
    - name: CNB_PLATFORM_API
      value: $(params.cnb-platform-api)
    image: $(params.cnb-lifecycle-image)
    name: analyze
    volumeMounts:
    - mountPath: /layers
      name: layers-dir
  - args:
    - -log-level
    - $(params.cnb-log-level)
    - -app
    - $(workspaces.source.path)/$(params.source-subpath)
    - -group
    - /layers/group.toml
    - -plan
    - /layers/plan.toml
    - -platform
    - /platform
    - -run
    - /platform/run.toml
    command:
    - /cnb/lifecycle/detector
    env:
    - name: CNB_PLATFORM_API
      value: $(params.cnb-platform-api)
    image: $(params.cnb-builder-image)
    name: detect
    volumeMounts:
    - mountPath: /layers
      name: layers-dir
    - mountPath: /platform
      name: empty-dir
    - mountPath: /tekton/home
      name: empty-dir
  - args:
    - -log-level
    - $(params.cnb-log-level)
    - -group
    - /layers/group.toml
    - -layers
    - /layers
    - -cache-dir
    - /cache
    - -cache-image
    - $(params.cache-image)
    - -uid
    - $(params.user-id)
    - -gid
    - $(params.group-id)
    - -build-image
    - $(params.cnb-builder-image)
    command:
    - /cnb/lifecycle/restorer
    env:
    - name: CNB_PLATFORM_API
      value: $(params.cnb-platform-api)
    image: $(params.cnb-lifecycle-image)
    name: restore
    volumeMounts:
    - mountPath: /layers
      name: layers-dir
    - mountPath: /cache
      name: cache-dir
    - mountPath: /kaniko
      name: kaniko-work-dir
  - args:
    - -log-level
    - $(params.cnb-log-level)
    - -app
    - $(workspaces.source.path)/$(params.source-subpath)
    - -layers
    - /layers
    - -group
    - /layers/group.toml
    - -plan
    - /layers/plan.toml
    - -platform
    - /platform
    command:
    - /cnb/lifecycle/builder
    env:
    - name: CNB_PLATFORM_API
      value: $(params.cnb-platform-api)
    image: $(params.cnb-builder-image)
    name: build-and-push
    securityContext:
      runAsGroup: 1000
    volumeMounts:
    - mountPath: /layers
      name: layers-dir
    - mountPath: /platform
      name: empty-dir
    - mountPath: /tekton/home
      name: empty-dir
    - mountPath: /cache
      name: cache-dir
  - args:
    - -log-level
    - $(params.cnb-log-level)
    - -app
    - $(workspaces.source.path)/$(params.source-subpath)
    - -layers
    - /layers
    - -group
    - /layers/group.toml
    - -cache-dir
    - /cache
    - -cache-image
    - $(params.cache-image)
    - -report
    - /layers/report.toml
    - -project-metadata
    - /platform/project-metadata.toml
    - -process-type
    - $(params.process-type)
    - -uid
    - $(params.user-id)
    - -gid
    - $(params.group-id)
    - -extended
    - $(params.cnb-extended-dir-exporter)
    - $(params.shp-output-image)
    command:
    - /cnb/lifecycle/exporter
    env:
    - name: CNB_PLATFORM_API
      value: $(params.cnb-platform-api)
    image: $(params.cnb-lifecycle-image)
    name: export
    volumeMounts:
    - mountPath: /layers
      name: layers-dir
    - mountPath: /cache
      name: cache-dir
    - mountPath: /platform
      name: empty-dir
  - args:
    - -c
    - |
      set -e
      cat /layers/report.toml | grep "digest" | cut -d'"' -f2 | cut -d'"' -f2 | tr -d '\n' > $(results.shp-image-digest.path)
    image: registry.access.redhat.com/ubi10@sha256:ccb838d655199bff6a77fc4296a2b2a44e00163dabd0ba8b0d9030f281ec935f
    name: results
    volumeMounts:
    - mountPath: /layers
      name: layers-dir
  volumes:
  - emptyDir: {}
    name: layers-dir
  - emptyDir: {}
    name: empty-dir
  - emptyDir: {}
    name: cache-dir
  - emptyDir: {}
    name: kaniko-work-dir
---
apiVersion: shipwright.io/v1beta1
kind: ClusterBuildStrategy
metadata:
  name: buildpacks-extender
spec:
  parameters:
