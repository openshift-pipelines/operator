apiVersion: v1
kind: ServiceAccount
metadata:
  name: shared-resource-csi-driver-node
  namespace: openshift-cluster-csi-drivers
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shared-resource-csi-driver-webhook
  namespace: openshift-cluster-csi-drivers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-resource-csi-driver-node-prometheus
  namespace: openshift-cluster-csi-drivers
rules:
- apiGroups:
  - ""
  resources:
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shared-resource-csi-driver-node
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sharedresource.openshift.io
  resources:
  - sharedconfigmaps
  - sharedsecrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shared-resource-csi-driver-node-privileged-role
rules:
- apiGroups:
  - security.openshift.io
  resourceNames:
  - privileged
  - null
  resources:
  - securitycontextconstraints
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-resource-csi-driver-node-prometheus
  namespace: openshift-cluster-csi-drivers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-resource-csi-driver-node-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: openshift-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shared-resource-csi-driver-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shared-resource-csi-driver-node
subjects:
- kind: ServiceAccount
  name: shared-resource-csi-driver-node
  namespace: openshift-cluster-csi-drivers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shared-resource-csi-driver-node-privileged-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shared-resource-csi-driver-node-privileged-role
subjects:
- kind: ServiceAccount
  name: shared-resource-csi-driver-node
  namespace: openshift-cluster-csi-drivers
---
apiVersion: v1
data:
  config.yaml: |
    ---
    ignoredNamespaces:
      - openshift-machine-api
      - openshift-kube-apiserver
      - openshift-kube-apiserver-operator
      - openshift-kube-scheduler
      - openshift-kube-controller-manager
      - openshift-kube-controller-manager-operator
      - openshift-kube-scheduler-operator
      - openshift-console-operator
      - openshift-controller-manager
      - openshift-controller-manager-operator
      - openshift-cloud-credential-operator
      - openshift-authentication-operator
      - openshift-service-ca
      - openshift-kube-storage-version-migrator-operator
      - openshift-config-operator
      - openshift-etcd-operator
      - openshift-apiserver-operator
      - openshift-cluster-csi-drivers
      - openshift-cluster-storage-operator
      - openshift-cluster-version
      - openshift-image-registry
      - openshift-machine-config-operator
      - openshift-sdn
      - openshift-service-ca-operator

    refreshResources: true

    shareRelistInterval: 10m
kind: ConfigMap
metadata:
  name: shared-resource-csi-driver-config
  namespace: openshift-cluster-csi-drivers
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
  name: shared-resource-csi-driver-trusted-ca-bundle
  namespace: openshift-cluster-csi-drivers
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: shared-resource-csi-driver-node-cert
  labels:
    app: shared-resource-csi-driver-node
  name: shared-resource-csi-driver-node
  namespace: openshift-cluster-csi-drivers
spec:
  ports:
  - name: metrics
    port: 443
    protocol: TCP
    targetPort: metrics
  selector:
    app: shared-resource-csi-driver-node
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: shared-resource-csi-driver-webhook-cert
  labels:
    name: shared-resource-csi-driver-webhook
  name: shared-resource-csi-driver-webhook
  namespace: openshift-cluster-csi-drivers
spec:
  ports:
  - name: webhook
    port: 443
    protocol: TCP
    targetPort: webhook
  selector:
    name: shared-resource-csi-driver-webhook
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: shared-resource-csi-driver-webhook
  name: shared-resource-csi-driver-webhook
  namespace: openshift-cluster-csi-drivers
spec:
  replicas: 1
  selector:
    matchLabels:
      name: shared-resource-csi-driver-webhook
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        name: shared-resource-csi-driver-webhook
    spec:
      containers:
      - args:
        - --tls=true
        - --tlscert=/etc/secrets/shared-resource-csi-driver-webhook-cert/tls.crt
        - --tlskey=/etc/secrets/shared-resource-csi-driver-webhook-cert/tls.key
        - --cacert=/etc/pki/tls/certs/ca-bundle.crt
        - --port=8443
        env:
        - name: RESERVED_SHARED_CONFIGMAP_NAMES
          value: ""
        - name: RESERVED_SHARED_SECRET_NAMES
          value: 'openshift-etc-pki-entitlement: openshift-config-managed:etc-pki-entitlement'
        image: registry.redhat.io/openshift-builds/openshift-builds-shared-resource-webhook-rhel10@sha256:d8918dca60597242bbc406d3b1f894969e71009d341211c77a7871e1f38861d9
        imagePullPolicy: IfNotPresent
        name: shared-resource-csi-driver-webhook
        ports:
        - containerPort: 8443
          name: webhook
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/pki/tls/certs/
          name: trusted-ca-bundle
        - mountPath: /etc/secrets/shared-resource-csi-driver-webhook-cert/
          name: shared-resource-csi-driver-webhook-cert
      priorityClassName: system-cluster-critical
      serviceAccountName: shared-resource-csi-driver-webhook
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      volumes:
      - name: shared-resource-csi-driver-webhook-cert
        secret:
          defaultMode: 420
          secretName: shared-resource-csi-driver-webhook-cert
      - configMap:
          items:
          - key: ca-bundle.crt
            path: ca-bundle.crt
          name: shared-resource-csi-driver-trusted-ca-bundle
        name: trusted-ca-bundle
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shared-resource-csi-driver
  namespace: openshift-cluster-csi-drivers
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      name: shared-resource-csi-driver-webhook
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: shared-resource-csi-driver-node
  name: shared-resource-csi-driver-node
  namespace: openshift-cluster-csi-drivers
spec:
  selector:
    matchLabels:
      app: shared-resource-csi-driver-node
  template:
    metadata:
      annotations:
        openshift.io/required-scc: privileged
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        app: shared-resource-csi-driver-node
    spec:
      containers:
      - args:
        - --v=5
        - --csi-address=/csi/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/sharedresource.csi.openshift.com/csi.sock
        env:
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: registry.redhat.io/openshift4/ose-csi-node-driver-registrar-rhel9@sha256:7b877b60c173014354378438dd163202b561ed130cef5ab13f3624eed1fea43a
        name: node-driver-registrar
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        securityContext:
          privileged: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /csi
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
        - mountPath: /run/csi-data-dir
          name: csi-data-dir
      - args:
        - --config=/var/run/configmaps/config/config.yaml
        - --drivername=csi.sharedresource.openshift.io
        - --v=4
        - --nodeid=$(KUBE_NODE_NAME)
        command:
        - /openshift-builds-shared-resource
        env:
        - name: RESERVED_SHARED_CONFIGMAP_NAMES
          value: ""
        - name: RESERVED_SHARED_SECRET_NAMES
          value: 'openshift-etc-pki-entitlement: openshift-config-managed:etc-pki-entitlement'
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: registry.redhat.io/openshift-builds/openshift-builds-shared-resource-rhel10@sha256:e17ea560b5d1a7d46b38e237c2daa7b61337b08a0ddc6eba0c6903e400489ca5
        imagePullPolicy: IfNotPresent
        name: shared-resource-csi-driver
        ports:
        - containerPort: 9898
          name: healthz
          protocol: TCP
        - containerPort: 6000
          name: metrics
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
        securityContext:
          privileged: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/run/configmaps/config
          name: config
        - mountPath: /csi
          name: socket-dir
        - mountPath: /var/lib/kubelet/pods
          mountPropagation: Bidirectional
          name: mountpoint-dir
        - mountPath: /var/lib/kubelet/plugins
          mountPropagation: Bidirectional
          name: plugins-dir
        - mountPath: /run/csi-data-dir
          mountPropagation: Bidirectional
          name: csi-data-dir
        - mountPath: /csi-volumes-map
          name: csi-volumes-map
        - mountPath: /dev
          name: dev-dir
        - mountPath: /etc/secrets
          name: shared-resource-csi-driver-node-cert
        workingDir: /run/csi-data-dir
      priorityClassName: system-node-critical
      serviceAccountName: shared-resource-csi-driver-node
      tolerations:
      - operator: Exists
      volumes:
      - configMap:
          name: shared-resource-csi-driver-config
          optional: true
        name: config
      - hostPath:
          path: /var/lib/kubelet/plugins/sharedresource.csi.openshift.com
          type: DirectoryOrCreate
        name: socket-dir
      - hostPath:
          path: /var/lib/kubelet/pods
          type: DirectoryOrCreate
        name: mountpoint-dir
      - hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
        name: registration-dir
      - hostPath:
          path: /var/lib/kubelet/plugins
          type: Directory
        name: plugins-dir
      - hostPath:
          path: /var/lib/csi-volumes-map/
          type: DirectoryOrCreate
        name: csi-volumes-map
      - hostPath:
          path: /run/csi-data-dir
          type: DirectoryOrCreate
        name: csi-data-dir
      - hostPath:
          path: /dev
          type: Directory
        name: dev-dir
      - name: shared-resource-csi-driver-node-cert
        secret:
          defaultMode: 420
          secretName: shared-resource-csi-driver-node-cert
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
    type: RollingUpdate
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shared-resource-csi-driver-node
  namespace: openshift-cluster-csi-drivers
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    interval: 30s
    path: /metrics
    port: metrics
    scheme: https
    tlsConfig:
      caFile: /etc/prometheus/configmaps/serving-certs-ca-bundle/service-ca.crt
      serverName: shared-resource-csi-driver-node.openshift-cluster-csi-drivers.svc
  jobLabel: component
  selector:
    matchLabels:
      app: shared-resource-csi-driver-node
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  annotations:
    csi.openshift.io/managed: "true"
  labels:
    security.openshift.io/csi-ephemeral-volume-profile: restricted
  name: csi.sharedresource.openshift.io
spec:
  attachRequired: false
  fsGroupPolicy: File
  podInfoOnMount: true
  volumeLifecycleModes:
  - Ephemeral
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    name: validation.webhook.csidriversharedresource
  name: validation.webhook.csidriversharedresource
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: shared-resource-csi-driver-webhook
      namespace: openshift-cluster-csi-drivers
      path: /resource-validation
      port: 443
  failurePolicy: Ignore
  matchPolicy: Equivalent
  name: pod.csi.sharedresource.openshift.io
  namespaceSelector:
    matchExpressions:
    - key: runlevel
      operator: NotIn
      values:
      - "0"
      - "1"
    - key: openshift.io/run-level
      operator: NotIn
      values:
      - "0"
      - "1"
    - key: csi.sharedresource.openshift.io/skip-validation
      operator: NotIn
      values:
      - "true"
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
    scope: '*'
  - apiGroups:
    - sharedresource.openshift.io
    apiVersions:
    - v1
    - v1beta1
    - v1alpha1
    operations:
    - CREATE
    resources:
    - sharedsecrets
    - sharedconfigmaps
    scope: '*'
  sideEffects: None
  timeoutSeconds: 10
