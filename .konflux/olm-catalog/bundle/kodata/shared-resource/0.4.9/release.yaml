apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.openshift.io: https://github.com/openshift/api/pull/979
    api.openshift.io/merged-by-featuregates: "true"
    description: Extension for sharing ConfigMaps across Namespaces
    displayName: SharedConfigMap
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    service.beta.openshift.io/inject-cabundle: "true"
  name: sharedconfigmaps.sharedresource.openshift.io
spec:
  group: sharedresource.openshift.io
  names:
    kind: SharedConfigMap
    listKind: SharedConfigMapList
    plural: sharedconfigmaps
    singular: sharedconfigmap
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "SharedConfigMap allows a ConfigMap to be shared across namespaces.\nPods
          can mount the shared ConfigMap by adding a CSI volume to the pod specification
          using the\n\"csi.sharedresource.openshift.io\" CSI driver and a reference
          to the SharedConfigMap in the volume attributes:\n\nspec:\n\n\tvolumes:\n\t-
          name: shared-configmap\n\t  csi:\n\t    driver: csi.sharedresource.openshift.io\n\t
          \   volumeAttributes:\n\t      sharedConfigMap: my-share\n\nFor the mount
          to be successful, the pod's service account must be granted permission to
          'use' the named SharedConfigMap object\nwithin its namespace with an appropriate
          Role and RoleBinding. For compactness, here are example `oc` invocations
          for creating\nsuch Role and RoleBinding objects.\n\n\t`oc create role shared-resource-my-share
          --verb=use --resource=sharedconfigmaps.sharedresource.openshift.io --resource-name=my-share`\n\t`oc
          create rolebinding shared-resource-my-share --role=shared-resource-my-share
          --serviceaccount=my-namespace:default`\n\nShared resource objects, in this
          case ConfigMaps, have default permissions of list, get, and watch for system
          authenticated users.\n\nCompatibility level 4: No compatibility is provided,
          the API can change at any point for any reason. These capabilities should
          not be used by applications needing long term support.\nThese capabilities
          should not be used by applications needing long term support."
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the specification of the desired shared configmap
            properties:
              configMapRef:
                description: configMapRef is a reference to the ConfigMap to share
                properties:
                  name:
                    description: name represents the name of the ConfigMap that is
                      being referenced.
                    type: string
                  namespace:
                    description: namespace represents the namespace where the referenced
                      ConfigMap is located.
                    type: string
                required:
                - name
                - namespace
                type: object
              description:
                description: description is a user readable explanation of what the
                  backing resource provides.
                type: string
            required:
            - configMapRef
            type: object
          status:
            description: status is the observed status of the shared configmap
            properties:
              conditions:
                description: conditions represents any observations made on this particular
                  shared resource by the underlying CSI driver or Share controller.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
