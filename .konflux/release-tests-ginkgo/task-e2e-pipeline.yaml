---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: e2e-test-ginkgo
spec:
  params:
    - name: CLUSTER_SECRET_REF
      type: string
      description: "Name of the Secret containing the cluster kubeconfig (key: kubeconfig)"
    - name: GIT_RELEASE_TESTS_URI
      default: https://github.com/openshift-pipelines/release-tests-ginkgo.git
    - name: GIT_RELEASE_TESTS_BRANCH
      default: main
    - name: CATALOG_SOURCE
      description: Provide catalog-source name through which user have to subscribe operator
      default: redhat-operators
    - name: CHANNEL
      default: latest
    - name: CHAINS_REPOSITORY
      default: "quay.io/openshift-pipeline/chainstest"
      description: the url of the repository where the test image will be pushed
    - name: FAIL_ON_ERROR
      default: "false"
    - name: IMAGE
      description: release-tests image
      default: quay.io/openshift-pipeline/ci
    - name: MODE
      description: "Test mode for run-tests.sh (e.g. install, e2e, sanity, or a custom label filter)"
      default: "e2e"
    - name: TEST_PATH
      description: "Override test path (default: ./tests/...)"
      default: ""
    - name: OCP_VERSION
      default: ""
    - name: MAG_USE_IMPERSONATION
      description: "Set to 'true' to use kubeconfig impersonation for MAG tests (required on HyperShift)"
      default: "false"

  volumes:
    - name: credentials
      secret:
        secretName: $(params.CLUSTER_SECRET_REF)
    - name: source
      emptyDir: {}
    - name: go-cache
      emptyDir: {}
  stepTemplate:
    image: $(params.IMAGE)
    volumeMounts:
      - name: source
        mountPath: /source
      - name: credentials
        mountPath: /credentials
      - name: go-cache
        mountPath: /go-cache
    env:
      - name: GOMODCACHE
        value: /go-cache/mod
      - name: GOCACHE
        value: /go-cache/build
  steps:
    - name: create-repo
      image: $(params.IMAGE)
      script: |
        mkdir -p /source/repo
        chmod 777 /source/repo
    - name: fetch-repo
      ref:
        resolver: http
        params:
          - name: url
            value: https://raw.githubusercontent.com/openshift-pipelines/tektoncd-catalog/p/stepactions/stepaction-git-clone/0.4.1/stepaction-git-clone.yaml
      params:
        - name: OUTPUT_PATH
          value: /source/repo
        - name: URL
          value: $(params.GIT_RELEASE_TESTS_URI)
        - name: REVISION
          value: $(params.GIT_RELEASE_TESTS_BRANCH)
    - name: run-e2e-tests
      image: $(params.IMAGE)
      workingDir: /source/repo
      env:
        - name: CHAINS_DOCKER_CONFIG_JSON
          valueFrom:
            secretKeyRef:
              key: config.json
              name: quay-io-dockerconfig
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: github-token
              name: github
              optional: true
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-token
              optional: true
        - name: GITLAB_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-webhook-token
              optional: true
        - name: GITLAB_GROUP_NAMESPACE
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-group-ns
              optional: true
        - name: GITLAB_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: pac-gitlab
              key: gitlab-project-id
              optional: true
        - name: KUBECONFIG
          value: "/tmp/kubeconfig"
        - name: CATALOG_SOURCE
          value: "$(params.CATALOG_SOURCE)"
        - name: CHANNEL
          value: "$(params.CHANNEL)"
        - name: CHAINS_REPOSITORY
          value: "$(params.CHAINS_REPOSITORY)"
        - name: OCP_VERSION
          value: "$(params.OCP_VERSION)"
        - name: MAG_USE_IMPERSONATION
          value: "$(params.MAG_USE_IMPERSONATION)"
        - name: CI
          value: "true"
      script: |
        cp /credentials/kubeconfig /tmp/kubeconfig

        go install github.com/onsi/ginkgo/v2/ginkgo@v2.32.1
        export PATH="$(go env GOPATH)/bin:$PATH"

        # --fail-on-focused does not exist in ginkgo v2 (always-on); patch the script
        sed -i 's/"--fail-on-focused" //g' ./scripts/run-tests.sh

        MODE="$(params.MODE)"
        TEST_PATH="$(params.TEST_PATH)"

        ARGS=("./scripts/run-tests.sh" "$MODE" "--ci")
        if [ -n "$TEST_PATH" ]; then
          ARGS+=("--path=$TEST_PATH")
        fi

        echo "Running: ${ARGS[*]}"
        exec "${ARGS[@]}"
