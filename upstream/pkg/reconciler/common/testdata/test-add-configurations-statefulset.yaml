apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tekton-results-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  serviceName: tekton-results-postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - image: postgres:14
          name: postgres
          ports:
            - containerPort: 5432
              name: postgres
