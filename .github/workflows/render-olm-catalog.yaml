name: render-olm-catalog

on:
  pull_request:
    branches:
      - release-v*
      - next
      - nightly
#    paths:
#      - .github/workflows/render-olm-catalog.yaml
  push:
    branches:
      - release-v*
      - next
      - nightly
    paths:
      - nightly-bundle.yaml
      - bundle.yaml
      - .github/workflows/render-olm-catalog.yaml
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'devel'
        type: choice
        options:
          - devel
concurrency:
  group: render-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Configure Docker authentication
        env:
          DOCKER_CONFIG: /home/runner/.docker
          DOCKER_JSON: ${{ secrets.DOCKER_REGISTRY_SECRET }}
        run: |
          echo ${DOCKER_JSON} > $DOCKER_CONFIG/config.json
          cat  $DOCKER_CONFIG/config.json | base64 -w 0 |  base64 -w 0
